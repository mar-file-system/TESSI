# create_ports.yaml
- name: Create dynamic MAC address from prefix
  set_fact:
    mac_address: "{{ mac_prefix }}{{ '%02d' | format(port_num + dhcp_mac_address_offset) }}"

- name: Debug MAC address and port number
  debug:
    msg: "Using MAC address {{ mac_address }} and port number {{ port_num }} and cidr_uuid {{ cidr_uuid }}"

- name: Add logical switch port
  command: >
    ovn-nbctl lsp-add {{ ovn_switch }} port{{ port_num }}
  when: "'dhcpsrv' in group_names"

- name: Set addresses for logical switch port
  command: >
    ovn-nbctl lsp-set-addresses port{{ port_num }} "{{ mac_address }} dynamic"
  when: "'dhcpsrv' in group_names"

- name: Set DHCPv4 options for logical switch port
  command: >
    ovn-nbctl lsp-set-dhcpv4-options port{{ port_num }} {{ cidr_uuid }}
  when: "'dhcpsrv' in group_names"

- name: Create corresponding port on dhcp client (Note currently only works when inventory has just one client) 
  command: >
    ovs-vsctl add-port {{ ovn_bridge }} port{{ port_num }} -- \
    set interface port{{ port_num }} \
    type=internal \
    mac='["{{ mac_address }}"]' \
    external_ids:iface-id=port{{ port_num }}
  when: "'dhcpsrv' not in group_names"
