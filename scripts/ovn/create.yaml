---
- name: Create OVS bridge on all hosts
  hosts: all
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/share/openvswitch/scripts:/usr/local/share/ovn/scripts"
  tasks:
    - name: Start Open vSwitch
      command: "ovs-ctl start"
      ignore_errors: yes

    - name: Start OVN
      command: "ovn-ctl start_controller"
      ignore_errors: yes

    - name: Create bridge
      openvswitch.openvswitch.openvswitch_bridge:
        bridge: "{{ bridgename }}"
        state: present

    - name: List OVS bridges to verify creation
      command: "ovs-vsctl show"
      register: bridge_output

    - name: Display bridge information
      debug:
        var: bridge_output.stdout

    - name: Start OVN northd on DHCP server nodes only
      command: "ovn-ctl start_northd"
      when: "'dhcpsrv' in group_names"

    - name: Reset OVN Northbound Database
      command: "ovn-nbctl --if-exists destroy nb_global ."
      when: "'dhcpsrv' in group_names"
      ignore_errors: yes

    - name: Reset OVN Southbound Database (optional)
      command: "ovn-sbctl --if-exists destroy sb_global ."
      when: "'dhcpsrv' in group_names"
      ignore_errors: yes

    - name: Set OVN southbound connection on DHCP server
      command: "ovn-sbctl set-connection ptcp:{{ south_port }}"
      when: "'dhcpsrv' in group_names"

    - name: Get the IP address of the dhcp server
      set_fact:
        dhcp_server_ip: "{{ ansible_default_ipv4.address }}"
      when: "'dhcpsrv' in group_names"
      delegate_facts: true

    - name: Propagate the server IP to all hosts
      set_fact:
        dhcp_server_ip: "{{ hostvars['in16']['dhcp_server_ip'] }}"
      delegate_to: localhost
      run_once: true

    - name: Set ovn-remote IP address dynamically
      command: >
        ovs-vsctl set open_vswitch . 
        external_ids:ovn-remote=tcp:{{ dhcp_server_ip }}:{{ south_port }}
        external_ids:ovn-encap-ip={{ ansible_default_ipv4.address }}
        external_ids:ovn-encap-type=geneve
        external_ids:system-id={{ ansible_hostname }}
      when: false # replace this with the module

    - name: Set OVN remote IP address and other external IDs
      openvswitch.openvswitch.openvswitch_db:
        table: open_vswitch
        record: "."
        col: external_ids
        key: ovn-remote
        value: "tcp:{{ dhcp_server_ip }}:{{ south_port }}"
      
    - name: Set OVN encap IP address
      openvswitch.openvswitch.openvswitch_db:
        table: open_vswitch
        record: "."
        col: external_ids
        key: ovn-encap-ip
        value: "{{ ansible_default_ipv4.address }}"

    - name: Set OVN encap type
      openvswitch.openvswitch.openvswitch_db:
        table: open_vswitch
        record: "."
        col: external_ids
        key: ovn-encap-type
        value: "geneve"

    - name: Set OVN system ID
      openvswitch.openvswitch.openvswitch_db:
        table: open_vswitch
        record: "."
        col: external_ids
        key: system-id
        value: "{{ ansible_hostname }}"

    - name: Restart OVN
      command: "ovn-ctl restart_controller"
      ignore_errors: yes

    - name: Run ovs-vsctl to get external_ids
      command: ovs-vsctl --columns=external_ids list open_vswitch
      register: ovs_output

    - name: Output result to console
      debug:
        msg: "{{ ovs_output.stdout }}"

    - name: Delete logical switch if it exists
      command: "ovn-nbctl --if-exists ls-del {{ logical_switch }}"
      when: "'dhcpsrv' in group_names"
      ignore_errors: yes

    - name: Create logical switch on the DCHP server from which we will allocate addresses via DHCP
      command: "ovn-nbctl ls-add {{ logical_switch }}"
      when: "'dhcpsrv' in group_names"
      ignore_errors: yes

    - name: Run ovn-nbctl to show the logical switch 
      command: ovn-nbctl show 
      register: ovn_output
      when: "'dhcpsrv' in group_names"

    - name: Output logical switch result to console
      debug:
        msg: "{{ ovn_output.stdout }}"
      when: "'dhcpsrv' in group_names"

    - name: Set subnet and exclude IPs for logical switch
      command: >
        ovn-nbctl set logical_switch {{ logical_switch }}
        other_config:subnet={{ subnet }}
        other_config:exclude_ips={{ exclude_ips }}
      when: "'dhcpsrv' in group_names"

    - name: Get existing DHCP options UUIDs for the subnet
      command: >
        ovn-nbctl --bare --columns=_uuid find dhcp_options cidr={{ subnet }}
      register: dhcp_options_uuids
      run_once: true
      when: "'dhcpsrv' in group_names"

    - name: Delete existing DHCP options for the subnet
      command: >
        ovn-nbctl --if-exists destroy dhcp_options {{ item }}
      loop: "{{ dhcp_options_uuids.stdout_lines }}"
      when: "'dhcpsrv' in group_names"
      ignore_errors: yes

    - name: Create DHCP options
      command: ovn-nbctl dhcp-options-create {{ subnet }}
      when: "'dhcpsrv' in group_names"

    - name: Get CIDR UUID for the specified subnet
      command: ovn-nbctl --bare --columns=_uuid find dhcp_options cidr={{ subnet }}
      register: cidr_uuid_output
      run_once: true
      when: "'dhcpsrv' in group_names"

    - name: Set CIDR UUID fact
      set_fact:
        cidr_uuid: "{{ cidr_uuid_output.stdout }}"
      run_once: true
      when: "'dhcpsrv' in group_names"

    - name: Set DHCP options with CIDR UUID
      command: >
        ovn-nbctl dhcp-options-set-options {{ cidr_uuid }} \
        lease_time=3600 \
        router={{ subnet_gateway }} \
        server_id={{ subnet_gateway }} \
        server_mac={{ dhcp_server_mac }}
      when: "'dhcpsrv' in group_names"

    - name: List DHCP options
      command: >
        ovn-nbctl list dhcp_options
      register: dhcp_options_output
      when: "'dhcpsrv' in group_names"

    - name: Show DHCP options output
      debug:
        var: dhcp_options_output.stdout
      when: "'dhcpsrv' in group_names"

    - name: Create logical switch ports dynamically
      loop: "{{ range(1, number_of_ports + 1) | list }}"
      loop_control:
        loop_var: port_index
      include_tasks: create_ports.yaml
      vars:
        port_num: "{{ port_index }}"
      when: "'dhcpsrv' in group_names"

    - name: Capture OVN configuration
      command: >
        ovn-nbctl show
      register: ovn_show_output
      run_once: true
      when: "'dhcpsrv' in group_names"

    - name: Show OVN configuration output
      debug:
        var: ovn_show_output.stdout
      when: "'dhcpsrv' in group_names"
