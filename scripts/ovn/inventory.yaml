all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no'
    bridgename: tassi_br
    south_port: 6642
    logical_switch: tassi_sw
    subnet: "172.31.0.0/16"
    exclude_ips: "172.31.0.1..172.31.0.33" # reserve some IP addresses in case we want to statically define some later
    subnet_gateway: "172.31.0.1"
    dhcp_server_mac: "c0:ff:ee:00:00:01"
    mac_prefix: "c0:ff:ee:00:00:"
    number_of_ports: 3
    dhcp_mac_address_offset: 1
  children:
    dhcpsrv:
      vars:
        hds: [5]
      hosts:
        in16:
          ip: 83
    dhcpclients:
      vars:
        hds: [1]
      hosts:
        in07:
          ip: 84
