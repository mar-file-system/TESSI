all:
  vars:
    wireguard:
      base_ip: "192.68.2"
      interface: "wg0"
      priv_key: "/tmp/wg_private"
    libvirt:
      base_ip: "192.68.3"
      interface: "virbrwg"
      name: "wireguard-virt"
    vm_defaults:
      machine: "pc-q35-rhel8.2.0"
      memory: "2048"
      vcpu: "2"
      server_image: "/var/lib/libvirt/images/gold-beegfs-almalinux8-server.qcow2"
      client_image: "/var/lib/libvirt/images/gold-beegfs-almalinux8-server.qcow2"
      netone: "default"
      nettwo: "{{ libvirt.name }}"

  children:
    physical_hosts:
      hosts:
        in07:
          wireguard_ip: "{{ wireguard.base_ip }}.7"
          libvirt_addresses: "{{ libvirt.base_ip }}.0/28"
          vms:
            - [ "beegfs-client00", 2, none, "client" ]
            - [ "beegfs-client01", 3, none, "client" ]
            - [ "beegfs-meta00",   4, 5, "server" ]
#       in15:
#         wireguard_ip: "{{ wireguard.base_ip }}.15"
#         libvirt_addresses: "{{ libvirt.base_ip }}.16/28"
        in16:
          wireguard_ip: "{{ wireguard.base_ip }}.16"
          libvirt_addresses: "{{ libvirt.base_ip }}.32/28"
          vms:
            - [ "beegfs-meta01",   34,  5, "server" ]
            - [ "beegfs-data00",   35, 10, "server" ]
            - [ "beegfs-data01",   36, 10, "server" ]
