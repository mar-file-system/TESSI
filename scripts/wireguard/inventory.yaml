all:
  vars:
    wireguard:
      base_ip: "192.68.2"
      interface: "wg0"
      priv_key: "/tmp/wg_private"
      bridge: "br-wg"
    libvirt:
      base_ip: "192.68.3"
      interface: "virbrwg"
      name: "wireguard-virt"

  children:
    physical_hosts:
      hosts:
        in07:
          wireguard_ip: "{{ wireguard.base_ip }}.7"
          libvirt_addresses: "{{ libvirt.base_ip }}.0/28"
          libvirt_first_address: "1"
          libvirt_last_address: "14"
#       in15:
#         wireguard_ip: "{{ wireguard.base_ip }}.15"
#         libvirt_addresses: "{{ libvirt.base_ip }}.16/28"
#         libvirt_first_address: "17"
#         libvirt_last_address: "30"
        in16:
          wireguard_ip: "{{ wireguard.base_ip }}.16"
          libvirt_addresses: "{{ libvirt.base_ip }}.32/28"
          libvirt_first_address: "33"
          libvirt_last_address: "46"

