all:
  vars:
    cluster:
      system: "beegfs"
      version: "7.4.3"
      distro: "almalinux8"
      description_file: "/tmp/system_description.tf"
    etchosts_mark: "# {mark} TASSI {{ cluster.system }} {{ cluster.distro }} VMs - managed by Ansible"
    wireguard:
      base_ip: "192.68.2"
      cidr: 24
      interface: "wg0"
      priv_key: "/tmp/wg_private"
    libvirt:
      base_ip: "192.68.3"
      cidr: 28
      interface: "virbrwg"
      name: "wireguard-virt"
    vm_defaults:
      machine: "pc-q35-rhel8.2.0"
      memory: "2048"
      vcpu: "2"
      server_image: "/mnt/usrc-storage-nfs/jbent/images/{{ cluster.system }}/{{ cluster.version }}/{{ cluster.distro }}/gold-{{ cluster.system }}-{{ cluster.distro }}-server.qcow2"
      client_image: "/mnt/usrc-storage-nfs/jbent/images/{{ cluster.system }}/{{ cluster.version }}/{{ cluster.distro }}/gold-{{ cluster.system }}-{{ cluster.distro }}-client.qcow2"
      netone: "default"
      nettwo: "{{ libvirt.name }}"

  children:
    physical_hosts:
      hosts:
        in07:
          wireguard_ip: "{{ wireguard.base_ip }}.7"
          libvirt_addresses: "{{ libvirt.base_ip }}.0/{{ libvirt.cidr }}"
          vms:
            - [ "beegfs-client00", 2, none, "client" ]
            - [ "beegfs-client01", 3, none, "client" ]
            - [ "beegfs-meta00",   4, 5, "server" ]
#       in15:
#         wireguard_ip: "{{ wireguard.base_ip }}.15"
#         libvirt_addresses: "{{ libvirt.base_ip }}.16/28"
        in16:
          wireguard_ip: "{{ wireguard.base_ip }}.16"
          libvirt_addresses: "{{ libvirt.base_ip }}.32/{{ libvirt.cidr }}"
          vms:
            - [ "beegfs-meta01",   34,  5, "server" ]
            - [ "beegfs-data00",   35, 10, "server" ]
            - [ "beegfs-data01",   36, 10, "server" ]
