# follows instructions from here: https://www.wireguard.com/quickstart/
---
- name: Set up wireguard tunnels
  hosts: physical_hosts
  tasks:
    - name: Compute subnet base and CIDR
      set_fact:
        subnet_base: "{{ libvirt_addresses.split('.')[3].split('/')[0] | int }}"
        cidr: "{{ libvirt_addresses.split('/')[1] }}"

    - name: Compute usable addresses and first addresses
      set_fact:
        usable_addresses: "{{ (2 ** (32 - cidr | int)) - 2 }}"
        libvirt_first_address: "{{ subnet_base | int + 1 }}"

    - name: Compute last addresses
      set_fact:
        libvirt_last_address: "{{ subnet_base | int + usable_addresses | int }}"

    - name: Debug IP ranges
      debug:
        msg: "{{ inventory_hostname }}: WireGuard {{ wireguard_ip }}, lvirt {{ libvirt_addresses }} {{ libvirt_first_address }}-{{ libvirt_last_address }}, sub {{ subnet_base }}, cidr {{ cidr }}, "

    - name: Delete network interface and bridge
      ansible.builtin.command:
        cmd: "ip link delete {{ item }}"
      with_items:
        - "{{ wireguard.interface }}"
      ignore_errors: true
      tags: cleanup

    - name: Destroy and undefine the libvirt network
      command: "virsh net-{{ item }} {{ libvirt.name }}"
      with_items:
        - destroy
        - undefine
      ignore_errors: true
      tags: cleanup

    - name: Gather routes referencing specific interfaces
      ansible.builtin.command:
        cmd: "ip route show | grep '{{ item }}'"
      with_items:
        - "{{ wireguard.interface }}"
        - "{{ libvirt.interface }}"
      register: found_routes
      failed_when: found_routes.rc != 0 and found_routes.stdout != ""
      tags:
        - cleanup

    - name: Delete routes referencing specific interfaces
      ansible.builtin.command:
        cmd: "ip route del {{ item }}"
      with_items: "{{ found_routes.results | map(attribute='stdout_lines') | flatten }}"
      ignore_errors: true
      tags:
        - cleanup

    - name: Create wireguard interface
      ansible.builtin.command:
        cmd: "ip link add dev {{ wireguard.interface }} type wireguard"

    - name: Set IPRANGE fact
      set_fact:
        IPRANGE: "{{ wireguard_ip }}/24"

    - name: Debug IPRANGE
      debug:
        msg: "Host {{ inventory_hostname }} has IPRANGE set to {{ IPRANGE }}"

    - name: Add IP address to interface
      ansible.builtin.command:
        cmd: "ip address add dev {{ wireguard.interface }} {{ IPRANGE }}"

    - name: Generate private key
      ansible.builtin.command:
        cmd: "wg genkey"
      register: private_key_result

    - name: Save private key to file
      ansible.builtin.copy:
        content: "{{ private_key_result.stdout }}"
        dest: "{{ wireguard.priv_key }}"

    - name: Generate public key
      ansible.builtin.command:
        cmd: "wg pubkey"
      register: public_key_result
      args:
        stdin: "{{ private_key_result.stdout }}"

    - name: Debug public key
      debug:
        msg: "Generated public key: {{ public_key_result.stdout }}"

    - name: Set WireGuard private key
      ansible.builtin.command:
        cmd: "wg set {{ wireguard.interface }} private-key {{ wireguard.priv_key }}"

    - name: Delete private key file
      ansible.builtin.file:
        path: "{{ wireguard.priv_key }}"
        state: absent

    - name: Bring up WireGuard interface
      ansible.builtin.command:
        cmd: "ip link set {{ wireguard.interface }} up"

    - name: Get WireGuard listening port
      ansible.builtin.command:
        cmd: "wg show {{ wireguard.interface }} listen-port"
      register: wg_listen_port_result

    - name: Set WG_LISTENING_PORT fact
      set_fact:
        WG_LISTENING_PORT: "{{ wg_listen_port_result.stdout }}"

    - name: Set PUBLIC_IP fact using default Ansible variable
      set_fact:
        PUBLIC_IP: "{{ ansible_default_ipv4.address }}"

    - name: Gather public keys and IPs of all hosts
      ansible.builtin.set_fact:
        host_data: >
          {%- set data = [] -%}
          {%- for host in hostvars -%}
          {%- set info = {
              'hostname': hostvars[host]['inventory_hostname'],
              'public_key': hostvars[host]['public_key_result']['stdout'] | default(''),
              'wireguard_ip': hostvars[host]['wireguard_ip'] | default(''),
              'PUBLIC_IP': hostvars[host]['PUBLIC_IP'] | default(''),
              'WG_LISTENING_PORT': hostvars[host]['WG_LISTENING_PORT'] | default(''),
              'libvirt_addresses': hostvars[host]['libvirt_addresses'] | default('')
            } -%}
          {{ data.append(info) }}
          {%- endfor -%}
          {{ data }}

    - name: Share host data across all hosts
      ansible.builtin.debug:
        msg: "Host data: {{ host_data }}"

    - name: Configure peers on each host
      ansible.builtin.shell: |
        wg set {{ wireguard.interface }} peer {{ item.public_key }} allowed-ips {{ item.wireguard_ip }}/32,{{ item.libvirt_addresses }} endpoint {{ item.PUBLIC_IP }}:{{ item.WG_LISTENING_PORT }}
      with_items: "{{ host_data | selectattr('hostname', 'ne', inventory_hostname) | list }}"

    - name: Ping WireGuard IPs of all other hosts
      ansible.builtin.shell: "ping -c 1 {{ item.wireguard_ip }}"
      with_items: "{{ host_data | selectattr('hostname', 'ne', inventory_hostname) | list }}"
      register: ping_results

    - name: Debug ping results
      ansible.builtin.debug:
        msg: "Ping result for {{ item.item.wireguard_ip }}: {{ item.stdout }}"
      with_items: "{{ ping_results.results }}"

    # this ends the basic wireguard installation. 
    # the rest is setting up the libvirt network integration

    - name: Add route to VM networks via WireGuard
      ansible.builtin.command:
        cmd: "ip route add {{ item.libvirt_addresses }} dev {{ wireguard.interface }}"
      with_items: "{{ host_data | selectattr('hostname', 'ne', inventory_hostname) | list }}"

    - name: Allow traffic from WireGuard to VM network
      ansible.builtin.command:
        cmd: "iptables -I LIBVIRT_FWI 1 -i {{ wireguard.interface }} -o {{ libvirt.interface }} -j ACCEPT"

    - name: Allow traffic from VM network to WireGuard
      ansible.builtin.command:
        cmd: "iptables -I LIBVIRT_FWO 1 -i {{ libvirt.interface }} -o {{ wireguard.interface }} -j ACCEPT"

    - name: Create libvirt network
      community.libvirt.virt_net:
        name: "{{ libvirt.name }}"
        state: present
        xml: |
          <network>
            <name>{{ libvirt.name }}</name>
            <bridge name="{{ libvirt.interface }}" />
            <ip address="{{ libvirt_addresses.split('/')[0] }}" netmask="255.255.255.240">
              <dhcp>
                <range start="{{ libvirt.base_ip }}.{{ libvirt_first_address }}" end="{{ libvirt.base_ip }}.{{ libvirt_last_address }}" />
              </dhcp>
            </ip>
            <dns>
              <forwarder addr="8.8.8.8"/>
              <forwarder addr="8.8.4.4"/>
            </dns>
          </network>

    - name: Create libvirt network
      community.libvirt.virt_net:
        name: "{{ libvirt.name }}"
        state: active

    - name: Create libvirt network
      community.libvirt.virt_net:
        name: "{{ libvirt.name }}"
        autostart: true

