# Ansible Playbook for Dynamic Network Graph and Validation
- hosts: all
  gather_facts: yes
  gather_subset:
    - network
  vars:
    testing_with_fake_peer: true
    FAKE_ENDPOINT: "192.192.192.192:51820"
    FAKE_ALLOWED_IPS: "192.192.192.0/24"
  tasks:
    - name: Collect network information
      include_tasks: collect_network_info.yaml

    - name: Save collected data to a JSON file
      copy:
        content: "{{ hostvars | to_json }}"
        dest: /tmp/hostvars.json
      run_once: true
      delegate_to: localhost
      when: true 
      tags: debug

    # Create the artifacts directory if it doesn't exist
    - name: Create artifacts directory
      ansible.builtin.file:
        path: artifacts
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Render graph in DOT format
      template:
        src: templates/graph.dot.j2
        dest: artifacts/graph.dot
      run_once: true
      delegate_to: localhost

    - name: Convert DOT file to PNG
      shell: dot -Tpng artifacts/graph.dot -o artifacts/graph.png
      args:
        executable: /bin/bash
      register: dot_to_png_result
      run_once: true
      delegate_to: localhost
