- name: Debug ping results data
  debug:
    msg:
      - "Item: {{ item }}"
      - "RC: {{ item.rc if item is mapping and 'rc' in item else 'N/A' }}"
      - "Destination: {{ item.item if item is mapping else 'N/A' }}"
  with_items: "{{ ping_results_data }}"
  when: ping_results_data is defined and false
  no_log: true

- name: Record ping results
  set_fact:
    ping_results: >-
      {{
        ping_results + [{
          'src': inventory_hostname,
          'dst': item.item,
          'success': (item.rc == 0)
        }]
      }}
  with_items: "{{ ping_results_data }}"
  loop_control:
    label: "{{ item.item }}"
