all:
  hosts:
    localhost:
      ansible_connection: local
      vm_directory: "/mnt/usrc-storage-nfs/jbent/images"
      kickstart_dir: "/tmp"
      vms:
        # default values for each gold VM. Can be overwritten in the individual definitions
        defaults:
          iso: "/mnt/usrc-storage-nfs/jbent/images/alma/AlmaLinux-8.10-x86_64-minimal.iso"
          network:
            bootproto: "dhcp"
            default: "default"
            device: "enp1s0"
            ipv6: "noipv6"
            ntpservers:
              - "0.pool.ntp.org"
              - "1.pool.ntp.org"
              - "2.pool.ntp.org"
              - "3.pool.ntp.org"
            onboot: "yes"
          os_variant: "almalinux8"
          root_pwd: "password"
          ssh_keys: '/home/jbent/.ssh/authorized_keys'
          timezone: "US/Mountain"
        individual:
          - name: gold-beegfs-almalinux8-server
            disk_size: 12
            memory: 2048
            vcpu: 2
          - name: gold-beegfs-almalinux8-client
            disk_size: 6
            memory: 1024
            vcpu: 1
