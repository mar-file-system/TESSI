- name: Add VM {{ item.name }} to ansible inventory
  add_host:
    name: "{{ item.name }}"
    groups: "{{ item.group }}"

- name: Ensure VM {{ item.name }} is running
  community.libvirt.virt:
    name: "{{ item.name }}"
    state: running
    uri: qemu:///system

- name: Wait for SSH on VM {{ item.name }}
  wait_for:
    host: "{{ item.name }}"
    port: 22
    state: started
    timeout: 300


