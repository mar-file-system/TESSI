- block:
    - name: Collect existant VMs
      community.libvirt.virt:
        command: list_vms
      register: all_vms

    - name: Set fact if VM {{ item.name }} exists
      set_fact:
        vm_exists: "{{ item.name in all_vms.list_vms }}"
  check_mode: no 

- block:
    - name: Check whether to skip creation if VM {{ item.name }} already exists
      debug:
        msg: "VM {{ item.name }} already exists. Not recreating it. Pass --tags makeclean to force recreation."

    - name: Sleep for 2 seconds if VM creation is skipped
      wait_for:
        timeout: 2
      when: false # disable this. Too much delay. Unnecessary.
  when: vm_exists 

- block:
   - name: Create kickstart file for VM {{ item.name }}  
     template:
       src: kickstart.j2
       dest: "{{ kickstart_dir }}/{{ item.name }}.ks"

   - name: Debug kickstart file creation
     debug:
       msg: "Created {{ kickstart_dir }}/{{ item.name }}.ks for {{ item.name }}"

   - name: Install VM {{ item.name }}
     command: >
       virt-install
       --name "{{ item.name }}"
       --ram "{{ item.memory }}"
       --vcpus "{{ item.vcpu }}"
       --os-type linux
       --os-variant "{{ item.os_variant }}"
       --network network="{{ item.network.default }}"
       --graphics none
       --initrd-inject "{{ kickstart_dir }}/{{ item.name }}.ks"
       --noautoconsole
       --wait 20
       --disk path={{ vm_directory }}/{{ item.name }}.img,size={{ item.disk_size }}
       --location "{{ item.iso }}"
       --extra-args "inst.text inst.ks=file:/{{ item.name }}.ks console=tty0 console=ttyS0,115200n8"
     timeout: 3600  # Set timeout to 1 hour (3600 seconds)
     register: virt_install_output

   - name: Debug VM installation output
     debug:
       msg: "VM {{ item.name }} installation completed with output: {{ virt_install_output.stdout }}"

  when: not vm_exists 
