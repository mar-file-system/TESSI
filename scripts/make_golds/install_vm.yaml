- block:
    - name: Stop VM {{ item.name }} if it is running
      command: "virsh destroy {{ item.name }}"
      register: destroy_result
      ignore_errors: yes

    - name: Wait for VM {{ item.name }} to stop
      command: "virsh domstate {{ item.name }}"
      register: vm_shutdown_state
      retries: 5
      delay: 2
      until: vm_shutdown_state.stdout.strip() == "shut off"
      when: destroy_result.rc == 0  # Run only if 'destroy' was successful
      ignore_errors: yes

    - name: Undefine the VM {{ item.name }}
      command: "virsh undefine {{ item.name }}"
      ignore_errors: yes

    - name: Wait until the VM {{ item.name }} is undefined
      command: "virsh list --all --name"
      register: vm_list
      retries: 10
      delay: 5
      until: item.name not in vm_list.stdout_lines

    - name: Remove any existing image file for VM {{ item.name }} if makeclean was passed
      file:
        path: "{{ vm_directory }}/{{ item.name }}.img"
        state: absent
  ignore_errors: yes
  when: "'makeclean' in ansible_run_tags"
  tags:
    - makeclean

- name: Check if VM {{ item.name }} exists
  command: "virsh dominfo {{ item.name }}"
  register: vm_check
  ignore_errors: yes

- block:
    - name: Skip creation if VM {{ item.name }} already exists
      debug:
        msg: "VM {{ item.name }} already exists. Not recreating it. Pass --tags makeclean to force recreation."

    - name: Sleep for 2 seconds if VM creation is skipped
      wait_for:
        timeout: 2
  when: vm_check.rc == 0

- block:
   - name: Create kickstart file for VM {{ item.name }}  
     template:
       src: kickstart.j2
       dest: "{{ kickstart_dir }}/{{ item.name }}.ks"

   - name: Debug kickstart file creation
     debug:
       msg: "Created {{ kickstart_dir }}/{{ item.name }}.ks for {{ item.name }}"

   - name: Install VM {{ item.name }}
     command: >
       virt-install
       --name "{{ item.name }}"
       --ram "{{ item.memory }}"
       --vcpus "{{ item.vcpu }}"
       --os-type linux
       --os-variant "{{ item.os_variant }}"
       --network network="{{ item.network.default }}"
       --graphics none
       --initrd-inject "{{ kickstart_dir }}/{{ item.name }}.ks"
       --noautoconsole
       --wait 20
       --disk path={{ vm_directory }}/{{ item.name }}.img,size={{ item.disk_size }}
       --location "{{ item.iso }}"
       --extra-args "inst.text inst.ks=file:/{{ item.name }}.ks console=tty0 console=ttyS0,115200n8"
     timeout: 3600  # Set timeout to 1 hour (3600 seconds)
     register: virt_install_output

   - name: Debug VM installation output
     debug:
       msg: "VM {{ item.name }} installation completed with output: {{ virt_install_output.stdout }}"

  when: vm_check.rc != 0

