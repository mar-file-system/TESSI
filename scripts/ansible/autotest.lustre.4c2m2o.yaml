# this inventory describes a lustre cluster following these instructions: 
# https://gitlab.newmexicoconsortium.org/jbent/tassi/-/blob/main/doc/lustre_install/lustre_vm.pdf
# additionally, the node on which this is run might need to be set up correctly:
# https://gitlab.newmexicoconsortium.org/jbent/tassi/-/blob/main/doc/lustre_install/john_notes.txt
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o UserKnownHostsFile=/dev/null'
    ansible_playbooks:
        install: './ansible/install_lustre_all.yaml'
        config: './ansible/configure_lustre_all.yaml'
        test: './ansible/test_lustre.yaml'
    test_script: 
        path: './tests/mpi_ior.py'
        args: '--test_file /mnt/lustre/testfile --mpi_hosts client00,client01,client02,client03 --pdsh_hosts client00,client01,client02,client03,mds00,mds01,oss00,oss01' 
    vm_dir: '/mnt/usrc-storage-nfs/jbent/images' 
    bootstrap_vm:
      cpus: 2
      boot_hdd_gbs: 12
      memory_mbs: 4096
      root_pwd: password
      location: '/mnt/usrc-storage-nfs/jbent/images/alma/AlmaLinux-8.10-x86_64-minimal.iso'
      os_variant: 'almalinux8'
      auth_keys: '/home/jbent/.ssh/authorized_keys'
    network: 
      addr: '192.168.56'
    system:
      type: 'lustre'
      mgs_node: '192.168.56.10@tcp:192.168.56.20@tcp'
      version: 2.15.4
      backfstype: 'zfs'
      repo: 'git://git.whamcloud.com/fs/lustre-release.git'
      patch: '/mnt/usrc-storage-nfs/jbent/patches/lustre/test_patch.patch'
      backend:
        version: zfs-2.1.11
        repo: 'https://github.com/openzfs/zfs.git'
        patch: '/mnt/usrc-storage-nfs/jbent/patches/zfs/zfs_patch1.patch'
  children:
    clients:
      vars:
        configure_args: '--disable-server --enable-client'
        target_mount: '/mnt/lustre'
        hds: []
      hosts:
        client00:
          ip: 50
        client01:
          ip: 60
        client02:
          ip: 70
        client03:
          ip: 80
    servers:
      vars:
        configure_args: '--with-zfs --disable-ldiskfs --enable-server'
      children:
        mds:
          vars:
            target_type: mdt
          hosts:
            mds00:
              ip: 10
              failnode: 20
              index: 0
              mgt_mount: '/mnt/lustre/mgt'
              mgt_target: 'lustre-mgs' 
              target: 'lustre-mds00/mdt0'
              target_mount: '/mnt/lustre/mds00.mdt0'
              hds: [5, 5]
            mds01:
              ip: 20
              failnode: 10
              index: 1
              target: 'lustre-mds01/mdt0'
              target_mount: '/mnt/lustre/mds01.mdt0'
              hds: [5]
        oss:
          vars: 
            target_type: ost
            hds: [10]
          hosts:
            oss00:
              ip: 30
              failnode: 40
              index: 0
              target: 'lustre-oss00/ost0'
              target_mount: '/mnt/lustre/oss00.ost0'
            oss01:
              ip: 40
              failnode: 30
              index: 1
              target: 'lustre-oss01/ost0'
              target_mount: '/mnt/lustre/oss01.ost0'
