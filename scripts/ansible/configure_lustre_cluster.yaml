---
- name: Configure a Lustre Cluster 
  hosts: all
  gather_facts: false # needed for {{ ansible_architecture }}
  any_errors_fatal: true
  vars_files:
    - ./lustre_vars.yaml

  tasks:
    - name: Disable firewalld
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      tags: 
        - firewalld
        - lustre
        - config

    - name: Check status of firewalld
      systemd:
        name: firewalld
        state: started
      register: firewalld_status
      ignore_errors: yes
      tags: 
        - firewalld
        - lustre
        - config

    - name: Verify firewalld is disabled
      assert:
        that:
          - firewalld_status.status.ActiveState == 'inactive'
        fail_msg: "Error: firewalld is not disabled."
      no_log: yes
      tags:
        - firewalld
        - lustre
        - config

    - name: Check SELinux status
      command: getenforce
      register: selinux_status
      changed_when: false
      tags:
        - selinux
        - lustre
        - config

    - name: Verify SELinux is disabled
      assert:
        that:
          - selinux_status.stdout == "Disabled"
        fail_msg: "Error: SELinux is not disabled. Current status is {{ selinux_status.stdout }}"
      no_log: yes
      tags:
        - selinux
        - lustre
        - config

    - name: Verify {{ module_name }} module is loaded
      command: lsmod
      register: lsmod_output
      failed_when: "module_name not in lsmod_output.stdout"
      no_log: yes
      loop:
        - lustre
        - zfs
      loop_control:
        loop_var: module_name
      tags:
        - modules
        - lustre
        - config

    - name: Create /etc/modprobe.d/lustre.conf
      copy:
        dest: /etc/modprobe.d/lustre.conf
        content: |
          options lnet ip2nets="tcp0(enp0s8) 192.168.56.[10,20,30,40,50]"
        owner: root
        group: root
        mode: '0644'
      tags:
        - lustre
        - config

