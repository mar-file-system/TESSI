---
- name: Test DNF Mirror Setup
  hosts: all
  become: yes

  tasks:
    - name: Check if running as root
      fail:
        msg: "Warning: This script must be run as root."
      when: ansible_user_id != 'root'

    - name: Clean DNF cache
      command: dnf clean all
      ignore_errors: yes

    - name: Verify if DNF repo file exists
      stat:
        path: /etc/yum.repos.d/local-mirror.repo
      register: repo_file

    - name: Fail if DNF repo file does not exist
      fail:
        msg: "DNF mirror repo configuration file not found!"
      when: not repo_file.stat.exists

    - name: List enabled repositories
      command: dnf repolist enabled
      register: repolist_output
      ignore_errors: yes

    - name: Show enabled repositories
      debug:
        var: repolist_output.stdout_lines

    - name: Install a test package from the DNF mirror
      command: dnf install -y sl
      register: install_output
      ignore_errors: yes

    - name: Check if the package installation was successful
      debug:
        var: install_output.stdout_lines

    - name: Ensure the package is installed
      command: rpm -q sl
      register: check_package
      ignore_errors: yes

    - name: Fail if the package installation failed
      fail:
        msg: "Package installation failed! The DNF mirror may not be working properly."
      when: check_package.rc != 0

