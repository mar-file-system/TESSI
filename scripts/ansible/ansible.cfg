[defaults]
stdout_callback = debug
host_key_checking = False

[persistent_connection]
connect_timeout = 30
connect_retries = 5
connect_interval = 5

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60
ansible_ssh_common_args = -o UserKnownHostsFile=/dev/null
