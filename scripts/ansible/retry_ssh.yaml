- name: Wait for SSH and use virsh to restart if wait times-out 
  block:
    - name: Increment the retry count
      set_fact:
        retry_count: "{{ 0 if retry_count is undefined else retry_count | int + 1 }}"
        max_retries: 3

    - name: Attempt to wait for SSH port to be ready
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
      delegate_to: localhost

  rescue:
    - fail:
        msg: Maximum retries of ssh reached
      when: retry_count | int == max_retries

    - debug:
        msg: "Task Group failed, let's give it another shot"

    - name: Check if VM is running
      command: virsh domstate {{ inventory_hostname }}
      register: vm_state
      delegate_to: localhost
      ignore_errors: true

    - name: Restart VM using virsh if running
      command: virsh reboot {{ inventory_hostname }}
      delegate_to: localhost
      ignore_errors: true
      when: vm_state.stdout.strip() == 'running'

    - name: Start VM using virsh if not running
      command: virsh start {{ inventory_hostname }}
      delegate_to: localhost
      ignore_errors: true
      when: vm_state.stdout.strip() != 'running'


    - name: Pause for 60 seconds
      pause:
        seconds: 60

    - include_tasks: retry_ssh.yaml
