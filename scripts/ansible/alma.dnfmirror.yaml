# this inventory is an initial attempt at creating an alma VM to work as a dnf mirror 
# https://gitlab.newmexicoconsortium.org/jbent/tassi/-/blob/main/doc/lustre_install/lustre_vm.pdf
# additionally, the node on which this is run might need to be set up correctly:
# https://gitlab.newmexicoconsortium.org/jbent/tassi/-/blob/main/doc/lustre_install/john_notes.txt
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o UserKnownHostsFile=/dev/null'
    ansible_playbooks:
        install: './ansible/install_dnfmirror.yaml'
        config: './ansible/configure_dnfmirror.yaml'
        test: './ansible/test_dnfmirror.yaml'
    test_script: 
        path: './tests/test_pdsh.sh'
        args: 'dnfmirror' 
    nfs_export: '/mnt/usrc-storage-nfs'
    vm_dir: '/mnt/usrc-storage-nfs/jbent/images' 
    boot_vm_name: 'bootstrapdnfalma'
    bootstrap_vm:
      cpus: 2
      boot_hdd_gbs: 12
      memory_mbs: 4096
      root_pwd: password
      location: '/mnt/usrc-storage-nfs/jbent/images/alma/AlmaLinux-8.10-x86_64-minimal.iso'
      os_variant: 'almalinux8'
      auth_keys: '/home/jbent/.ssh/authorized_keys'
    network: 
      addr: '192.168.56'
    system:
      type: 'dnfmirror'
  children:
    servers:
      vars:
        hds: [5]
      hosts:
        meta00:
          nfs_import: '{{ nfs_export }}'
          ip: 83
    clients:
      vars:
        hds: [1]
      hosts:
        client00:
          ip: 84
        client01:
          ip: 85
