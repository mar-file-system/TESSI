---
- name: Configure a Lustre Cluster 
  hosts: all
  gather_facts: false # needed for {{ ansible_architecture }}, do it later so we can wait for ssh
  any_errors_fatal: true

  tasks:
    - name: Wait for SSH to become ready
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        state: started
        timeout: 300
      delegate_to: localhost
      become: false

    - name: Gather facts
      setup:

    - name: Check firewall status
      ansible.builtin.service:
        name: firewalld
        state: stopped
      register: firewall_status
      failed_when: firewall_status.state == "running"
      tags:
        - lustre
        - config
        - precheck

    - name: Check SELinux status
      command: getenforce
      register: selinux_status
      changed_when: false
      tags:
        - selinux
        - lustre
        - config
        - precheck

    - name: Verify SELinux is disabled
      assert:
        that:
          - selinux_status.stdout == "Disabled"
        fail_msg: "Error: SELinux is not disabled. Current status is {{ selinux_status.stdout }}"
      no_log: yes
      tags:
        - selinux
        - lustre
        - config
        - precheck

    - name: Ping other nodes to ensure hostonly network is working
      command: "ping -c 3 {{ hostvars[item].network.addr }}.{{ hostvars[item].ip }}"
      with_items: "{{ groups['all'] }}"
      when: "inventory_hostname != item"
      ignore_errors: true
      register: ping_result

    - name: Load ZFS kernel module
      modprobe:
        name: zfs
        state: present
      when: "'servers' in group_names"
      tags: 
        - configure
        - zfs
        - modules

    - name: Ensure ZFS kernel module is loaded on reboot
      copy:
        dest: /etc/modules-load.d/zfs.conf
        content: |
          # Load ZFS module on boot
          zfs
      when: "'servers' in group_names"
      tags:
        - configure
        - zfs
        - modules 

    - name: Rebuild module dependency map after ZFS modules loaded
      command: depmod -a
      tags: 
        - configure
        - modules
        - lustre
        - zfs

    - name: Construct the IP address
      set_fact:
        node_ip: "{{ network.addr }}.{{ ip }}"
      tags: 
        - configure
        - modules
        - lustre

    - name: Query the interface name
      shell: "ip -o -4 addr show | awk '/{{ node_ip }}/{print $2}'"
      register: interface_name
      changed_when: false
      tags: 
        - configure
        - modules
        - lustre

    - name: Gather all IP addresses
      set_fact:
        all_ips: "{{ groups['all'] | map('extract', hostvars, 'ip') | list }}"
      run_once: true
      tags: 
        - configure
        - modules
        - lustre

    - name: Dynamically construct the modprobe_opts variable
      set_fact:
        modprobe_opts: "options lnet ip2nets=\"tcp0({{ interface_name.stdout }}) {{ network.addr }}.[{{ all_ips | join(',') }}]\"\n"
      tags: 
        - configure
        - modules
        - lustre

    - name: Write the modprobe_opts value to /etc/modprobe.d/lustre.conf
      copy:
        dest: /etc/modprobe.d/lustre.conf
        content: "{{ modprobe_opts }}"
        mode: 0644
      tags: 
        - configure
        - modules
        - lustre

    - name: Load Lustre modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - ksocklnd
        - lustre
      tags:
        - install
        - modules
        - lustre

    - name: Ensure Lustre modules are loaded on reboot
      copy:
        dest: /etc/modules-load.d/lustre.conf
        content: |
          # Load Lustre modules on boot
          ksocklnd
          lustre
      tags:
        - install
        - modules
        - lustre

    - name: Rebuild module dependency map after Lustre modules loaded
      command: depmod -a
      tags: 
        - configure
        - modules
        - lustre

    - name: Verify {{ module_name }} module is loaded
      command: lsmod
      register: lsmod_output
      failed_when: "module_name not in lsmod_output.stdout"
      no_log: no
      loop:
        - lustre
        - zfs
      loop_control:
        loop_var: module_name
      tags:
        - modules
        - lustre
        - config
      when: "'servers' in group_names"

    - name: Unmount client mounts 
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      with_items: "{{ target_mount }}"
      when: 
        - target_mount is defined
        - "'clients' in group_names"

    - name: Unmount OSS and MDS mounts 
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      with_items: "{{ target_mount }}"
      when: 
        - target_mount is defined
        - "'servers' in group_names"

    - name: Unmount MGS mount 
      ansible.builtin.mount:
        path: "{{ item }}"
        state: unmounted
      with_items: "{{ mgt_mount }}"
      when: mgt_mount is defined

    - name: Stop Lustre service
      ansible.builtin.systemd:
        name: lustre
        state: stopped
      when: "'servers' in group_names"

    - name: Stop LNet service
      ansible.builtin.systemd:
        name: lnet
        state: stopped
      when: "'servers' in group_names"

    # would be nice if this one didn't destroy all but just destroyed the ones created later
    - name: Destroy all ZFS pools
      ansible.builtin.shell: |
        for pool in $(zpool list -H -o name); do
          zpool destroy $pool
        done
      args:
        executable: /bin/bash
      ignore_errors: yes
      register: zpool_destroy
      when: "'servers' in group_names"

    - name: Clear ZFS labels from all zpool disks
      ansible.builtin.shell: |
        for disk in $(zpool list -H -o name); do
          zpool labelclear -f /dev/disk/by-id/$disk
        done
      args:
        executable: /bin/bash
      when: zpool_destroy is succeeded

    - name: List all disks and partitions
      ansible.builtin.shell: lsblk -nro NAME
      register: disks
      ignore_errors: yes
      when: "'servers' in group_names"

    - name: Clear ZFS labels from all disks and partitions
      ansible.builtin.shell: |
        for disk in $(echo '{{ disks.stdout }}'); do
          zpool labelclear -f /dev/$disk
        done
      args:
        executable: /bin/bash
      ignore_errors: yes # some are not zpools
      when: disks.stdout != ""

    - name: Remove mgs mount points if they exist
      file:
        path: "{{ item }}"
        state: absent
      with_items: "{{ mgt_mount }}"
      when: mgt_mount is defined

    - name: Remove mds and oss and client mount points if they exist
      file:
        path: "{{ item }}"
        state: absent
      with_items: "{{ target_mount }}"
      when: target_mount is defined

    - name: Find the full path of the ost and mdt devices
      ansible.builtin.shell: "ls /dev/disk/by-id/*_sdb"
      register: device_path
      changed_when: false
      when: "'servers' in group_names"

    - name: Create ZFS pools for osts and mdts
      ansible.builtin.command: 
        cmd: "zpool create lustre-{{ ansible_hostname }} {{ device_path.stdout }}"
      args:
        creates: "/dev/zvol/lustre-{{ ansible_hostname }}"
      when: 
        - "'servers' in group_names"
        - device_path.stdout != ""

    - name: Find the full path of the mgs device 
      ansible.builtin.shell: "ls /dev/disk/by-id/*_sdc"
      register: mgs_device_path
      changed_when: false
      when: mgt_target is defined

    - name: Create ZFS pool for mgt 
      ansible.builtin.command: 
        cmd: "zpool create {{ mgt_target }} {{ mgs_device_path.stdout }}"
      args:
        creates: "/dev/zvol/{{ mgt_target }}"
      when: 
        - mgt_target is defined

    - name: Generate host ID for all hosts
      ansible.builtin.command: genhostid
      register: genhostid_result
      changed_when: "'Host ID set to' in genhostid_result.stdout"

    - name: Create Lustre filesystem on MGS
      ansible.builtin.command:
        cmd: "mkfs.lustre --mgs --backfstype={{ lustre.backfstype }} --fsname=lustre {{ mgt_target }}/mgt"
      when: mgt_target is defined

    - name: Create Lustre filesystems on MDSes and OSSes
      command: >
        mkfs.lustre --reformat
        --{{ target_type }}
        --mgsnode={{ lustre.mgs_node }}
        --failnode={{ network.addr }}.{{ failnode }}@tcp
        --backfstype={{ lustre.backfstype }}
        --fsname=lustre
        --index={{ index }}
        {{ target }}
      vars:
        target_type: "{{ hostvars[inventory_hostname].target_type }}"
        failnode: "{{ hostvars[inventory_hostname].failnode }}"
        index: "{{ hostvars[inventory_hostname].index }}"
        target: "{{ hostvars[inventory_hostname].target }}"
      when: 
        - "'servers' in group_names"
        - target is defined

    - name: Create MDS and OSS and client mount points
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      with_items: "{{ target_mount }}"
      when: target_mount is defined

    - name: Create MGS mount point
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      with_items: "{{ mgt_mount }}"
      when: mgt_mount is defined

    - name: Mount MGS target
      ansible.builtin.shell:
        cmd: "mount -t lustre {{ mgt_target }}/mgt {{ mgt_mount }}"
      when: mgt_target is defined and mgt_mount is defined

    - name: Mount MDS and OSS targets
      ansible.builtin.shell:
        cmd: "mount -t lustre {{ target }} {{ target_mount }}"
      when: target is defined and target_mount is defined

    - name: Mount client
      ansible.builtin.shell:
        cmd: "mount -t lustre {{ lustre.mgs_node }}:/lustre {{ target_mount }}"
      when: 
        - target_mount is defined 
        - "'clients' in group_names"
