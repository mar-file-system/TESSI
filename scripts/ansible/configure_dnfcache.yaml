---
- name: Configure a Fedora system to run a Squid caching proxy for DNF and configure clients
  hosts: all
  gather_facts: no

  tasks:
    - name: Include set_hostname
      include_tasks: set_hostname.yaml

# I wish I didn't have to do this. I try to disable firewall in the gold images but they keep reappearing on reboot
- import_playbook: disable_firewall_selinux.yaml

- import_playbook: configure_ssh.yaml

- import_playbook: configure_squid.yaml
