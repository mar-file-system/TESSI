# this inventory describes a beegfs cluster following these instructions: 
# https://doc.beegfs.io/latest/quick_start_guide/quick_start_guide.html 
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o UserKnownHostsFile=/dev/null'
    ansible_playbooks:
        install: './ansible/install_beegfs_all.yaml'
        config: './ansible/configure_beegfs.yaml'
        test: './ansible/test_beegfs.yaml'
    test_script:
        path: './tests/test_pdsh.sh'
        args: 'client00,client01,meta00,meta01,data00,data01' 
        #path: './tests/simple_mpi_ior.sh'
        #args: '-np 4 -host client00,client01'
    vm_dir: '/mnt/usrc-storage-nfs/jbent/images'
    bootstrap_vm:
      cpus: 2
      boot_hdd_gbs: 12
      memory_mbs: 4096
      root_pwd: password
      location: '/mnt/usrc-storage-nfs/jbent/images/alma/AlmaLinux-8.10-x86_64-minimal.iso'
      os_variant: 'almalinux8'
      auth_keys: '/home/jbent/.ssh/authorized_keys'
    network:
      addr: '192.168.56'
    system:
      type: 'beegfs'
      version: '7.4.3'
      loglevel: '5'
  children:
    clients:
      vars:
        target_directory: '/mnt/beegfs'
        hds: []
        conf_files:
          - /etc/beegfs/beegfs-client.conf
          - /etc/beegfs/beegfs-helperd.conf
      hosts:
        client00:
          ip: 50
        client01:
          ip: 60
    servers:
      vars:
      children:
        meta:
          vars:
            hds: [5]
          hosts:
            meta00:
              ip: 10
              target_directory: /data/beegfs/mgmtd
              setup_command: "/opt/beegfs/sbin/beegfs-setup-mgmtd -p /data/beegfs/mgmtd -f"
              conf_files: 
              - /etc/beegfs/beegfs-mgmtd.conf
              - /etc/beegfs/beegfs-helperd.conf
            meta01:
              ip: 20
              target_directory: /data/beegfs/meta
              setup_command: "/opt/beegfs/sbin/beegfs-setup-meta -p /data/beegfs/meta -s 2 -m meta00 -f"
              conf_files:
                - /etc/beegfs/beegfs-meta.conf
        data:
          vars:
            hds: [10]
            target_directory: /data/beegfs/storage
            conf_files:
              - /etc/beegfs/beegfs-storage.conf
          hosts:
            data00:
              ip: 30
              setup_command: "/opt/beegfs/sbin/beegfs-setup-storage -p /data/beegfs/storage -s 3 -i 301 -m meta00 -f"
            data01:
              ip: 40
              setup_command: "/opt/beegfs/sbin/beegfs-setup-storage -p /data/beegfs/storage -s 4 -i 401 -m meta00 -f"
