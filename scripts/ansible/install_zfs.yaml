---
- name: Install ZFS on tassi01
  hosts: tassi01
  become: yes

  tasks:
    - name: Install EPEL repository and ZFS dependencies phase 1
      dnf:
        name:
          # from https://openzfs.github.io/openzfs-docs/Developer%20Resources/Custom%20Packages.html
          - epel-release
          - gcc
          - make
          - autoconf
          - automake
          - libtool
          - rpm-build
          - kernel-rpm-macros
          - libtirpc-devel
          - libblkid-devel
          - libuuid-devel
          - libudev-devel
          - openssl-devel
          - zlib-devel
          - libaio-devel
          - libattr-devel
          - elfutils-libelf-devel
          - kernel-devel-{{ ansible_kernel }}
          - kernel-abi-stablelists-{{ ansible_kernel | regex_replace('(\.[^.]+)$', '') }}
          - python3
          - python3-devel
          - python3-setuptools
          - python3-cffi
          - libffi-devel
          - ncompress
        enablerepo:
          - epel
        state: present
        skip_broken: true

    - name: Install EPEL repository and ZFS dependencies phase 2
      dnf:
        name:
          - python3-packaging
          - dkms
        enablerepo:
          - epel
          - powertools
        state: present
        skip_broken: true

    - name: Clone ZFS repository
      git:
        repo: https://github.com/openzfs/zfs.git
        dest: /usr/local/src/zfs
        version: tags/zfs-2.1.11
        clone: yes
        update: yes

    - name: Build and install ZFS
      shell: |
        cd /usr/local/src/zfs
        ./autogen.sh
        ./configure --with-spec=redhat
        make pkg-utils pkg-kmod
      args:
        executable: /bin/bash

    - name: Install ZFS RPMs
      shell: dnf localinstall *.{{ ansible_architecture }}.rpm
      args:
        executable: /bin/bash
        chdir: /usr/local/src/zfs

    - name: Load ZFS kernel module
      modprobe:
        name: zfs
        state: present

