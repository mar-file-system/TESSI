---
- name: Configure BeeGFS
  hosts: all
  become: yes
  tasks:
    - name: Ensure BeeGFS directory exists for management service on meta00
      ansible.builtin.file:
        path: /data/beegfs/mgmtd
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: inventory_hostname == 'meta00'

    - name: Configure BeeGFS management service on meta00
      ansible.builtin.command:
        cmd: /opt/beegfs/sbin/beegfs-setup-mgmtd -p /data/beegfs/mgmtd -f
      when: inventory_hostname == 'meta00'

    - name: Enable and start BeeGFS management service on meta00
      ansible.builtin.systemd:
        name: beegfs-mgmtd
        enabled: yes
        state: started
      when: inventory_hostname == 'meta00'

    - name: Ensure BeeGFS directory exists for metadata service on meta01
      ansible.builtin.file:
        path: /data/beegfs/meta
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: inventory_hostname == 'meta01'

    - name: Configure BeeGFS metadata service on meta01
      ansible.builtin.command:
        cmd: /opt/beegfs/sbin/beegfs-setup-meta -p /data/beegfs/meta -m {{ network.addr }}.{{ hostvars['meta00'].ip }} -f
      when: inventory_hostname == 'meta01'

    - name: Enable and start BeeGFS metadata service on meta01
      ansible.builtin.systemd:
        name: beegfs-meta
        enabled: yes
        state: started
      when: inventory_hostname == 'meta01'

    - name: Ensure BeeGFS directory exists for storage service on data nodes
      ansible.builtin.file:
        path: /data/beegfs/storage
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "'data' in group_names"

    - name: Configure BeeGFS storage service on data nodes
      ansible.builtin.command:
        cmd: /opt/beegfs/sbin/beegfs-setup-storage -p /data/beegfs/storage -m {{ network.addr }}.{{ hostvars['meta00'].ip }} -f
      when: "'data' in group_names"

    - name: Enable and start BeeGFS storage service on data nodes
      ansible.builtin.systemd:
        name: beegfs-storage
        enabled: yes
        state: started
      when: "'data' in group_names"


