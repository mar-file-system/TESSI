---
- name: Configure BeeGFS on all nodes
  hosts: all
  gather_facts: no
  tasks:
    - name: Include set_hostname
      include_tasks: set_hostname.yaml

    - name: Gather facts
      setup:

- import_playbook: sanity_test.yaml
  vars: { sanity_debug_msg: "Before disabling firewall and selinux" }

# I wish I didn't have to do this. I try to disable firewall in the gold images but they keep reappearing on reboot
- import_playbook: disable_firewall_selinux.yaml

- import_playbook: configure_ssh.yaml

- import_playbook: sanity_test.yaml
  vars: { sanity_debug_msg: "Before configuring beegfs" }

- import_playbook: configure_beegfs_servers.yaml

- import_playbook: configure_beegfs_clients.yaml

- import_playbook: sanity_test.yaml
  vars: { sanity_debug_msg: "After configuring beegfs" }
