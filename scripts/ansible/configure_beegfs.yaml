---
- name: Configure BeeGFS on all nodes
  hosts: all
  become: yes
  tasks:
    - name: Include set_hostname 
      include_tasks: set_hostname.yaml

    - name: Include server configuration for all hosts
      ansible.builtin.include_tasks: configure_beegfs_servers.yaml

    - name: Include client configuration for just clients
      ansible.builtin.include_tasks: configure_beegfs_clients.yaml
      when: "'clients' in group_names"
