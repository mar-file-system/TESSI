---
- name: Install and Build Lustre
  hosts: all
  vars:
    lustre_repo: /usr/local/src/lustre-release


  tasks:
    - name: Update dnf cache
      dnf:
        update_cache: yes
      tags: dependencies

    - name: Install Lustre dependencies - Development Tools
      dnf:
        name: '@Development Tools'
        state: latest
      tags: dependencies

    - name: Install Lustre dependencies - General packages
      dnf:
        name:
          - epel-release
          - xmlto
          - asciidoc
          - elfutils-libelf-devel
          - zlib-devel
          - kernel-devel
          - libyaml-devel
          - binutils-devel
          - newt-devel
          - python3-devel
          - hmaccalc
          - perl-ExtUtils-Embed
          - bison
          - elfutils-devel
          - audit-libs-devel
          - python3-docutils
          - sg3_utils
          - expect
          - attr
          - lsof
          - quilt
          - libselinux-devel
          - libmount-devel
          - libnl3-cli
          - libnl3-devel
        state: latest
        enablerepo: powertools
      tags: dependencies

    - name: Clone and checkout Lustre 2.15
      git:
        repo: 'git://git.whamcloud.com/fs/lustre-release.git'
        dest: "{{ lustre_repo }}"
        version: 'tags/2.15.4'
        clone: yes
        update: yes
      tags: build

    - name: Build Lustre
      shell: |
        cd "{{ lustre_repo }}"
        sh autogen.sh
        ./configure --with-zfs --disable-ldiskfs --with-linux=/usr/src/kernels/$(uname -r)
        make -j$(nproc)
      args:
        executable: /bin/bash
      tags: build


    - name: Install Lustre
      shell: |
        cd "{{ lustre_repo }}"
        make -j$(nproc) install
      args:
        executable: /bin/bash
      tags: install

