---
- name: Configure BeeGFS
  hosts: all
  become: yes
  gather_facts: false # may be needed for {{ ansible_architecture }}, do it later so we can wait for ssh
  vars:
    connauthfile: /etc/beegfs/connauthfile
  tasks:
    - name: Wait for SSH to become ready
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        state: started
        timeout: 300
      delegate_to: localhost
      become: false

    - name: Gather facts
      setup:
    - name: Ensure BeeGFS directories exist
      ansible.builtin.file:
        path: "{{ target_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create BeeGFS connection auth file on meta00
      ansible.builtin.command:
        cmd: "dd if=/dev/random of={{ connauthfile }} bs=128 count=1"
      when: inventory_hostname == 'meta00'

    - name: Set ownership of connection auth file on meta00
      ansible.builtin.command:
        cmd: "chown root:root {{ connauthfile }}"
      when: inventory_hostname == 'meta00'

    - name: Set permissions of connection auth file on meta00
      ansible.builtin.command:
        cmd: "chmod 400 {{ connauthfile }}"
      when: inventory_hostname == 'meta00'

    - name: Copy connection auth file to other nodes
      ansible.builtin.synchronize:
        src: "{{ connauthfile }}"
        dest: "{{ connauthfile }}"
        mode: push
        owner: yes
        group: yes
        perms: yes
      delegate_to: meta00
      when: inventory_hostname != 'meta00'

    - name: Verify connection auth file exists
      ansible.builtin.stat:
        path: "{{ connauthfile }}"
      register: authfile_stat

    - name: Fail if connection auth file does not exist
      ansible.builtin.fail:
        msg: "Connection auth file does not exist on {{ inventory_hostname }}"
      when: not authfile_stat.stat.exists

    - name: Ensure connAuthFile is set in all configuration files
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^(connAuthFile\s*=\s*).*$'
        line: 'connAuthFile = {{ connauthfile }}'
        create: yes
      loop: "{{ conf_files }}"

    - name: Verify connAuthFile parameter in configuration files
      ansible.builtin.shell: |
        grep -v '^#' {{ item }} | grep 'connAuthFile'
      register: config_check
      loop: "{{ conf_files }}"
      failed_when: config_check.stdout.find(connauthfile) == -1

    - name: Change logLevel in all configuration files
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^(logLevel\s*=\s*).*$'
        line: "logLevel = {{ system.loglevel }}"
        create: yes
      loop: "{{ conf_files }}"

    - name: Configure BeeGFS services
      ansible.builtin.command:
        cmd: "{{ setup_command }}"
      when: "'meta00' in inventory_hostname or 'meta01' in inventory_hostname or 'data' in group_names"

    - name: Restart and enable BeeGFS services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        state: restarted
      loop:
        - beegfs-mgmtd
        - beegfs-meta
        - beegfs-storage
      when: >
        (inventory_hostname == 'meta00' and item == 'beegfs-mgmtd') or
        (inventory_hostname == 'meta01' and item == 'beegfs-meta') or
        ('data' in group_names and item == 'beegfs-storage') 
