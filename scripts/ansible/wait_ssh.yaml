# wait_ssh.yaml
---
- name: Wait for SSH port to be ready
  wait_for:
    host: "{{ inventory_hostname }}"
    port: 22
    delay: 10
    timeout: 300
    state: started
  delegate_to: localhost
  register: ssh_port_ready

- name: Ping each host to verify connectivity
  ping:
  register: ping_result

- name: Fail if ping does not succeed
  fail:
    msg: "Ping test failed for {{ inventory_hostname }}. Check connectivity and try again."
  when: ping_result.ping != "pong"

- name: Wait for system to become reachable 
  wait_for_connection:
    timeout: 900

