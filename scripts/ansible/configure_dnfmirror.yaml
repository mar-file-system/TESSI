---
- name: Configure a Fedora system to run a DNF mirror on an NFS mount and set up nodes to use it
  hosts: all
  vars:
    nfs_mnt: 10.15.1.11:/mnt/vol0/usrc-storage
    nfs_dir: /mnt/usrc-storage-nfs
    base_mirror_dir: "{{ nfs_dir }}/jbent/dnf"
    apache_conf: /etc/httpd/conf.d/dnf-mirror.conf
    mirror_repo_file: /etc/yum.repos.d/local-mirror.repo
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Include wait_ssh task
      include_tasks: wait_ssh.yaml

    - name: Gather facts
      setup:
      tags: client_config

    - name: Include set_hostname
      include_tasks: set_hostname.yaml

    - name: Get the current version (Fedora/AlmaLinux)
      command: >
        {% if ansible_distribution == "Fedora" %}
        rpm -E %fedora
        {% elif ansible_distribution == "AlmaLinux" %}
        rpm -E %rhel
        {% else %}
        echo "unsupported_os"
        {% endif %}
      register: os_version
      failed_when: os_version.stdout == "unsupported_os"
      changed_when: false
      tags: client_config

    - name: Set the distro_name variable
      set_fact:
        distro_name: >
          {% if ansible_distribution == "Fedora" %}
          fedora-{{ os_version.stdout }}
          {% elif ansible_distribution == "AlmaLinux" %}
          alma-{{ os_version.stdout }}
          {% endif %}
      tags: client_config

    - name: Ensure NFS utilities are installed
      package:
        name: nfs-utils
        state: present
      when: "'servers' in group_names"

    - name: Ensure NFS mount directory exists
      file:
        path: "{{ nfs_dir }}" 
        state: directory
      when: "'servers' in group_names"

    - name: Ensure NFS directory is mounted
      mount:
        src: "{{ network.addr }}.1:{{ nfs_export }}"
        path: "{{ nfs_import }}"
        fstype: "nfs"
        opts: "nfsvers=3,noatime,intr,nosuid"
        state: "mounted"
      when: "'servers' in group_names"

    - name: Ensure the base mirror directory on NFS exists
      file:
        path: "{{ base_mirror_dir }}"
        state: directory
        mode: '0755'
      when: "'servers' in group_names"

    - name: Ensure the distro-specific mirror directory exists
      file:
        path: "{{ base_mirror_dir }}/{{ distro_name }}"
        state: directory
        mode: '0755'
      when: "'servers' in group_names"

    - name: Capture dnf repolist all output
      command: dnf repolist all
      register: repo_list_output
      changed_when: false
      tags: client_config

    - name: Extract repository IDs that contain 'abled'
      set_fact:
        repo_ids: "{{ repo_list_output.stdout_lines | select('search', 'abled') | map('split', ' ') | map('first') | list }}"
      tags: client_config

    - name: Debug repository IDs
      debug:
        msg: "Repository IDs found: {{ repo_ids }}"
      tags: client_config

    - name: Sync repositories to the DNF mirror directory
      command: >
        reposync --download-metadata --repoid={{ item }}
        --destdir="{{ base_mirror_dir }}/{{ distro_name }}"
      loop: "{{ repo_ids }}"
      when: "'servers' in group_names"

    - name: Check if repository metadata already exists
      stat:
        path: "{{ base_mirror_dir }}/{{ distro_name }}/repodata/repomd.xml"
      register: repomd_check
      when: "'servers' in group_names"

    - name: Create repository metadata (initial run)
      command: createrepo "{{ base_mirror_dir }}/{{ distro_name }}"
      when:
        - "'servers' in group_names"
        - not repomd_check.stat.exists

    - name: Update repository metadata (subsequent run)
      command: createrepo --update "{{ base_mirror_dir }}/{{ distro_name }}"
      when:
        - "'servers' in group_names"
        - repomd_check.stat.exists

    - name: Disable all other repositories
      find:
        paths: /etc/yum.repos.d/
        patterns: '*.repo'
      register: repo_files
      tags: client_config

    - name: Disable all other repositories
      replace:
        path: "{{ item.path }}"
        regexp: '^enabled=.*'
        replace: 'enabled=0'
      loop: "{{ repo_files.files }}"
      tags: client_config

    - name: Set the mirror_url variable based on the first server's IP
      set_fact:
        mirror_url: "http://{{ hostvars[groups['servers'][0]].network.addr }}.{{ hostvars[groups['servers'][0]].ip }}/{{ base_mirror_dir | basename }}"
      tags: client_config

    - name: Create a repository configuration file for the local DNF mirror
      copy:
        dest: "{{ mirror_repo_file }}"
        content: |
          {% for repo in repo_ids %}
          [local-{{ repo }}]
          name=Fedora {{ repo }}
          baseurl={{ mirror_url }}/{{ distro_name }}
          enabled=1
          gpgcheck=0
          {% endfor %}
      tags: client_config

    - name: Clear DNF cache
      command: dnf clean all

- import_playbook: disable_firewall_selinux.yaml

- import_playbook: configure_ssh.yaml
