---
- name: Configure a system to run a DNF mirror on an NFS mount and set up nodes to use it
  hosts: all
  vars:
    nfs_mnt: 10.15.1.11:/mnt/vol0/usrc-storage
    nfs_dir: /mnt/usrc-storage-nfs
    base_mirror_dir: "{{ nfs_dir }}/jbent/dnf"
    apache_conf: /etc/httpd/conf.d/dnf-mirror.conf
    mirror_repo_file: /etc/yum.repos.d/local-mirror.repo
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Include wait_ssh task
      include_tasks: wait_ssh.yaml

    - name: Gather facts
      setup:
      tags: client_config

    - name: Include set_hostname
      include_tasks: set_hostname.yaml

    - name: Set the mirror_url variable 
      set_fact:
        mirror_url: "{{ dnfmirror.mirror_url | default('http://' + hostvars[groups['servers'][0]].network.addr + '.' + hostvars[groups['servers'][0]].ip | string) }}"
      tags: client_config

    - name: Debug mirror_url variable
      debug:
        msg: "mirror_url: '>{{ mirror_url }}<'"
      tags: client_config

    - name: Get the current version (Fedora/AlmaLinux)
      command: >
        {% if ansible_distribution == "Fedora" %}
        rpm -E %fedora
        {% elif ansible_distribution == "AlmaLinux" %}
        rpm -E %rhel
        {% else %}
        echo "unsupported_os"
        {% endif %}
      register: os_version
      failed_when: os_version.stdout == "unsupported_os"
      changed_when: false
      tags: client_config

    - name: Debug os_version stdout
      debug:
        msg: "os_version.stdout: '>{{ os_version.stdout }}<'"
      tags: client_config

    - name: Set the distro_name variable
      set_fact:
        distro_name: >
          {% if ansible_distribution == "Fedora" %}
          fedora-{{ os_version.stdout }}
          {% elif ansible_distribution == "AlmaLinux" %}
          alma-{{ os_version.stdout }}
          {% else %}
          "unsupported_os"
          {% endif %}
      tags: client_config

    - name: Clean up distro_name by removing extra characters
      set_fact:
        distro_name: "{{ distro_name | replace('\n', '') | replace(' ', '') | trim }}"
      tags: client_config

    - name: Fail if unsupported OS
      fail:
        msg: "Unsupported operating system: {{ ansible_distribution }}"
      when: distro_name == "unsupported_os"
      tags: client_config

    - name: Debug distro_name 
      debug:
        msg: "distro_name: '>{{ distro_name }}<'"
      tags: client_config

    - name: Ensure NFS mount directory exists
      file:
        path: "{{ nfs_dir }}" 
        state: directory
      when: "'servers' in group_names"

    - name: Ensure NFS directory is mounted
      mount:
        src: "{{ network.addr }}.1:{{ nfs_export }}"
        path: "{{ nfs_import }}"
        fstype: "nfs"
        opts: "nfsvers=3,noatime,intr,nosuid"
        state: "mounted"
      when: "'servers' in group_names"

    - name: Ensure the base mirror directory on NFS exists
      file:
        path: "{{ base_mirror_dir }}"
        state: directory
        mode: '0755'
      when: "'servers' in group_names"

    - name: Debug the distro-specific mirror directory name
      debug:
        msg: "mirror directory is {{ base_mirror_dir }}/{{ distro_name }}"

    - name: Ensure the distro-specific mirror directory exists
      file:
        path: "{{ base_mirror_dir }}/{{ distro_name }}"
        state: directory
        mode: '0755'
      when: "'servers' in group_names"

    # Capture only the repositories that are currently enabled
    - name: Capture enabled repositories
      command: dnf repolist --enabled
      register: enabled_repo_list_output
      changed_when: false
      tags: client_config

    - name: Extract repository IDs of enabled repositories
      set_fact:
        enabled_repo_ids: "{{ enabled_repo_list_output.stdout_lines[1:] | map('split', ' ') | map('first') | list }}"
      tags: client_config

    - name: Debug all enabled repository IDs
      debug:
        msg: "All enabled repository IDs: {{ enabled_repo_ids }}"
      tags: client_config

    - name: Capture all repository IDs
      command: dnf repolist all
      register: all_repo_list_output
      changed_when: false
      tags: client_config

    - name: Extract repository IDs that contain 'abled' 
      set_fact:
        all_repo_ids: "{{ all_repo_list_output.stdout_lines | select('search', 'abled') | map('split', ' ') | map('first') | list }}"
      tags: client_config

    - name: Debug all repository IDs
      debug:
        msg: "All repository IDs: {{ all_repo_ids }}"
      tags: client_config

    - name: Collect all repo config files 
      find:
        paths: /etc/yum.repos.d/
        patterns: '*.repo'
        recurse: yes
      register: repo_files
      tags: client_config

    - name: Remove all existing repository configuration files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ repo_files.files }}"
      tags: client_config

    - name: Set the baseurl variable
      set_fact:
        baseurl: "{{ mirror_url }}/{{ distro_name | trim }}"
      tags: client_config

    - name: Debug baseurl variable
      debug:
        msg: "baseurl: '>{{ baseurl }}<'"
      tags: client_config

    # Create a repository configuration file for the local DNF mirror
    - name: Create a repository configuration file for the local DNF mirror
      copy:
        dest: "{{ mirror_repo_file }}"
        content: |
          {% for repo in all_repo_ids %}
          [{{ repo }}]
          name={{ ansible_distribution }} {{ repo }}
          baseurl={{ baseurl }}
          enabled={% if repo in enabled_repo_ids %}1{% else %}0{% endif %}

          gpgcheck=0

          {% endfor %}
      tags: client_config

    - name: Clear DNF cache
      command: dnf clean all
      tags: client_config

    - name: Ensure Apache is enabled and started
      systemd:
        name: httpd
        state: started
        enabled: true
      when: "'servers' in group_names"
      tags: httpaccess

    - name: Configure Apache for DNF mirror
      copy:
        dest: "{{ apache_conf }}"
        content: |
          <VirtualHost *:80>
              DocumentRoot "{{ base_mirror_dir }}"
              <Directory "{{ base_mirror_dir }}">
                  Options Indexes FollowSymLinks
                  AllowOverride None
                  Require all granted
              </Directory>
          </VirtualHost>
      when: "'servers' in group_names"
      tags: httpaccess

    - name: Restart Apache to apply new configuration
      systemd:
        name: httpd
        state: restarted
      when: "'servers' in group_names"
      tags: httpaccess

- import_playbook: disable_firewall_selinux.yaml

- import_playbook: configure_ssh.yaml
