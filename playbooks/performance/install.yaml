---
- name: Require supported baseline hosts
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Rocky'
      - ansible_facts.distribution_version == '9.7'
      - ansible_facts.architecture == 'x86_64'
      - "'ds' in group_names or 'clients' in group_names"

- name: Require a client controller before performance installation
  ansible.builtin.include_tasks: ../shared/require_client_controller.yaml
  vars:
    controller_phase_label: Performance

- name: Install the shared DOCA RDMA MPI and UCX stack
  ansible.builtin.include_tasks: ../shared/install_doca.yaml

- name: Install shared Python report dependencies during phase1
  ansible.builtin.include_tasks: ../shared/install_report_dependencies.yaml

- name: Install baseline prerequisites in phase1
  ansible.builtin.package:
    name: [environment-modules, gcc-c++, python3, libibverbs-utils, openssh-clients]
    state: present

- name: Load shared MPI installation variables
  ansible.builtin.include_vars: ../vars/mpi_RedHat.yml

- name: Prepare storage-server boot settings using the common baseline and DAOS tasks
  ansible.builtin.include_tasks: ../shared/prepare_storage_boot.yaml

- name: Restore Xem InfiniBand after OFED installation or reboot
  ansible.builtin.include_tasks: ../shared/restore_xem_ib.yaml

- name: Verify UCX RDMA support during installation
  ansible.builtin.include_tasks: ../tasks/check_ucx_rdma.yaml

- name: Register baseline Open MPI using shared RPM discovery and module installation
  ansible.builtin.include_tasks: ../tasks/register_rpm_openmpi.yaml
  vars:
    openmpi_module_name: mpi/performance-openmpi

- name: Build OSU using the shared TESSI installer
  ansible.builtin.include_tasks: ../tasks/install_osu_micro_benchmarks.yaml
  vars:
    mpi_implementation:
      module: mpi/performance-openmpi

- name: Install FIO on storage servers using the shared installer
  ansible.builtin.include_tasks: ../shared/install_fio.yaml
  when: "'ds' in group_names"

- name: Install baseline runner during phase1
  ansible.builtin.copy:
    src: files/measure.py
    dest: /usr/local/bin/tessi-measure-perf
    mode: '0755'

- name: Install existing TESSI PDF report prerequisites on clients
  ansible.builtin.package:
    name: [enscript, ghostscript, ImageMagick, poppler-utils, graphviz]
    state: present
  when: "'clients' in group_names"
