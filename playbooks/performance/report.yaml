---
# Included by phase7 on localhost; uses saved data only, with no installation.
- name: Locate the saved baseline for this experiment
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../../performance/files/report.py"
      - --select
      - --root
      - "{{ system.performance.results_root }}"
      - --groups-json
      - "{{ groups | to_json }}"
      - --pointer
      - "{{ image_dir }}/performance-manifest-path.txt"
  register: performance_report_selection
  when: performance_manifest_path is not defined
  changed_when: false

- name: Select explicit or discovered performance manifest
  ansible.builtin.set_fact:
    performance_report_manifest: "{{ performance_manifest_path | default(performance_report_selection.stdout | default('')) }}"

- name: Generate performance PDF and persist derived manifest metrics
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../../performance/files/report.py"
      - --manifest
      - "{{ performance_report_manifest }}"
      - --output-pdf
      - "{{ image_dir }}/summary.pdf"
  register: performance_pdf_result

- name: Show report paths and estimated ceilings
  ansible.builtin.debug:
    msg: "{{ performance_pdf_result.stdout | from_json }}"
