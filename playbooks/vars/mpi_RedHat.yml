---
# Paths
modulefiles_base_path: "/usr/share/modulefiles"

# Packages
cpp_compiler_pkg: "gcc-c++"
environment_modules_pkg: "environment-modules"

# MPI Implementations
mpi_implementations:
  - module: mpi/openmpi-x86_64
    mpi_packages: "openmpi openmpi-devel"
    mpirun_args: "--prefix $MPI_HOME --mca plm_rsh_args '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'"
    env_vars:
      - name: OMPI_MCA_pml
        value: ob1
      - name: OMPI_MCA_btl
        value: tcp,self
  - module: mpi/mpich-x86_64
    mpirun_args: ""
    mpi_packages: "mpich mpich-devel"
    env_vars: []
