# User & SSH
  
pnfs_local_src: "{{ system.pnfs_src | regex_replace('/+$', '') }}"

# Whether to run rondb data on same node as rondb mgr
rondb_colocate_mgr: true

# Remote Base Paths
lab_remote_base: "/tmp/pnfscore"
lab_rondb_base: "/tmp/rondb"
lab_mds_conf_dir: "/etc/pnfs-mds"
lab_mds_run_dir: "{{ local_storage ~ '/pnfs-mds' if (local_storage is defined) else '/var/lib/pnfs-mds' }}"

# Source & Build Paths (Local to the controller/MDS0)
lab_source_dir: "/tmp/pnfs-lattice"
#lab_build_dir: "/tmp/pnfs-lattice/build-rondb"
lab_build_dir: "build-rondb"

# RonDB Specifics
#lab_rondb_version: "24.10.0"
lab_rondb_version: "26.02.4"
lab_rondb_data_dir: "{{ local_storage ~ '/rondb-data' if (local_storage is defined) else '/var/lib/rondb-data' }}"
lab_rondb_schema: "pnfs_mds"

# Network
lab_mds_nfs_port: 2049
lab_mds_grpc_port: 50051
lab_ds_export_path: "{{ (local_storage ~ '/ds') if (local_storage is defined) else '/export/ds' }}"

lab_client_mount: "/mnt/pnfs"

# Experiment-controlled pNFS settings from the bootstrap inventory.
lab_ds_transport: "{{ system.ds_transport }}"
lab_client_mds_assignment: "{{ system.client_mds_assignment | default('first') }}"
lab_stripe_width: "{{ system.stripe_width }}"
lab_stripe_size: "{{ system.stripe_size }}"
lab_hpc_serve_layouts: "{{ system.hpc_serve_layouts }}"

rondb_bin: "{{ lab_rondb_base }}/bin"
rondb_data: "{{ lab_rondb_data_dir }}/data"
