---
# Keep options under system.daos so bootstrap preserves them in phase inventories.
daos_provider: "{{ (system.daos | default({})).provider | default('ucx+rc_x') }}"
# DAOS's host-list parser rejects some testbed-qualified hostnames. Use the
# gathered management IPv4 addresses consistently for servers, agents, and dmg.
daos_server_addresses: "{{ groups['ds'] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | list }}"
daos_replicas: "{{ daos_server_addresses[:3] }}"
daos_user: "{{ lab_user | default(lookup('env', 'USER')) }}"
daos_group: "{{ (system.daos | default({})).group | default(daos_primary_group.stdout) }}"
daos_targets: "{{ (system.daos | default({})).targets | default(5) }}"
daos_scm_size: "{{ (system.daos | default({})).scm_size | default(32) }}"
daos_pool: "{{ (system.daos | default({})).pool | default('tessi') }}"
daos_pool_size: "{{ (system.daos | default({})).pool_size | default('1T') }}"
daos_container: "{{ (system.daos | default({})).container | default('api') }}"
