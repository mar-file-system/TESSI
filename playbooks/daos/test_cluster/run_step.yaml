---
- name: Run bounded native DAOS API operation
  block:
    - name: Execute native write or read verification
      ansible.builtin.command:
        argv:
          - /usr/local/bin/tessi-daos-api-smoke
          - "{{ daos_pool }}"
          - "{{ daos_container }}"
          - "{{ daos_api_mode }}"
          - "{{ groups['clients'].index(inventory_hostname) | string }}"
          - "{{ daos_api_client_count | string }}"
          - "{{ daos_api_run_id }}"
      async: 120
      poll: 2
      register: daos_api_operation
      changed_when: daos_api_mode == 'write'
  always:
    - name: Preserve native operation output including failures
      ansible.builtin.copy:
        dest: "{{ daos_api_result_dir }}/{{ inventory_hostname }}.{{ daos_api_step_name }}.json"
        content: "{{ daos_api_operation | to_nice_json }}\n"
        mode: '0644'
