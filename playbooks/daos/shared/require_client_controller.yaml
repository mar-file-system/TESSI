---
# Server reboots must not take down the Ansible controller mid-phase1.
- name: Gather DAOS controller network identity
  ansible.builtin.setup:
    gather_subset: [min, network]
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true

- name: Require a client node as the DAOS Ansible controller
  ansible.builtin.assert:
    that:
      - groups.get('clients', []) | length > 0
      - hostvars['localhost'].ansible_facts.default_ipv4.address in (groups['clients'] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | list)
    fail_msg: >-
      DAOS phase1 must run on an allocated client (for example cli0),
      because phase1 reboots storage servers to activate IOMMU. SSH to the client
      and run the generated Makefile there.
  run_once: true
