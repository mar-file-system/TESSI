---
- name: Discover InfiniBand IP address
  ansible.builtin.include_tasks: ../../tasks/discover_ib_ip.yaml

- name: Set Lustre transport variables
  ansible.builtin.set_fact:
    lustre_lnet_transport: "{{ system.lnet_transport | default('tcp') }}"
    lustre_lnet_network: "{{ (system.lnet_transport | default('tcp')) ~ '0' }}"
    lustre_failover: "{{ system.failover | default(true) | bool }}"
    node_ip: "{{ infiniband_ip }}"

- name: Create sorted lists of group members
  ansible.builtin.set_fact:
    sorted_clients: "{{ groups['clients'] | sort }}"
    sorted_mds: "{{ groups['mds'] | sort }}"
    sorted_oss: "{{ groups['oss'] | sort }}"

- name: Determine group index
  ansible.builtin.set_fact:
    group_index: "{{ groups[inventory_group].index(inventory_hostname) }}"
  loop: "{{ ['clients', 'mds', 'oss'] | select('in', group_names) | list }}"
  loop_control:
    loop_var: inventory_group

- name: Set target mount for clients
  ansible.builtin.set_fact:
    target_mount: /mnt/lustre
  when: "'clients' in group_names"

- name: Set MGS NIDs
  ansible.builtin.set_fact:
    mgs_node: >-
      {{
        (sorted_mds
         | map('extract', hostvars, 'infiniband_ip')
         | join('@' ~ lustre_lnet_transport ~ ':'))
        ~ '@' ~ lustre_lnet_transport
        if lustre_failover
        else hostvars[sorted_mds[0]].infiniband_ip ~ '@' ~ lustre_lnet_transport
      }}

- name: Set target index and IP facts
  ansible.builtin.set_fact:
    ip: "{{ node_ip.split('.')[-1] }}"
    index: "{{ group_index }}"

- name: Set target type to MDT for MDS hosts
  ansible.builtin.set_fact:
    target_type: mdt
  when: "'mds' in group_names"

- name: Set MGT facts for first MDS host
  ansible.builtin.set_fact:
    mgt_mount: /mnt/lustre/mgt
    mgt_target: lustre-mgs
  when:
    - "'mds' in group_names"
    - group_index | int == 0

- name: Set target type to OST for OSS hosts
  ansible.builtin.set_fact:
    target_type: ost
  when: "'oss' in group_names"

- name: Set target and target mount for MDS and OSS nodes
  ansible.builtin.set_fact:
    target: "lustre-{{ inventory_group }}{{ '%02d' | format(group_index | int) }}/{{ target_type }}0"
    target_mount: "/mnt/lustre/{{ inventory_group }}{{ '%02d' | format(group_index | int) }}.{{ target_type }}0"
  loop: "{{ ['mds', 'oss'] | select('in', group_names) | list }}"
  loop_control:
    loop_var: inventory_group

- name: Require paired MDS and OSS nodes when failover is enabled
  ansible.builtin.assert:
    that:
      - sorted_mds | length is even
      - sorted_oss | length is even
    fail_msg: Failover requires an even number of MDS and OSS nodes.
  when: lustre_failover
  run_once: true

- name: Assign failover partners for MDS and OSS
  ansible.builtin.set_fact:
    failnode: >-
      {{
        hostvars[sorted_group[(group_index | int) + 1]].infiniband_ip
        if (group_index | int) % 2 == 0
        else hostvars[sorted_group[(group_index | int) - 1]].infiniband_ip
      }}
  loop: "{{ ['mds', 'oss'] | select('in', group_names) | list }}"
  loop_control:
    loop_var: inventory_group
  vars:
    sorted_group: "{{ hostvars[inventory_hostname]['sorted_' ~ inventory_group] }}"
  when: lustre_failover

- name: Debug key Lustre configuration facts
  ansible.builtin.debug:
    msg:
      group_index: "{{ group_index }}"
      mgs_node: "{{ mgs_node }}"
      node_ip: "{{ node_ip }}"
      target_type: "{{ target_type | default('none') }}"
      mgt_target: "{{ mgt_target | default('none') }}"
      failnode: "{{ failnode | default('none') }}"
      target: "{{ target | default('none') }}"
      target_mount: "{{ target_mount }}"
      lnet_network: "{{ lustre_lnet_network }}"
