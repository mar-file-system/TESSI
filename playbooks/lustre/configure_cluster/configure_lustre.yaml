- name: Gather service facts
  service_facts:
  tags:
    - config
    - firewall

- name: Fail if firewalld service is running
  fail:
    msg: "Firewalld service is running and must be stopped."
  when: "'firewalld' in ansible_facts.services and ansible_facts.services.firewalld.state == 'running'"
  tags:
    - config
    - firewall

- name: Check SELinux status
  command: getenforce
  register: selinux_status
  changed_when: false
  tags:
    - selinux
    - lustre
    - config
    - precheck

- name: Verify SELinux is disabled
  assert:
    that:
      - selinux_status.stdout == "Disabled"
    fail_msg: "Error: SELinux is not disabled. Current status is {{ selinux_status.stdout }}"
  tags:
    - selinux
    - lustre
    - config
    - precheck

- name: Load ZFS kernel module
  modprobe:
    name: zfs
    state: present
  when: "'clients' not in group_names"
  register: zfs_module_loaded
  changed_when: zfs_module_loaded is changed
  tags:
    - configure
    - zfs
    - modules

- name: Ensure ZFS kernel module is loaded on reboot
  copy:
    dest: /etc/modules-load.d/zfs.conf
    content: |
      # Load ZFS module on boot
      zfs
  when: "'clients' not in group_names"
  register: zfs_module_config
  changed_when: zfs_module_config is changed
  tags:
    - configure
    - zfs
    - modules

- name: Rebuild module dependency map after ZFS modules loaded
  command: depmod -a
  when: (zfs_module_loaded.changed or zfs_module_config.changed) and "'clients' not in group_names"
  tags:
    - configure
    - modules
    - lustre
    - zfs

- name: Detect network interface for the Lustre NID
  ansible.builtin.shell:
    cmd: "ip -o -4 addr show | awk '/{{ node_ip | regex_escape }}/ {print $2; exit}'"
  register: lustre_lnet_interface
  changed_when: false

- name: Require a network interface for the Lustre NID
  ansible.builtin.assert:
    that:
      - lustre_lnet_interface.stdout | length > 0
    fail_msg: "No interface carries Lustre NID address {{ node_ip }}."

- name: Select the Lustre network driver
  ansible.builtin.set_fact:
    lustre_lnet_driver: >-
      {{ 'ko2iblnd' if lustre_lnet_transport == 'o2ib' else 'ksocklnd' }}

- name: Persist Lustre LNet configuration
  ansible.builtin.copy:
    dest: /etc/modprobe.d/lustre.conf
    content: >-
      options lnet networks="{{ lustre_lnet_network }}({{ lustre_lnet_interface.stdout }})"
    owner: root
    group: root
    mode: '0644'

- name: Rebuild module dependency map
  ansible.builtin.command: depmod -a
  changed_when: false

- name: Load Lustre network and filesystem modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - lnet
    - "{{ lustre_lnet_driver }}"
    - lustre

- name: Ensure Lustre modules are loaded on reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/lustre.conf
    content: |
      lnet
      {{ lustre_lnet_driver }}
      lustre
    owner: root
    group: root
    mode: '0644'

- name: Reset dynamic LNet configuration
  ansible.builtin.command: lnetctl lnet unconfigure
  register: lnet_unconfigure
  changed_when: lnet_unconfigure.rc == 0
  failed_when: false

- name: Configure LNet
  ansible.builtin.command: lnetctl lnet configure
  register: lnet_configure
  changed_when: lnet_configure.rc == 0

- name: Add Lustre LNet interface
  ansible.builtin.command:
    argv:
      - lnetctl
      - net
      - add
      - --net
      - "{{ lustre_lnet_network }}"
      - --if
      - "{{ lustre_lnet_interface.stdout }}"
  register: lnet_add
  changed_when: lnet_add.rc == 0
  failed_when:
    - lnet_add.rc != 0
    - "'errno: -17' not in lnet_add.stderr"

- name: Verify Lustre LNet configuration
  ansible.builtin.command: lnetctl net show
  register: lnet_show_output
  changed_when: false

- name: Print Lustre LNet configuration
  ansible.builtin.debug:
    var: lnet_show_output.stdout_lines

- name: Verify {{ module_name }} module is loaded
  command: lsmod
  register: lsmod_output
  failed_when: "module_name not in lsmod_output.stdout"
  no_log: no
  loop:
    - lustre
    - zfs
  loop_control:
    loop_var: module_name
  tags:
    - modules
    - lustre
    - config
  when: "'clients' not in group_names"

- name: Unmount client mounts 
  ansible.builtin.mount:
    path: "{{ item }}"
    state: unmounted
  with_items: "{{ target_mount }}"
  when: 
    - target_mount is defined
    - "'clients' in group_names"
  tags: makeclean

- name: Unmount OSS and MDS mounts 
  ansible.builtin.mount:
    path: "{{ item }}"
    state: unmounted
  with_items: "{{ target_mount }}"
  when: 
    - target_mount is defined
    - "'clients' not in group_names"
  tags: makeclean

- name: Unmount MGS mount 
  ansible.builtin.mount:
    path: "{{ item }}"
    state: unmounted
  with_items: "{{ mgt_mount }}"
  when: mgt_mount is defined
  tags: makeclean

- name: Stop Lustre service
  ansible.builtin.systemd:
    name: lustre
    state: stopped
  when: "'clients' not in group_names"
  tags: makeclean

- name: Stop LNet service
  ansible.builtin.systemd:
    name: lnet
    state: stopped
  tags: makeclean

- name: Identify ZFS pools created for this Lustre target
  ansible.builtin.set_fact:
    lustre_managed_pools: >-
      {{
        [target.split('/')[0]]
        + ([mgt_target] if mgt_target is defined else [])
      }}
  when: "'clients' not in group_names"
  tags: makeclean

- name: Check for ZFS pools created for this Lustre target
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -H
      - -o
      - name
      - "{{ item }}"
  loop: "{{ lustre_managed_pools | default([]) }}"
  register: lustre_managed_pool_status
  changed_when: false
  failed_when: false
  when: "'clients' not in group_names"
  tags: makeclean

- name: Destroy ZFS pools created for this Lustre target
  ansible.builtin.command:
    argv:
      - zpool
      - destroy
      - -f
      - "{{ item.item }}"
  loop: "{{ lustre_managed_pool_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - "'clients' not in group_names"
    - item.rc == 0
  tags: makeclean

- name: Remove mgs mount points if they exist
  file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ mgt_mount }}"
  when: mgt_mount is defined
  tags: makeclean

- name: Remove mds and oss and client mount points if they exist
  file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ target_mount }}"
  when: target_mount is defined
  tags: makeclean

- block:
  - name: Select target pool and backing devices
    ansible.builtin.set_fact:
      target_pool: "{{ target.split('/')[0] }}"
      target_disks: >-
        {{
          lustre_target_disks
          if lustre_target_disks is defined
          else (
            local_storage_devices
            | difference(
                [lustre_mgs_disk]
                if lustre_mgs_disk is defined
                else []
              )
            if local_storage_devices is defined
            else (
              [local_storage]
              if local_storage is defined and local_storage is match('^/dev/')
              else [
                '/dev/vdc'
                if (networking | default('none')) == 'mvpnet'
                else '/dev/disk/by-id/virtio-' ~ ansible_hostname ~ '.b'
              ]
            )
          )
        }}
    changed_when: false

  - name: Verify OST and MDT backing devices
    ansible.builtin.stat:
      path: "{{ item }}"
    loop: "{{ target_disks }}"
    register: target_disk_stats

  - name: Require every OST and MDT backing device
    ansible.builtin.assert:
      that:
        - item.stat.exists
        - item.stat.isblk
      fail_msg: "Lustre target device {{ item.item }} is not a block device."
    loop: "{{ target_disk_stats.results }}"
    loop_control:
      label: "{{ item.item }}"

  - name: Create ZFS pool for OST or MDT
    ansible.builtin.command:
      argv: >-
        {{ ['zpool', 'create', '-f', '-o', 'ashift=12', target_pool]
           + target_disks }}
  when: "'clients' not in group_names"

- block:
  - name: Select MGS backing device
    ansible.builtin.set_fact:
      mgs_disk: >-
        {{
          lustre_mgs_disk
          if lustre_mgs_disk is defined
          else (
            '/dev/vdd'
            if (networking | default('none')) == 'mvpnet'
            else '/dev/disk/by-id/virtio-' ~ ansible_hostname ~ '.c'
          )
        }}
    changed_when: false

  - name: Verify MGS backing device
    ansible.builtin.stat:
      path: "{{ mgs_disk }}"
    register: mgs_device_stat

  - name: Require MGS backing device
    ansible.builtin.assert:
      that:
        - mgs_device_stat.stat.exists
        - mgs_device_stat.stat.isblk
      fail_msg: "Lustre MGS device {{ mgs_disk }} is not a block device."

  - name: Create ZFS pool for MGT
    ansible.builtin.command:
      argv:
        - zpool
        - create
        - -f
        - -o
        - ashift=12
        - "{{ mgt_target }}"
        - "{{ mgs_disk }}"

  - name: Create Lustre filesystem on MGS
    ansible.builtin.command:
      cmd: "mkfs.lustre --mgs --backfstype=zfs --fsname=lustre {{ mgt_target }}/mgt"
  when: mgt_target is defined

- name: Generate host ID on Lustre servers
  ansible.builtin.command: /usr/sbin/zgenhostid -f
  register: genhostid_result
  changed_when: true
  when: "'clients' not in group_names"

- block:
  - name: Set mkfs.lustre command as a fact
    ansible.builtin.set_fact:
      mkfs_command: >
        mkfs.lustre --reformat
        --{{ target_type }}
        --mgsnode={{ mgs_node }}
        {{ '--failnode=' ~ failnode ~ '@' ~ lustre_lnet_transport if lustre_failover else '' }}
        --backfstype=zfs
        --fsname=lustre
        --index={{ index }}
        {{ target }}

  - name: Debug mkfs.lustre command before execution
    ansible.builtin.debug:
      var: mkfs_command

  - name: Run mkfs.lustre command
    ansible.builtin.command:
      cmd: "{{ mkfs_command }}"
    register: mkfs_output

  - name: Debug mkfs.lustre output
    debug:
      var: mkfs_output.stdout
    tags:
      - debug
  when:
    - "'clients' not in group_names"
    - target is defined
  tags:
    - configure
    - lustre

- name: Create MDS and OSS and client mount points
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items: "{{ target_mount }}"
  when: target_mount is defined
  tags:
    - configure
    - lustre

- name: Create MGS mount point
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items: "{{ mgt_mount }}"
  when: mgt_mount is defined
  tags:
    - configure
    - lustre

- name: Start Lustre service
  ansible.builtin.systemd:
    name: lustre
    state: started
  when:
    - "'clients' not in group_names"
    - "'physical_hosts' not in group_names"
  tags:
    - configure
    - lustre

- name: Check if mount.lustre exists
  stat:
    path: /sbin/mount.lustre
  register: mount_lustre_check
  tags:
    - lustre
    - verify

- name: Fail if mount.lustre is missing
  fail:
    msg: >
      CRITICAL: /sbin/mount.lustre is missing. 
      This likely happened due to a failure in make the gold images.
      make phase1-clean and try again. 
  when: not mount_lustre_check.stat.exists
  tags:
    - lustre
    - verify

- name: Mount MGS target
  ansible.builtin.shell:
    cmd: "mount -t lustre {{ mgt_target }}/mgt {{ mgt_mount }}"
  when: mgt_target is defined and mgt_mount is defined
  tags:
    - configure
    - lustre

- name: Mount MDS and OSS targets
  ansible.builtin.shell:
    cmd: "mount -t lustre {{ target }} {{ target_mount }}"
  when: target is defined and target_mount is defined
  tags:
    - configure
    - lustre

- name: Mount client at {{ target_mount }} and create scratch workspace for {{ ansible_user }}
  when: "'clients' in group_names"
  block:
  - name: Mount client
    ansible.builtin.shell:
      cmd: "mount -t lustre {{ mgs_node }}:/lustre {{ target_mount }}"

  - name: Create {{ ansible_env.SUDO_USER }} directory on {{ target_mount }} 
    when: inventory_hostname == groups['clients'][0]
    ansible.builtin.file:
      path: "{{ target_mount }}/{{ ansible_env.SUDO_USER }}"
      state: directory
      owner: "{{ ansible_env.SUDO_USER }}"
      mode: '0755'
