---
- name: Define whether to use NFS RPMs
  set_fact:
    use_nfs_rpms: false  # Set to true to use RPMs from NFS, false to install dynamically

- name: Define kernel RPMs list
  set_fact:
    kernel_rpms:
      - kernel-devel-{{ ansible_kernel }}.rpm
      - kernel-headers-{{ ansible_kernel }}.rpm
      - kernel-abi-stablelists-{{ ansible_kernel | regex_replace('(\.[^.]+)$', '') }}.noarch.rpm
  tags:
    - dependencies

- block:
    - name: Copy kernel RPMs from host NFS mount to VM /tmp
      copy:
        src: /mnt/usrc-storage-nfs/jbent/images/rpms/{{ item }}
        dest: /tmp/{{ item }}
      loop: "{{ kernel_rpms }}"
      tags:
        - dependencies

    - name: Install kernel RPMs from local files in /tmp
      command:
        cmd: dnf install -y /tmp/{{ item }}
      loop: "{{ kernel_rpms }}"
      tags:
        - dependencies
        - kernel
  when: use_nfs_rpms

- block:
    - name: Install kernel RPMs dynamically from repositories
      dnf:
        name:
          - kernel-devel-{{ ansible_kernel }}
          - kernel-headers-{{ ansible_kernel }}
          - kernel-abi-stablelists-{{ ansible_kernel | regex_replace('(\.[^.]+)$', '') }}
        state: present
        skip_broken: true
      tags:
        - dependencies
        - kernel
  when: not use_nfs_rpms

