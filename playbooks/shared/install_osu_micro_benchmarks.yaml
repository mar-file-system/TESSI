- name: Set OSU build variables for {{ mpi_module }}
  set_fact:
    osu_version: "7.5.2"
    osu_prefix: "/usr/local/osu/{{ mpi_module | regex_replace('/', '_') }}"
    osu_src_dir: "/tmp/osu-micro-benchmarks/{{ mpi_module | regex_replace('/', '_') }}"

- name: Set OSU tarball variable for {{ mpi_module }}
  set_fact:
    osu_tarball: "osu-micro-benchmarks-{{ osu_version }}.tar.gz"

- name: Set OSU download URL variables
  set_fact:
    osu_url: "https://mvapich.cse.ohio-state.edu/download/mvapich/{{ osu_tarball }}"

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - environment-modules
      - autoconf
      - automake
      - libtool
      - make
      - gcc
      - gcc-c++
    state: present

- name: Remove existing build directory for safety
  ansible.builtin.file:
    path: "{{ osu_src_dir }}"
    state: absent

- name: Create unique build directory for {{ mpi_module }}
  ansible.builtin.file:
    path: "{{ osu_src_dir }}"
    state: directory
    mode: '0755'

- name: Download OSU Micro-Benchmarks tarball
  ansible.builtin.get_url:
    url: "{{ osu_url }}"
    dest: "/tmp/{{ osu_tarball }}"
    mode: "0644"

- name: Extract OSU Micro-Benchmarks into unique directory
  ansible.builtin.unarchive:
    src: "/tmp/{{ osu_tarball }}"
    dest: "{{ osu_src_dir }}"
    remote_src: true
    # This strips the top-level folder so files go directly into dest, not dest/osu-7.5.2/
    extra_opts:
      - --strip-components=1

- name: Build and install OSU Micro-Benchmarks for selected MPI
  ansible.builtin.shell: |
    set -e  # Fail immediately if any command fails
    
    source /etc/profile.d/modules.sh
    module load {{ mpi_module }}
    
    # 1. Debug and Verify MPICC availability
    MPICC_PATH=$(which mpicc)
    if [ -z "$MPICC_PATH" ]; then
        echo "ERROR: mpicc not found. 'module load' may have failed."
        exit 1
    fi
    
    # 2. Dynamically find the library path
    # We use 'readlink -f' to normalize the path (e.g., removing /bin/../lib)
    MPI_BIN_DIR=$(dirname "$MPICC_PATH")
    MPI_LIB_PATH=$(readlink -f "$MPI_BIN_DIR/../lib")
    
    echo "FOUND MPI LIB PATH: ${MPI_LIB_PATH}"
    
    # 3. Clean and Configure
    # REMOVED ./autogen.sh (Not needed for release tarballs)
    [ -f Makefile ] && make distclean
    
    ./configure CC="$MPICC_PATH" CXX="$(which mpicxx)" \
        LDFLAGS="-Wl,-rpath,${MPI_LIB_PATH}" \
        --prefix="{{ osu_prefix }}"
    
    make -j
    make install
  args:
    chdir: "{{ osu_src_dir }}"
    executable: /bin/bash

