---
- name: Install OpenMPI and build OSU Micro-Benchmarks
  hosts: all
  become: true
  gather_facts: true

  vars:
    #osu_version: "8.0b2"
    osu_version: "7.5.2"
    osu_tarball: "osu-micro-benchmarks-{{ osu_version }}.tar.gz"
    osu_url: "https://mvapich.cse.ohio-state.edu/download/mvapich/{{ osu_tarball }}"
    osu_src_dir: "/tmp/osu-micro-benchmarks-{{ osu_version }}"
    mpi_module: "mpi/openmpi-x86_64"

  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - openmpi
          - openmpi-devel
          - environment-modules
          - autoconf
          - automake
          - libtool
          - make
          - gcc
          - gcc-c++
        state: present

    - name: Ensure modules environment is available system-wide
      ansible.builtin.shell: |
        source /etc/profile.d/modules.sh
      args:
        executable: /bin/bash
      changed_when: false

    - name: Download OSU Micro-Benchmarks tarball
      ansible.builtin.get_url:
        url: "{{ osu_url }}"
        dest: "/tmp/{{ osu_tarball }}"
        mode: "0644"

    - name: Extract OSU Micro-Benchmarks
      ansible.builtin.unarchive:
        src: "/tmp/{{ osu_tarball }}"
        dest: "/tmp"
        remote_src: true
        creates: "{{ osu_src_dir }}"

    - name: Generate, configure, build and install the OSU Micro-Benchmarks 
      ansible.builtin.shell: |
        source /etc/profile.d/modules.sh
        module load {{ mpi_module }}
        ./autogen.sh
        ./configure CC="$(which mpicc)" CXX="$(which mpicxx)"
        make uninstall
        make -j
        make install
      args:
        chdir: "{{ osu_src_dir }}"
        executable: /bin/bash
