---
# Ubuntu needrestart may otherwise restart networkd/resolved/sshd after apt,
# disrupting the SSH-based pNFS deployment. This also applies to nested sudo/SSH
# installs, where a caller's NEEDRESTART_MODE environment is not preserved.
- name: Defer automatic package-triggered service restarts on Debian hosts
  become: true
  when: ansible_facts.os_family == 'Debian'
  block:
    - name: Ensure needrestart configuration directory exists
      ansible.builtin.file:
        path: /etc/needrestart/conf.d
        state: directory
        mode: '0755'
    - name: Keep needrestart in list-only mode during cluster deployment
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/zz-tessi-pnfs.conf
        mode: '0644'
        content: |
          # Managed by TESSI: deployment controls service restarts explicitly.
          $nrconf{restart} = 'l';
