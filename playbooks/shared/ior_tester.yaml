---
- name: Hello World Playbook
  hosts: clients
  become: true # run as root on the VMs
  gather_facts: false
  vars:
    ior_result_file: "/tmp/ior_results.json"

  tasks:
  - name: Create empty IOR results file on control node
    copy:
      content: ""
      dest: "{{ ior_result_file }}"
    delegate_to: localhost
    become: false

  - name: Run IOR on clients using mpirun with delegated tasks
    block:
      - name: Count the hosts in the clients group
        set_fact:
          client_count: "{{ groups['clients'] | length }}"

      - name: Set IOR parameters as facts
        set_fact:
          hostfile:         "/tmp/hosts.{{ UNIQUE_TAG }}"
          segmentCount:     40       
          transferSize:     1048576   
          blockSize:        10485760        
          summaryFormat:    "JSON"
          summaryFile:      "/tmp/ior_{{ UNIQUE_TAG }}.json"

      - name: Debug fstype and client count
        debug:
          var: fstype
          var: client_count

      - name: Set outputPath using fstype and UNIQUE_TAG
        set_fact:
          outputPath: "/mnt/{{ fstype }}/ior.{{ UNIQUE_TAG }}"

      - name: Write the list of client hostnames to the hostfile
        copy:
          content: "{{ groups['clients'] | join('\n') }}"
          dest: "{{ hostfile }}"

      - name: Run IOR tests for multiple MPI implementations
        vars:
          mpi_configs:
            - mpi_module: mpi/mpich-x86_64
              mpirun_args: ""
            - mpi_module: mpi/openmpi-x86_64
              mpirun_args: "--allow-run-as-root --prefix $MPI_HOME --mca btl_tcp_if_include {{ device }}"
        include_tasks: run_ior.yaml
        loop: "{{ mpi_configs }}"
        loop_control:
          loop_var: mpi_config
        register: ior_task_results

    when: inventory_hostname == groups['clients'][0]

- name: Generate IOR DOT graph and PNG
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    image_path_dot: "{{ image_dir }}/ior_results.dot"
    image_path_png: "{{ image_dir }}/ior_results.png"
  tasks:
    - name: Ensure image_dir exists
      file:
        path: "{{ image_dir }}"
        state: directory

    - name: Slurp IOR results JSONL file
      slurp:
        src: "/tmp/ior_results.json"
      register: ior_raw
      delegate_to: localhost
      run_once: true

    - name: Decode raw content from IOR result file
      set_fact:
        ior_result_lines: "{{ ior_raw.content | b64decode }}"

    - name: Debug individual JSONL lines
      debug:
        msg: "{{ item | from_json }}"
      loop: "{{ ior_result_lines | split('\n') | reject('equalto', '') }}"

    - name: Show raw IOR lines (as text)
      debug:
        var: ior_result_lines

    - name: Parse decoded IOR lines into list of dicts
      set_fact:
        ior_results: "{{ ior_result_lines | split('\n') | reject('equalto', '') | map('from_json') | list }}"

    - name: Show parsed IOR results
      debug:
        var: ior_results

    - name: Write DOT graph to file
      template:
        src: templates/ior_results.dot.j2
        dest: "{{ image_path_dot }}"

    - name: Convert DOT to PNG
      shell: "dot -Tpng {{ image_path_dot }} -o {{ image_path_png }}"
      args:
        executable: /bin/bash
