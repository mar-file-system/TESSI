---
- name: Hello World Playbook
  hosts: clients
  become: false # 
  gather_facts: true
  vars:
    ior_result_file: "/tmp/ior_results.json"

  tasks:
  - name: Create empty IOR results file on control node
    copy:
      content: ""
      dest: "{{ ior_result_file }}"
    delegate_to: localhost
    become: false

  - name: Run IOR on clients using mpirun with delegated tasks
    block:
      - name: Count the hosts in the clients group
        set_fact:
          client_count: "{{ groups['clients'] | length }}"

      - name: Scan public keys of all client nodes from each client executor
        ansible.builtin.shell: "ssh-keyscan -H {{ item }}"
        loop: "{{ groups['clients'] }}"
        register: scanned_client_keys
        changed_when: false

      - name: Append clean client signatures to local known_hosts profiles
        ansible.builtin.known_hosts:
          name: "{{ item.item }}"
          key: "{{ item.stdout }}"
          state: present
        loop: "{{ scanned_client_keys.results }}"
        # Discard lines that contain standard warning headers or empty captures
        when:
          - item.stdout is defined
          - item.stdout != ""
          - not item.stdout.startswith('#')

      - name: Set IOR parameters as facts
        set_fact:
          hostfile:         "/tmp/hosts.{{ UNIQUE_TAG }}"
          segmentCount:     40       
          transferSize:     1048576   
          blockSize:        10485760        
          summaryFormat:    "JSON"
          summaryFile:      "/tmp/ior_{{ UNIQUE_TAG }}.json"

      - name: Debug fstype and client count
        debug:
          var: fstype
          var: client_count

      - name: Set outputPath using fstype and UNIQUE_TAG and {{ ansible_env.USER }}
        set_fact:
          outputPath: "/mnt/{{ fstype }}/{{ ansible_env.USER }}/ior.{{ UNIQUE_TAG }}"

      - name: Load OS-specific variables
        include_vars: "../vars/mpi_{{ ansible_os_family }}.yml"

      - name: Run IOR tests for multiple MPI implementations
        include_tasks: run_ior.yaml
        loop: "{{ mpi_implementations }}"
        loop_control:
          loop_var: mpi_config
        register: ior_task_results

    when: inventory_hostname == groups['clients'][0]

- name: Generate IOR DOT graph and PNG
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    image_path_dot: "{{ image_dir }}/ior_results.dot"
    image_path_png: "{{ image_dir }}/ior_results.png"
  tasks:
    - name: Ensure image_dir exists
      file:
        path: "{{ image_dir }}"
        state: directory

    - name: Slurp IOR results JSONL file
      slurp:
        src: "/tmp/ior_results.json"
      register: ior_raw
      delegate_to: localhost
      run_once: true

    - name: Decode raw content from IOR result file
      set_fact:
        ior_result_lines: "{{ (ior_raw.content | b64decode) | string }}"

    - name: Debug raw content
      debug:
        var: ior_result_lines

    - name: Debug individual JSONL lines
      debug:
        msg: "{{ item | from_json }}"
      loop: "{{ ior_result_lines | split('\n') | reject('equalto', '') }}"

    - name: Show raw IOR lines (as text)
      debug:
        var: ior_result_lines

    - name: Parse decoded IOR lines into list of dicts
      set_fact:
        ior_results: "{{ ior_result_lines | split('\n') | reject('equalto', '') | map('from_json') | list }}"

    - name: Show parsed IOR results
      debug:
        var: ior_results

    - name: Write DOT graph to file
      template:
        src: templates/ior_results.dot.j2
        dest: "{{ image_path_dot }}"

    - name: Convert DOT to PNG
      shell: "dot -Tpng {{ image_path_dot }} -o {{ image_path_png }}"
      args:
        executable: /bin/bash
