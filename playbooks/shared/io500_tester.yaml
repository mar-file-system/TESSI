---
- name: Check local storage disk usage
  hosts: all
  gather_facts: false

  tasks:
    - name: Inspect local storage if variable is set
      when: local_storage is defined
      block:
        - name: Run df -hT on local_storage
          ansible.builtin.command:
            cmd: "df -hT {{ local_storage }}"
          register: df_output
          changed_when: false

        - name: Display df -hT output
          ansible.builtin.debug:
            var: df_output.stdout_lines

- name: Capture server counters before IO500
  hosts: all:!clients
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Discover the InfiniBand data-plane interface
      ansible.builtin.include_tasks: ../tasks/discover_ib_ip.yaml

    - name: Capture starting network and storage counters
      ansible.builtin.include_tasks: ../tasks/start_network_storage_counters.yaml
      vars:
        counter_ib_device: "{{ infiniband_device }}"
        counter_storage_path: "{{ local_storage }}"

- name: Run IO500 using all MPI implementations 
  hosts: clients # must run on all because we require the fqdn for each to create the hostfile
  gather_facts: true
  become: false

  tasks:
    - name: Run IO500 on just the lead client 
      when: inventory_hostname == groups['clients'][0]
      block:
        - name: Gather only the OS family fact
          ansible.builtin.setup:

        - name: Load OS-specific variables
          ansible.builtin.include_vars: "../vars/mpi_{{ ansible_os_family }}.yml"

        - name: Load IO500 variables
          ansible.builtin.include_vars: "../vars/io500.yaml"

        - name: Run IO500 tests for multiple MPI implementations
          ansible.builtin.include_tasks: run_io500.yaml
          loop: "{{ mpi_implementations }}"
          loop_control:
            loop_var: mpi_config
          register: io500_task_results
      # Enforce execution strictly on the first host of the clients group

- name: Collect, aggregate, and save server counters after IO500
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    counter_hosts: "{{ groups['all'] | difference(groups.get('clients', [])) }}"
    counter_report_host: >-
      {{ (groups['all'] | difference(groups.get('clients', [])))[0] }}
    network_storage_stats_path: >-
      {{ hostvars[groups['clients'][0]].output_dir }}/network_storage_stats.txt

  tasks:
    - name: Collect and save network and storage counter deltas
      ansible.builtin.include_tasks: ../tasks/collect_save_network_storage_counters.yaml
