---
- name: Check local storage disk usage
  hosts: all
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Inspect local storage if variable is set
      when: local_storage is defined
      block:
        - name: Run df -hT on local_storage
          ansible.builtin.command:
            cmd: "df -hT {{ local_storage }}"
          register: df_output
          changed_when: false

        - name: Display df -hT output
          ansible.builtin.debug:
            var: df_output.stdout_lines

- name: Capture network and optional storage counters before IO500
  hosts: all
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Discover the InfiniBand data-plane interface
      ansible.builtin.include_tasks: ../tasks/discover_ib_ip.yaml

    - name: Capture starting network and storage counters
      ansible.builtin.include_tasks: ../tasks/start_network_storage_counters.yaml
      vars:
        counter_ib_device: "{{ infiniband_device }}"
        counter_storage_path: "{{ local_storage | default('') }}"

- name: Run IO500 using all MPI implementations 
  hosts: clients # must run on all because we require the fqdn for each to create the hostfile
  gather_facts: true
  become: false
  any_errors_fatal: true

  tasks:
    - name: Run IO500 on just the lead client 
      when: inventory_hostname == groups['clients'][0]
      block:
        - name: Gather only the OS family fact
          ansible.builtin.setup:

        - name: Load OS-specific variables
          ansible.builtin.include_vars: "../vars/mpi_{{ ansible_os_family }}.yml"

        - name: Load IO500 variables
          ansible.builtin.include_vars: "../vars/io500.yaml"

        - name: Select configured MPI implementations for IO500
          ansible.builtin.set_fact:
            io500_mpi_implementations: >-
              {{ mpi_implementations
                 | selectattr(
                     'module',
                     'in',
                     (io500 | default({})).mpi_modules
                       | default(mpi_implementations | map(attribute='module') | list)
                   )
                 | list }}

        - name: Require at least one configured MPI implementation for IO500
          ansible.builtin.assert:
            that:
              - io500_mpi_implementations | length > 0
            fail_msg: >-
              None of the requested IO500 MPI modules
              {{ (io500 | default({})).mpi_modules | default([]) }}
              are available in mpi_implementations.

        - name: Run IO500 tests for selected MPI implementations
          ansible.builtin.include_tasks: run_io500.yaml
          loop: "{{ io500_mpi_implementations }}"
          loop_control:
            loop_var: mpi_config
          register: io500_task_results
      # Enforce execution strictly on the first host of the clients group

- name: Collect, aggregate, and save server counters after IO500
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    io500_lead_client: "{{ groups['clients'][0] }}"
    counter_hosts: "{{ groups['all'] }}"
    aggregate_counter_hosts: >-
      {{ groups['all'] | difference(groups.get('clients', [])) }}
    counter_report_host: >-
      {{ (groups['all'] | difference(groups.get('clients', [])))[0] }}
    network_storage_stats_path: >-
      {{ hostvars[io500_lead_client].io500_result_dir }}/network_storage_stats.txt

  tasks:
    - name: Require an IO500 result directory before saving counter statistics
      ansible.builtin.assert:
        that:
          - hostvars[io500_lead_client].io500_result_dir is defined
        fail_msg: >-
          IO500 did not define a result directory on {{ io500_lead_client }}.
          Check the earlier lead-client failure; counter statistics cannot be saved.
      run_once: true

    - name: Collect and save network and storage counter deltas
      ansible.builtin.include_tasks: ../tasks/collect_save_network_storage_counters.yaml
      vars:
        counter_workload_label: IO500
