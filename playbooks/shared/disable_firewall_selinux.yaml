---
- name: Gather facts
  setup:

# --- SELinux Handling ---
- name: Check SELinux status (RedHat only)
  command: getenforce
  register: selinux_status
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"
  tags: [selinux, config, precheck]

- name: Disable SELinux in config (RedHat only)
  lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=disabled'
  when: 
    - ansible_os_family == "RedHat"
    - selinux_status.stdout | default('Disabled') != "Disabled"
  register: disable_selinux

- name: Set SELinux to permissive immediately (RedHat only)
  command: setenforce 0
  when: 
    - ansible_os_family == "RedHat"
    - selinux_status.stdout | default('Disabled') != "Disabled"
  register: setenforce_result

# --- Firewall Handling ---
- name: Check firewall status
  service_facts:
  tags: [config, firewall]

- name: Stop and mask firewalld (RedHat/Alma)
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: no
    masked: yes
  when: "'firewalld.service' in ansible_facts.services"
  register: firewalld_change
  tags: [config, firewall]

- name: Stop and disable ufw (Ubuntu/Debian)
  ansible.builtin.service:
    name: ufw
    state: stopped
    enabled: no
  when: "'ufw.service' in ansible_facts.services"
  register: ufw_change
  tags: [config, firewall]

# --- Reboot Logic ---
- name: Ensure change variables are initialized
  set_fact:
    selinux_changed: "{{ (disable_selinux.changed | default(false)) or (setenforce_result.changed | default(false)) }}"
    firewall_changed: "{{ (firewalld_change.changed | default(false)) or (ufw_change.changed | default(false)) }}"

- name: Reboot if security posture was changed (don't actually reboot)
  ansible.builtin.reboot:
  when: false and (selinux_changed or firewall_changed)

# --- Verification ---
- name: Verify SELinux is disabled after reboot (RedHat only)
  block:
  - name: Verify it is disabled
    command: getenforce
    register: selinux_after
    changed_when: false
    tags: [selinux, config, precheck]

  - name: Assert SELinux is effectively open (RedHat only)
    assert:
      that:
        - "selinux_after.stdout == 'Disabled' or selinux_after.stdout == 'Permissive'"
      fail_msg: "Error: SELinux is still Enforcing. Status: {{ selinux_after.stdout }}"

  when: ansible_os_family == "RedHat"
