- name: Set ranks based on benchmark type
  set_fact:
    osu_np: >-
      {{
        2
        if ('pt2pt' in osu_exe or 'one-sided' in osu_exe)
        else host_count
      }}

- name: Set output file path for benchmark
  set_fact:
    osu_output_file: "{{ osu_results_directory }}/{{ osu_exe | basename }}"

- name: Select OSU executable from the shared installation directory
  ansible.builtin.set_fact:
    executable: "{{ osu_binary_dir }}/{{ osu_exe }}"

- debug:
    var: executable

- name: Check that {{ executable }} exists and is executable
  ansible.builtin.stat:
    path: "{{ executable }}"
  register: exec_stat

- name: Fail if {{ executable }} is missing or not executable
  ansible.builtin.fail:
    msg: "{{ executable }} does not exist or is not executable"
  when: not exec_stat.stat.exists or not exec_stat.stat.executable

- name: Run OSU benchmark through the shared module execution wrapper
  ansible.builtin.include_tasks: ../tasks/run_with_mpi_module.yaml
  vars:
    mpi_module: "{{ mpi_config.mpi_module }}"
    mpi_operation_name: "Run OSU benchmark {{ osu_exe }}"
    command_timeout: 1200
    show_output: true
    commands: >-
      {{ mpi_launcher_command }} -np {{ osu_np }} {{ mpi_config.mpirun_args | default('') }}
      {{ executable | quote }}

- name: Write OSU output {{ osu_output_file }}
  copy:
    content: "{{ mpi_shell_result.stdout }}\n"
    dest: "{{ osu_output_file }}"
  delegate_to: localhost
  become: false
  run_once: true

