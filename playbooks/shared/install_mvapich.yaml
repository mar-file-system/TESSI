---
- name: Install MVAPICH2 and module support
  hosts: all
  become: true
  gather_facts: true

  vars:
    mvapich_prefix: /usr/lib64/mvapich2
    modulefile_dir: /usr/share/modulefiles
    mvapich_module_name: mvapich2
    ansible_remote_tmp: /tmp/ansible

  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - environment-modules
          - mvapich2
          - mvapich2-devel
        state: present

    - name: Ensure modulefiles directory exists
      ansible.builtin.file:
        path: "{{ modulefile_dir }}"
        state: directory
        mode: "0755"

    - name: Create MVAPICH2 modulefile
      ansible.builtin.copy:
        dest: "{{ modulefile_dir }}/{{ mvapich_module_name }}"
        mode: "0644"
        content: |
          #%Module1.0
          ##
          ## MVAPICH2 modulefile
          ##
          proc ModulesHelp { } {
              puts stderr "Loads MVAPICH2 MPI environment"
          }

          module-whatis "MVAPICH2 MPI implementation"

          set root {{ mvapich_prefix }}

          prepend-path PATH            $root/bin
          prepend-path LD_LIBRARY_PATH $root/lib
          prepend-path LD_LIBRARY_PATH $root/lib64
          prepend-path MANPATH         $root/share/man

          setenv MPI_HOME $root
          setenv MPI_BIN  $root/bin
          setenv MPI_LIB  $root/lib64
          setenv MPI_INC  $root/include

    - name: Ensure modules are initialized system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/modules.sh
        mode: "0755"
        content: |
          #!/bin/bash
          if [ -f /usr/share/Modules/init/bash ]; then
              source /usr/share/Modules/init/bash
          fi
      when: not ansible_facts.env.MODULESHOME is defined

