- name: Gather facts
  setup:

- name: Load Base OS Family Variables
  include_vars: "tools_{{ ansible_os_family }}.yml"

- name: Layer in Version-Specific Overrides
  include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "tools_{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
      skip: true  # This prevents the task from failing if the file doesn't exist

- name: Include set_hostname 
  include_tasks: set_hostname.yaml

- name: Enable EPEL repository (RedHat only)
  package:
    name: epel-release
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure Development Tools are installed
  package:
    name: "{{ dev_tools_package }}"
    state: present

- name: Ensure Python 3 and Dev Headers are installed
  package:
    name: "{{ python_packages }}"
    state: present

- name: Install Guest Agent and Utils
  package:
    name:
      - qemu-guest-agent
      - rsync
      - pdsh
      - "{{ dns_utils_package }}"
      - "{{ pdsh_ssh_package }}"
    state: present

- name: Ensure cloud-init is installed
  package:
    name: cloud-init
    state: present

- name: Enable and start system services
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - qemu-guest-agent
    - cloud-init
  when: "'physical_hosts' not in group_names"

# Ubuntu handles these via the main cloud-init target; RedHat usually needs them enabled
- name: Enable cloud-init sub-services (RedHat only)
  systemd:
    name: "{{ item }}"
    enabled: yes
  loop:
    - cloud-init-local
    - cloud-config
    - cloud-final
  when:
    - ansible_os_family == "RedHat"
    - "'physical_hosts' not in group_names"

- name: Install MPI and IOR and IO500 on the clients
  when: "'clients' in group_names"
  block:
  - name: Install environment-modules
    ansible.builtin.dnf:
      name: environment-modules
      state: present

  - name: Ensure modules init is available system-wide
    ansible.builtin.copy:
      dest: /etc/profile.d/modules.sh
      mode: "0755"
      content: |
        #!/bin/bash
        if [ -f /usr/share/Modules/init/bash ]; then
            source /usr/share/Modules/init/bash
        fi

  - name: Ensure modules init is sourced system-wide
    ansible.builtin.copy:
      dest: /etc/profile.d/modules.sh
      content: |
        #!/bin/bash
        source /usr/share/Modules/init/bash
      mode: "0755"

  - name: Set canonical MODULEPATH order
    copy:
      dest: /etc/profile.d/modulepath.sh
      mode: "0644"
      content: |
        export MODULEPATH=/etc/modulefiles:/usr/share/modulefiles:${MODULEPATH}

  - name: Install and build MPI  
    include_tasks: install_mpi.yaml

  - name: Discover available MPI modules from install_tools.yaml
    ansible.builtin.include_tasks: ../../tasks/discover_mpi_modules.yaml

  - name: Install and build IOR + MPI Hello and IO500
    include_tasks: install_ior.yaml
    loop: "{{ available_mpi_modules }}"
    loop_control:
      loop_var: available_mpi_module
      label: "{{ available_mpi_module }}"
    vars:
      mpi:
        module: "{{ available_mpi_module }}"
