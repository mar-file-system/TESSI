- name: Discover the OSU MPI installation using the shared task
  ansible.builtin.include_tasks: ../tasks/discover_mpi.yaml
  vars:
    mpi:
      module: "{{ mpi_config.mpi_module }}"

- name: Resolve OSU executable paths using the shared task
  ansible.builtin.include_tasks: ../tasks/osu_paths.yaml
  vars:
    osu_mpi_module: "{{ mpi_config.mpi_module }}"

- name: Write OSU hostfile using the shared task
  ansible.builtin.include_tasks: ../tasks/write_mpi_hostfile.yaml
  vars:
    mpi_module: "{{ mpi_config.mpi_module }}"
    hosts: "{{ ansible_play_hosts }}"
    hostfile_path: "{{ hostfile }}"

- name: Build OSU launcher using shared MPI settings
  ansible.builtin.include_tasks: ../tasks/build_mpi_command.yaml
  vars:
    mpi_launcher_module: "{{ mpi_config.mpi_module }}"
    mpi_launcher_hostfile: "{{ hostfile }}"

- name: Define OSU benchmark executables
  set_fact:
    osu_benchmarks:
      - mpi/startup/osu_hello
      - mpi/pt2pt/osu_latency
      - mpi/pt2pt/osu_bw
      - mpi/collective/osu_allreduce
      - mpi/collective/osu_alltoall
      - mpi/one-sided/osu_get_latency
      - mpi/one-sided/osu_put_bw

- name: Run OSU benchmarks for {{ mpi_config.mpi_module }}
  include_tasks: run_single_osu.yaml
  loop: "{{ osu_benchmarks }}"
  loop_control:
    loop_var: osu_exe

