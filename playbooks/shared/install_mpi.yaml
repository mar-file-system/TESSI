- name: Set fact for modulefile_dir
  set_fact:
    modulefile_dir: /etc/modulefiles/mpi

- name: Install environment-modules
  ansible.builtin.dnf:
    name: environment-modules
    state: present

- name: Ensure modulefiles directory exists
  ansible.builtin.file:
    path: "{{ modulefile_dir }}"
    state: directory
    mode: "0755"

- name: Ensure modules are initialized system-wide
  ansible.builtin.copy:
    dest: /etc/profile.d/modules.sh
    mode: "0755"
    content: |
      #!/bin/bash
      if [ -f /usr/share/Modules/init/bash ]; then
          source /usr/share/Modules/init/bash
      fi

# ---- OpenMPI ----
- name: Install OpenMPI
  ansible.builtin.include_tasks: tasks/install_mpi.yaml
  vars:
    mpi_name: openmpi
    mpi_packages:
      - openmpi
      - openmpi-devel
    mpi_prefix: /usr/lib64/openmpi

# ---- MVAPICH2 ----
- name: Install MVAPICH2
  ansible.builtin.include_tasks: tasks/install_mpi.yaml
  vars:
    mpi_name: mvapich2
    mpi_packages:
      - mvapich2
      - mvapich2-devel
    mpi_prefix: /usr/lib64/mvapich2

