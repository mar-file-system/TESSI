---

- name: Determine whether this host has local storage to provision
  ansible.builtin.set_fact:
    xem_storage_enabled: >-
      {{ local_storage is defined or local_storage_devices is defined }}
    xem_storage_mode: >-
      {{ local_storage_mode | default('filesystem') }}

- name: Assert required storage variables are defined
  ansible.builtin.assert:
    that:
      - storage_device is defined
      - nvme_mount is defined
      - local_storage is defined
  when:
    - xem_storage_enabled | bool
    - xem_storage_mode != 'raw-devices'

- name: Require local storage devices in raw-device mode
  ansible.builtin.assert:
    that:
      - local_storage_devices is defined
      - local_storage_devices | length > 0
    fail_msg: >-
      local_storage_mode=raw-devices requires a non-empty
      local_storage_devices list.
  when: xem_storage_mode == 'raw-devices'

- name: Determine whether local storage is a raw block device
  ansible.builtin.set_fact:
    xem_storage_is_block_device: >-
      {{ (local_storage | default('')) is match('^/dev/') }}

- name: Select Xem storage provisioning mode
  ansible.builtin.set_fact:
    xem_mount_storage: >-
      {{
        (xem_storage_enabled | bool)
        and xem_storage_mode != 'raw-devices'
        and not (xem_storage_is_block_device | bool)
      }}

- name: Bring up InfiniBand network
  become: true
  ansible.builtin.command:
    cmd: /share/testbed/bin/network --ib up
  register: ib_network_up
  changed_when: false
  failed_when: ib_network_up.rc != 0

- name: Verify InfiniBand network command succeeded
  ansible.builtin.assert:
    that:
      - ib_network_up.rc == 0
    fail_msg: >-
      Failed to bring up InfiniBand network:
      {{ ib_network_up.stderr | default(ib_network_up.stdout) }}

- name: Discover InfiniBand IP address
  ansible.builtin.include_tasks: ../../tasks/discover_ib_ip.yaml

- name: Set proxy environment variables
  become: true
  copy:
    dest: /etc/environment
    content: |
      http_proxy=http://proxy.pdl.cmu.edu:3128/
      https_proxy=http://proxy.pdl.cmu.edu:3128/
      HTTP_PROXY=http://proxy.pdl.cmu.edu:3128/
      HTTPS_PROXY=http://proxy.pdl.cmu.edu:3128/
    owner: root
    group: root
    mode: '0644'

- name: Configure DNF to use proxy
  become: true
  ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: proxy
    value: http://proxy.pdl.cmu.edu:3128/
    state: present

- name: Temporarily use UMD for Ubuntu archive and security repositories
  become: true
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: >-
      (?m)^URIs: http://(?:us\.archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/$
    replace: "URIs: https://mirror.umd.edu/ubuntu/"
    backup: true
  when: ansible_os_family == 'Debian'

- name: Verify configured raw local storage devices
  become: true
  ansible.builtin.command:
    argv:
      - test
      - -b
      - "{{ item }}"
  loop: "{{ local_storage_devices | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  when: xem_storage_mode == 'raw-devices'

- name: Install raw block-device preparation tools
  become: true
  ansible.builtin.package:
    name:
      - mdadm
    state: present
  when: xem_storage_mode == 'raw-devices'

- name: Prepare raw local storage devices for the system playbook
  become: true
  ansible.builtin.shell: |
    set -euo pipefail

    devices=(
    {% for dev in local_storage_devices %}
      {{ dev | quote }}
    {% endfor %}
    )
    declare -A arrays_to_stop=()

    for disk in "${devices[@]}"; do
      while read -r node type mountpoint; do
        if [[ -n "${mountpoint:-}" ]]; then
          umount -lf "$node" 2>/dev/null || umount -lf "$mountpoint" 2>/dev/null || true
        fi
        swapoff "$node" 2>/dev/null || true

        node_name=$(basename "$node")
        for holder in "/sys/class/block/${node_name}/holders/"*; do
          [[ -e "$holder" ]] || continue
          holder_name=$(basename "$holder")
          if [[ -d "/sys/class/block/${holder_name}/md" ]]; then
            arrays_to_stop["/dev/${holder_name}"]=1
          fi
        done
      done < <(lsblk -nrpo NAME,TYPE,MOUNTPOINT "$disk")
    done

    for array in "${!arrays_to_stop[@]}"; do
      mdadm --stop "$array" 2>/dev/null || true
    done
    udevadm settle

    for disk in "${devices[@]}"; do
      while read -r node; do
        mdadm --zero-superblock --force "$node" 2>/dev/null || true
      done < <(lsblk -nrpo NAME "$disk" | tac)
    done
    udevadm settle
  args:
    executable: /bin/bash
  changed_when: true
  when: xem_storage_mode == 'raw-devices'

- name: Define optional five-disk NVMe RAID0 layout
  ansible.builtin.set_fact:
    nvme_raid_members: >-
      {{ local_storage_raid_members | default([
           '/dev/nvme0n1',
           '/dev/nvme1n1',
           '/dev/nvme2n1',
           '/dev/nvme3n1',
           '/dev/nvme4n1'
         ]) }}
    nvme_raid_device: >-
      {{ local_storage if xem_storage_is_block_device | bool else '/dev/md0' }}
    mdadm_config_path: >-
      {{ '/etc/mdadm.conf'
         if ansible_os_family == 'RedHat'
         else '/etc/mdadm/mdadm.conf' }}
  when: xem_storage_mode != 'raw-devices'

- name: Check whether all five NVMe disks exist
  ansible.builtin.shell: |
    set -e
    {% for dev in nvme_raid_members %}
    test -b {{ dev | quote }}
    {% endfor %}
  args:
    executable: /bin/bash
  register: nvme_raid_probe
  changed_when: false
  failed_when: false
  when:
    - xem_storage_enabled | bool
    - xem_storage_mode != 'raw-devices'

- name: Record whether the five-disk NVMe RAID0 layout is available
  ansible.builtin.set_fact:
    nvme_raid_available: "{{ (nvme_raid_probe.rc | default(1)) == 0 }}"
  when: xem_storage_mode != 'raw-devices'

- name: Require every RAID0 member when preparing an unmounted block device
  ansible.builtin.assert:
    that:
      - nvme_raid_available | bool
    fail_msg: >-
      Cannot create {{ nvme_raid_device }} because one or more configured
      RAID0 members are missing: {{ nvme_raid_members | join(', ') }}.
  when:
    - xem_storage_enabled | bool
    - xem_storage_mode != 'raw-devices'
    - not (xem_mount_storage | bool)

- name: Check if the target mount point is already active
  ansible.builtin.command: findmnt -n -o SOURCE "{{ nvme_mount }}"
  register: active_mount
  changed_when: false
  failed_when: false
  when: xem_mount_storage | bool

- name: Check whether the active mount is already the expected five-disk RAID
  when:
    - xem_storage_mode != 'raw-devices'
    - nvme_raid_available | bool
    - active_mount.rc | default(1) == 0
    - xem_mount_storage | bool
  ansible.builtin.shell: |
    set -euo pipefail

    source_device=$(readlink -f {{ active_mount.stdout | quote }})
    array_name=$(basename "$source_device")
    sysfs_array="/sys/class/block/${array_name}"

    test -d "${sysfs_array}/md"
    test "$(find "${sysfs_array}/slaves" -mindepth 1 -maxdepth 1 -type l | wc -l)" -eq {{ nvme_raid_members | length }}

    {% for dev in nvme_raid_members %}
    test -e "${sysfs_array}/slaves/{{ dev | basename }}"
    {% endfor %}
  args:
    executable: /bin/bash
  register: active_mount_is_expected_raid
  changed_when: false
  failed_when: false

- name: Check whether the configured RAID0 block device already uses the expected members
  ansible.builtin.shell: |
    set -euo pipefail

    array_name=$(basename {{ nvme_raid_device | quote }})
    sysfs_array="/sys/class/block/${array_name}"

    test -d "${sysfs_array}/md"
    test "$(find "${sysfs_array}/slaves" -mindepth 1 -maxdepth 1 -type l | wc -l)" -eq {{ nvme_raid_members | length }}

    {% for dev in nvme_raid_members %}
    test -e "${sysfs_array}/slaves/{{ dev | basename }}"
    {% endfor %}
  args:
    executable: /bin/bash
  register: raid_device_is_expected
  changed_when: false
  failed_when: false
  when:
    - xem_storage_mode != 'raw-devices'
    - nvme_raid_available | bool

- name: Determine whether storage provisioning can be skipped
  ansible.builtin.set_fact:
    storage_provisioning_complete: >-
      {{
        not (xem_storage_enabled | bool)
        or xem_storage_mode == 'raw-devices'
        or
        (
          ((raid_device_is_expected.rc | default(1)) == 0)
          if not (xem_mount_storage | bool)
          else
          (
            (active_mount.rc | default(1) == 0)
            and
            (
              ((nvme_raid_available | bool) and (active_mount_is_expected_raid.rc | default(1) == 0))
              or
              (not (nvme_raid_available | bool))
            )
          )
        )
      }}

- name: Debug active storage state
  ansible.builtin.debug:
    msg: >-
      Mount {{ nvme_mount }} is already active on {{ active_mount.stdout }}
      {% if nvme_raid_available | bool %}and uses all five expected NVMe RAID members{% endif %}.
      Skipping provisioning.
  when:
    - storage_provisioning_complete | bool
    - xem_mount_storage | bool

- name: Debug active RAID0 block-device state
  ansible.builtin.debug:
    msg: >-
      RAID0 block device {{ nvme_raid_device }} already uses
      {{ nvme_raid_members | join(', ') }}. Skipping provisioning.
  when:
    - storage_provisioning_complete | bool
    - xem_storage_enabled | bool
    - xem_storage_mode != 'raw-devices'
    - not (xem_mount_storage | bool)

- name: Provision and mount storage
  when:
    - xem_storage_enabled | bool
    - xem_storage_mode != 'raw-devices'
    - not (storage_provisioning_complete | bool)
  become: true
  block:
    - name: Build RAID0 from all five NVMe disks when available
      when: nvme_raid_available | bool
      block:
        - name: Install software RAID tooling
          ansible.builtin.package:
            name:
              - mdadm
              - gdisk
            state: present

        - name: Destroy existing data, filesystems, partitions, and RAID metadata on NVMe members
          ansible.builtin.shell: |
            set -euo pipefail

            members=(
            {% for dev in nvme_raid_members %}
              {{ dev | quote }}
            {% endfor %}
            )

            declare -A arrays_to_stop=()

            # The requested target mount must not keep any member or old array busy.
            umount -lf {{ nvme_mount | quote }} 2>/dev/null || true

            # Unmount filesystems, disable swap, and identify arrays holding
            # either a whole disk or one of its existing partitions.
            for disk in "${members[@]}"; do
              while read -r node type mountpoint; do
                if [[ -n "${mountpoint:-}" ]]; then
                  umount -lf "$node" 2>/dev/null || umount -lf "$mountpoint" 2>/dev/null || true
                fi
                swapoff "$node" 2>/dev/null || true

                node_name=$(basename "$node")
                for holder in "/sys/class/block/${node_name}/holders/"*; do
                  [[ -e "$holder" ]] || continue
                  holder_name=$(basename "$holder")
                  if [[ -d "/sys/class/block/${holder_name}/md" ]]; then
                    arrays_to_stop["/dev/${holder_name}"]=1
                  fi
                done
              done < <(lsblk -nrpo NAME,TYPE,MOUNTPOINT "$disk")
            done

            if [[ -b {{ nvme_raid_device | quote }} ]]; then
              arrays_to_stop[{{ nvme_raid_device | quote }}]=1
            fi

            # Stop any active md arrays using the disks.
            for array in "${!arrays_to_stop[@]}"; do
              while read -r node type mountpoint; do
                if [[ -n "${mountpoint:-}" ]]; then
                  umount -lf "$node" 2>/dev/null || umount -lf "$mountpoint" 2>/dev/null || true
                fi
                swapoff "$node" 2>/dev/null || true
              done < <(lsblk -nrpo NAME,TYPE,MOUNTPOINT "$array" 2>/dev/null || true)

              mdadm --stop "$array" 2>/dev/null || true
            done

            udevadm settle

            # Intentionally erase every existing signature and partition table.
            # Children are wiped first so old partition-level RAID metadata is removed.
            for disk in "${members[@]}"; do
              while read -r node; do
                mdadm --zero-superblock --force "$node" 2>/dev/null || true
                wipefs --all --force "$node" 2>/dev/null || true
              done < <(lsblk -nrpo NAME "$disk" | tac)

              sgdisk --zap-all "$disk"
              wipefs --all --force "$disk"
              partprobe "$disk" 2>/dev/null || true
            done

            udevadm settle
          args:
            executable: /bin/bash
          changed_when: true

        - name: Create NVMe RAID0 array
          ansible.builtin.command:
            argv: >-
              {{ [
                   'mdadm',
                   '--create',
                   nvme_raid_device,
                   '--name=tessi_nvme',
                   '--metadata=1.2',
                   '--level=0',
                   '--raid-devices=' ~ (nvme_raid_members | length | string),
                   '--run',
                   '--force'
                 ] + nvme_raid_members }}
          changed_when: true

        - name: Wait for the RAID device to become available
          ansible.builtin.shell: |
            set -e
            for attempt in $(seq 1 20); do
              udevadm settle
              if test -b {{ nvme_raid_device | quote }}; then
                exit 0
              fi
              sleep 1
            done
            echo "RAID device {{ nvme_raid_device }} did not appear" >&2
            exit 1
          args:
            executable: /bin/bash
          changed_when: false

        - name: Capture RAID assembly configuration
          ansible.builtin.shell: |
            set -euo pipefail
            array_uuid=$(mdadm --detail {{ nvme_raid_device | quote }} | awk -F': ' '/^[[:space:]]*UUID[[:space:]]*:/ { print $2; exit }')
            test -n "$array_uuid"
            printf 'ARRAY %s UUID=%s\n' {{ nvme_raid_device | quote }} "$array_uuid"
          args:
            executable: /bin/bash
          register: mdadm_scan
          changed_when: false

        - name: Persist RAID assembly configuration
          ansible.builtin.blockinfile:
            path: "{{ mdadm_config_path }}"
            create: true
            mode: '0644'
            marker: "# {mark} ANSIBLE MANAGED TESSI NVME RAID"
            block: "{{ mdadm_scan.stdout }}"
          register: mdadm_config

        - name: Refresh initramfs after changing RAID configuration
          ansible.builtin.command: >-
            {{ 'dracut -f' if ansible_os_family == 'RedHat' else 'update-initramfs -u' }}
          when: mdadm_config.changed
          changed_when: true

        - name: Use RAID0 as the resolved storage device
          ansible.builtin.set_fact:
            resolved_device: "{{ nvme_raid_device }}"

    - name: Select or create a partition on the configured fallback disk
      when:
        - not (nvme_raid_available | bool)
        - xem_mount_storage | bool
      block:
        - name: Deploy topology analysis engine
          ansible.builtin.copy:
            dest: /tmp/analyze_storage_topology.py
            mode: '0755'
            content: |
              #!/usr/bin/env python3
              import json, subprocess, sys

              device = sys.argv[1]

              # 1. Enumerate unused partitions
              try:
                  lsblk_out = subprocess.check_output(["lsblk", "-J", "-b", "-o", "NAME,TYPE,FSTYPE,MOUNTPOINT,SIZE", device], universal_newlines=True)
                  lsblk_data = json.loads(lsblk_out)
              except Exception as e:
                  print(json.dumps({"error": f"lsblk failed: {str(e)}"}))
                  sys.exit(1)

              unused_parts = []
              for dev in lsblk_data.get("blockdevices", []):
                  for child in dev.get("children", []):
                      if child.get("type") == "part" and not child.get("mountpoint"):
                          unused_parts.append({
                              "type": "partition",
                              "name": f"/dev/{child['name']}",
                              "size_bytes": int(child["size"])
                          })

              # 2. Enumerate unallocated gaps using parted
              gaps = []
              try:
                  parted_out = subprocess.check_output(["parted", "-s", "-m", device, "unit", "B", "print", "free"], universal_newlines=True, stderr=subprocess.DEVNULL)
                  for line in parted_out.splitlines():
                      if "free;" in line:
                          parts = line.split(":")
                          if len(parts) >= 4:
                              size_bytes = int(parts[3].rstrip("B"))
                              # Filter out structural 1MB alignment gaps
                              if size_bytes > 2097152:
                                  gaps.append({
                                      "type": "gap",
                                      "name": f"Gap from {parts[1].rstrip('B')}B to {parts[2].rstrip('B')}B",
                                      "size_bytes": size_bytes
                                  })
              except Exception:
                  pass

              all_opts = unused_parts + gaps
              if not all_opts:
                  print(json.dumps({"error": "No unused partitions or usable gaps found."}))
                  sys.exit(1)

              # Find the absolute largest available space
              largest = max(all_opts, key=lambda x: x["size_bytes"])

              print(json.dumps({
                  "unused_partitions": unused_parts,
                  "gaps": gaps,
                  "largest": largest
              }))

        - name: Execute topology analysis
          ansible.builtin.command: /tmp/analyze_storage_topology.py "{{ storage_device }}"
          register: topology_raw
          changed_when: false

        - name: Parse topology analysis payload
          ansible.builtin.set_fact:
            topology: "{{ topology_raw.stdout | from_json }}"

        - name: Debug storage topography and selection
          ansible.builtin.debug:
            msg:
              - "=== UNUSED PARTITIONS FOUND ==="
              - "{{ topology.unused_partitions }}"
              - "=== UNALLOCATED GAPS FOUND ==="
              - "{{ topology.gaps }}"
              - "=== CHOSEN LARGEST OPTION ==="
              - "{{ topology.largest }}"

        - name: Assert the chosen space meets minimum capacity requirements
          ansible.builtin.assert:
            that:
              # Convert minimum_nvme_gb to bytes (1024^3) for exact comparison
              - (topology.largest.size_bytes | int) >= (minimum_nvme_gb | int * 1073741824)
            fail_msg: >
              Validation failed: The largest available space is {{ (topology.largest.size_bytes | int / 1073741824) | round(2) }} GB,
              which is less than the required minimum of {{ minimum_nvme_gb }} GB.
            success_msg: "Capacity requirements met. Proceeding with provisioning."

        - name: Create new partition in the selected gap
          when: topology.largest.type == 'gap'
          block:
            - name: Relocate GPT backup header to end of disk
              ansible.builtin.command: sgdisk -e {{ storage_device }}
              changed_when: false # This is a maintenance fix

            - name: Actually create new partition in the selected gap
              ansible.builtin.shell: |
                set -e
                # sgdisk -N 0 automatically utilizes the largest unallocated space
                sgdisk -N 0 {{ storage_device }} > /dev/null
                partprobe {{ storage_device }}

                # Defensive polling: Wait up to 10 seconds for the kernel to expose the new large partition
                for i in $(seq 1 10); do
                  udevadm settle

                  # Filter dynamically using the minimum_nvme_gb variable converted to bytes
                  NEW_PART=$(lsblk -J -b -o NAME,TYPE,FSTYPE,MOUNTPOINT,SIZE {{ storage_device }} | \
                    jq -r --argjson min_bytes "{{ minimum_nvme_gb | int * 1073741824 }}" \
                    '.blockdevices[0].children[]? | select(.type == "part" and .fstype == null and .mountpoint == null and .size >= $min_bytes) | "\(.size) \(.name)"' | \
                    sort -n | tail -n 1 | awk '{print $2}')

                  if [ -n "$NEW_PART" ]; then
                    echo "$NEW_PART"
                    exit 0
                  fi
                  sleep 1
                done

                echo "Error: New partition meeting minimum size criteria did not register within the timeout." >&2
                exit 1
              register: newly_created_partition
              changed_when: true

        - name: Set resolved partition path
          ansible.builtin.set_fact:
            resolved_device: "{{ topology.largest.name if topology.largest.type == 'partition' else '/dev/' + newly_created_partition.stdout }}"

    - name: Create XFS filesystem on the resolved partition
      community.general.filesystem:
        fstype: xfs
        dev: "{{ resolved_device }}"
        force: true
      when: xem_mount_storage | bool

    - name: Ensure the mount point directory exists
      ansible.builtin.file:
        path: "{{ nvme_mount }}"
        state: directory
        mode: '0755'
      when: xem_mount_storage | bool

    - name: Mount the partition and persist in fstab
      ansible.builtin.mount:
        path: "{{ nvme_mount }}"
        src: "{{ resolved_device }}"
        fstype: xfs
        state: mounted
        opts: defaults
      when: xem_mount_storage | bool

- name: Get actual controlling user (handling sudo)
  set_fact:
    local_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"

- name: Create per-user directory on mounted storage
  become: true
  file:
    path: "{{ nvme_mount }}/{{ local_user }}"
    state: directory
    owner: "{{ local_user }}"
    mode: '0755'
  when: xem_mount_storage | bool

- name: Verify configured raw local-storage devices
  when:
    - xem_storage_enabled | bool
    - xem_storage_is_block_device | bool
  block:
    - name: Check configured raw local-storage devices
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ local_storage_devices | default([local_storage]) }}"
      register: raw_local_storage_devices

    - name: Require every configured raw local-storage device
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isblk
        fail_msg: "Configured local-storage device {{ item.item }} is not a block device."
      loop: "{{ raw_local_storage_devices.results }}"
      loop_control:
        label: "{{ item.item }}"
