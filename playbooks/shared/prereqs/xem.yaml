---

- name: Assert required variables are defined
  assert:
    that:
      - storage_device is defined
      - nvme_mount is defined

- name: Set proxy environment variables
  copy:
    dest: /etc/environment
    content: |
      http_proxy=http://proxy.pdl.cmu.edu:3128/
      https_proxy=http://proxy.pdl.cmu.edu:3128/
      HTTP_PROXY=http://proxy.pdl.cmu.edu:3128/
      HTTPS_PROXY=http://proxy.pdl.cmu.edu:3128/
    owner: root
    group: root
    mode: '0644'

- name: Configure DNF to use proxy
  ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: proxy
    value: http://proxy.pdl.cmu.edu:3128/
    state: present

- name: Check if the target mount point is already active
  ansible.builtin.command: findmnt -n -o SOURCE "{{ nvme_mount }}"
  register: active_mount
  changed_when: false
  failed_when: false

- name: Debug active mount state
  ansible.builtin.debug:
    msg: "Mount {{ nvme_mount }} is already active on device {{ active_mount.stdout }}. Skipping provisioning."
  when: active_mount.rc == 0

- name: Provision and mount storage
  when: active_mount.rc != 0
  become: true
  block:
    - name: Deploy topology analysis engine
      ansible.builtin.copy:
        dest: /tmp/analyze_storage_topology.py
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          import json, subprocess, sys

          device = sys.argv[1]

          # 1. Enumerate unused partitions
          try:
              lsblk_out = subprocess.check_output(["lsblk", "-J", "-b", "-o", "NAME,TYPE,FSTYPE,MOUNTPOINT,SIZE", device], universal_newlines=True)
              lsblk_data = json.loads(lsblk_out)
          except Exception as e:
              print(json.dumps({"error": f"lsblk failed: {str(e)}"}))
              sys.exit(1)

          unused_parts = []
          for dev in lsblk_data.get("blockdevices", []):
              for child in dev.get("children", []):
                  if child.get("type") == "part" and not child.get("mountpoint"):
                      unused_parts.append({
                          "type": "partition",
                          "name": f"/dev/{child['name']}",
                          "size_bytes": int(child["size"])
                      })

          # 2. Enumerate unallocated gaps using parted
          gaps = []
          try:
              parted_out = subprocess.check_output(["parted", "-s", "-m", device, "unit", "B", "print", "free"], universal_newlines=True, stderr=subprocess.DEVNULL)
              for line in parted_out.splitlines():
                  if "free;" in line:
                      parts = line.split(":")
                      if len(parts) >= 4:
                          size_bytes = int(parts[3].rstrip("B"))
                          # Filter out structural 1MB alignment gaps
                          if size_bytes > 2097152:
                              gaps.append({
                                  "type": "gap",
                                  "name": f"Gap from {parts[1].rstrip('B')}B to {parts[2].rstrip('B')}B",
                                  "size_bytes": size_bytes
                              })
          except Exception:
              pass

          all_opts = unused_parts + gaps
          if not all_opts:
              print(json.dumps({"error": "No unused partitions or usable gaps found."}))
              sys.exit(1)

          # Find the absolute largest available space
          largest = max(all_opts, key=lambda x: x["size_bytes"])

          print(json.dumps({
              "unused_partitions": unused_parts,
              "gaps": gaps,
              "largest": largest
          }))

    - name: Execute topology analysis
      ansible.builtin.command: /tmp/analyze_storage_topology.py "{{ storage_device }}"
      register: topology_raw
      changed_when: false

    - name: Parse topology analysis payload
      ansible.builtin.set_fact:
        topology: "{{ topology_raw.stdout | from_json }}"

    - name: Debug storage topography and selection
      ansible.builtin.debug:
        msg: 
          - "=== UNUSED PARTITIONS FOUND ==="
          - "{{ topology.unused_partitions }}"
          - "=== UNALLOCATED GAPS FOUND ==="
          - "{{ topology.gaps }}"
          - "=== CHOSEN LARGEST OPTION ==="
          - "{{ topology.largest }}"

    - name: Assert the chosen space meets minimum capacity requirements
      ansible.builtin.assert:
        that:
          # Convert minimum_nvme_gb to bytes (1024^3) for exact comparison
          - (topology.largest.size_bytes | int) >= (minimum_nvme_gb | int * 1073741824)
        fail_msg: >
          Validation failed: The largest available space is {{ (topology.largest.size_bytes | int / 1073741824) | round(2) }} GB, 
          which is less than the required minimum of {{ minimum_nvme_gb }} GB.
        success_msg: "Capacity requirements met. Proceeding with provisioning."

    - name: Create new partition in the selected gap
      when: topology.largest.type == 'gap'
      block:
      - name: Relocate GPT backup header to end of disk
        ansible.builtin.command: sgdisk -e {{ storage_device }}
        when: topology.largest.type == 'gap'
        changed_when: false # This is a maintenance fix

      - name: Actually create new partition in the selected gap
        ansible.builtin.shell: |
          set -e
          # sgdisk -N 0 automatically utilizes the largest unallocated space
          sgdisk -N 0 {{ storage_device }} > /dev/null
          partprobe {{ storage_device }}

          # Defensive polling: Wait up to 10 seconds for the kernel to expose the new large partition
          for i in $(seq 1 10); do
            udevadm settle

            # Filter dynamically using the minimum_nvme_gb variable converted to bytes
            NEW_PART=$(lsblk -J -b -o NAME,TYPE,FSTYPE,MOUNTPOINT,SIZE {{ storage_device }} | \
              jq -r --argjson min_bytes "{{ minimum_nvme_gb | int * 1073741824 }}" \
              '.blockdevices[0].children[]? | select(.type == "part" and .fstype == null and .mountpoint == null and .size >= $min_bytes) | "\(.size) \(.name)"' | \
              sort -n | tail -n 1 | awk '{print $2}')

            if [ -n "$NEW_PART" ]; then
              echo "$NEW_PART"
              exit 0
            fi
            sleep 1
          done

          echo "Error: New partition meeting minimum size criteria did not register within the timeout." >&2
          exit 1
        register: newly_created_partition
        changed_when: true

    - name: Set resolved partition path
      ansible.builtin.set_fact:
        resolved_device: "{{ topology.largest.name if topology.largest.type == 'partition' else '/dev/' + newly_created_partition.stdout }}"

    - name: Create XFS filesystem on the resolved partition
      community.general.filesystem:
        fstype: xfs
        dev: "{{ resolved_device }}"
        force: true

    - name: Ensure the mount point directory exists
      ansible.builtin.file:
        path: "{{ nvme_mount }}"
        state: directory
        mode: '0755'

    - name: Mount the partition and persist in fstab
      ansible.builtin.mount:
        path: "{{ nvme_mount }}"
        src: "{{ resolved_device }}"
        fstype: xfs
        state: mounted
        opts: defaults

- name: Get actual controlling user (handling sudo)
  set_fact:
    local_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"

- name: Create per-user directory on mounted storage
  become: true
  file:
    path: "{{ nvme_mount }}/{{ local_user }}"
    state: directory
    owner: "{{ local_user }}"
    mode: '0755'
