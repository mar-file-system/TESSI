
- name: Show selected MPI configuration
  ansible.builtin.debug:
    var: mpi_config

- name: Set up a bunch of MPI path facts 
  ansible.builtin.include_tasks:
    file: "../tasks/discover_mpi.yaml"
  vars:
    mpi: "{{ mpi_config }}"
    target_mpi_module: "{{ mpi_config.module }}"  

- name: Gets IO500 source path specific to this MPI flavor {{ mpi_label }}
  ansible.builtin.include_tasks:
    file: "../tasks/path_to_mpi_specific_src.yaml"
  vars:
    target_mpi_label: "{{ mpi_label }}"   # Inherited from your core set_fact base step
    target_executable: "{{ item.exe }}"
  loop:
    - { exe: 'io500' }

- name: Show selected MPI paths
  ansible.builtin.debug:
    msg: "{{ mpi_config }} {{ mpi_label }} {{ mpi_bin }}"

- name: Show benchmark source paths
  ansible.builtin.debug:
    var: mpi_paths

- name: Require IO500 integration variables
  ansible.builtin.assert:
    that:
      - system.type is defined
    fail_msg: >-
      IO500 requires system.type so it can select the default data mount.

- name: Set io500 path
  ansible.builtin.set_fact:
    io500_path: "{{ mpi_paths.io500 }}"
    io500_config_path: >-
      /tmp/tessi-io500.{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}.{{ mpi_label }}.ini
    io500_stonewall: "{{ (io500 | default({})).stonewall_time | default(300) }}"
    io500_data_dir: >-
      {{ (io500 | default({})).data_root | default('/io500' if system.type == 'daos' and system.access | default('api') == 'api' else '/mnt/' ~ system.type) }}/{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}/io500
    io500_hostfile: "/tmp/hostfile.{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}_io500_mpi_label"

- name: Set the predefined IOR data directories
  ansible.builtin.set_fact:
    io500_ior_data_dirs:
      - "{{ io500_data_dir }}/ior-easy"
      - "{{ io500_data_dir }}/ior-hard"

- name: Ensure predefined IO500 data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    mode: '0755'
  when: not (system.type == 'daos' and system.access | default('api') == 'api')
  loop: "{{ [io500_data_dir] + io500_ior_data_dirs }}"
  loop_control:
    label: "{{ item }}"

- name: Apply configured attributes to IOR data directories
  become: true
  when: not (system.type == 'daos' and system.access | default('api') == 'api')
  ansible.builtin.command:
    argv:
      - setfattr
      - -n
      - "{{ item.1.name }}"
      - -v
      - "{{ item.1.value }}"
      - "{{ item.0 }}"
  loop: >-
    {{ io500_ior_data_dirs
       | product((io500 | default({})).data_directory_xattrs | default([]))
       | list }}
  loop_control:
    label: "{{ item.0 }}: {{ item.1.name }}={{ item.1.value }}"

- name: Create a default io500 config file 
  ansible.builtin.include_tasks: ../tasks/run_with_mpi_module.yaml
  vars:
    mpi_operation_name: "Generate the default IO500 configuration"
    mpi_module: "{{ mpi_config.module }}"
    working_dir: "{{ io500_path }}"
    creates_path: "{{ io500_config_path }}"
    commands: |
      io500 --list > {{ io500_config_path | quote }}

- name: Require physical-core topology facts for every IO500 client
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_processor_count is defined
      - hostvars[item].ansible_processor_cores is defined
      - hostvars[item].ansible_processor_count | int > 0
      - hostvars[item].ansible_processor_cores | int > 0
    fail_msg: >-
      Cannot determine physical-core MPI slots for {{ item }} from gathered facts.
  loop: "{{ groups['clients'] }}"
  loop_control:
    label: "{{ item }}"

- name: Initialize the IO500 client physical-core map
  ansible.builtin.set_fact:
    io500_client_physical_cores: {}

- name: Calculate physical cores for every IO500 client
  ansible.builtin.set_fact:
    io500_client_physical_cores: >-
      {{ io500_client_physical_cores | combine({
           item: (hostvars[item].ansible_processor_count | int)
                 * (hostvars[item].ansible_processor_cores | int)
         }) }}
  loop: "{{ groups['clients'] }}"
  loop_control:
    label: "{{ item }}"

- name: Require a uniform physical-core count for the PPN result label
  ansible.builtin.assert:
    that:
      - io500_client_physical_cores.values() | unique | length == 1
    fail_msg: >-
      IO500 clients have different physical-core counts: {{ io500_client_physical_cores }}.
      A single ppn value cannot describe this run.

- name: Set the requested IO500 processes per client
  ansible.builtin.set_fact:
    io500_ppn: >-
      {{ (io500 | default({})).ppn
         | default(io500_client_physical_cores.values() | first) | int }}

- name: Require a positive IO500 processes-per-node value
  ansible.builtin.assert:
    that:
      - io500_ppn | int > 0
    fail_msg: "io500.ppn must be a positive integer, got {{ io500_ppn }}."

- name: Set the IO500 MPI slot map and total process count
  ansible.builtin.set_fact:
    io500_client_slots: >-
      {{ dict(groups['clients'] | zip([io500_ppn | int] * (groups['clients'] | length))) }}
    io500_num_processes: "{{ (io500_ppn | int) * (groups['clients'] | length) }}"

- name: Initialize the IO500 result name
  ansible.builtin.set_fact:
    num_clients: "{{ groups.get('clients', []) | length }}"
    timestamp: "{{ lookup('pipe', 'date +%s') }}"
    io500_result_name_parts: []

- name: Add inventory group dimensions to the IO500 result name
  ansible.builtin.set_fact:
    io500_result_name_parts: >-
      {{ io500_result_name_parts + [item.key ~ '-' ~ (item.value | length | string)] }}
  loop: "{{ groups | dict2items | sort(attribute='key') }}"
  when:
    - item.key not in ['all', 'ungrouped']
    - item.value | length > 0
    - item.value | sort != groups['all'] | sort
  loop_control:
    label: "{{ item.key }}"

- name: Add PPN to the IO500 result name
  ansible.builtin.set_fact:
    io500_result_name_parts: >-
      {{ io500_result_name_parts + ['ppn-' ~ (io500_ppn | string)] }}

- name: Add configured metadata to the IO500 result name
  ansible.builtin.set_fact:
    io500_result_name_parts: >-
      {{ io500_result_name_parts + [item.key ~ '-' ~ (item.value | string)] }}
  loop: "{{ (io500 | default({})).result_metadata | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Set the timestamped IO500 result directory
  ansible.builtin.set_fact:
    io500_result_dir: >-
      {{ result_dir }}/io500/{{ io500_result_name_parts | join('.') }}.{{ timestamp }}

- name: Ensure {{ io500_result_dir }} exists and is owned by the sudo user
  ansible.builtin.file:
    path: "{{ io500_result_dir }}"
    state: directory
    owner: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    mode: '0755'

- name: Add the predefined data directory and timestamped result directory to the IO500 configuration
  ansible.builtin.set_fact:
    io500_config_updates: >-
      {{
        io500_config_updates + [
          { 'section': 'global', 'option': 'datadir',           'value': io500_data_dir },
          { 'section': 'global', 'option': 'timestamp-datadir', 'value': 'FALSE' },
          { 'section': 'global', 'option': 'resultdir',         'value': io500_result_dir },
          { 'section': 'debug',  'option': 'stonewall-time', 'value': io500_stonewall }
        ]
      }}

- name: Configure direct DAOS IO500 storage and find phases
  ansible.builtin.include_tasks: ../daos/test_cluster/prepare_io500.yaml
  when: system.type == 'daos' and system.access | default('api') == 'api'

- name: Apply granular IO500 configuration overrides
  ansible.builtin.include_tasks: ../tasks/configure_io500.yaml
  vars:
    config_file_path: "{{ io500_config_path }}"

- name: Generate the MPI hostfile from clients inventory using the shared task
  ansible.builtin.include_tasks:
    file: ../tasks/write_mpi_hostfile.yaml  # Adjust this path based on where you save the file
  vars:
    mpi_module: "{{ mpi_config.module }}"
    hosts: "{{ groups['clients'] }}"
    hostfile_path: "{{ io500_hostfile }}"
    slots_by_host: "{{ io500_client_slots }}"

- name: Build IO500 launcher using shared MPI settings
  ansible.builtin.include_tasks: ../tasks/build_mpi_command.yaml
  vars:
    mpi_launcher_module: "{{ mpi_config.module }}"
    mpi_launcher_hostfile: "{{ io500_hostfile }}"

- name: Show the IO500 MPI rank plan
  ansible.builtin.debug:
    msg: >-
      Running {{ io500_num_processes }} MPI ranks across {{ num_clients }} clients
      with {{ io500_ppn }} rank(s) per client
      ({{ io500_client_physical_cores.values() | first }} physical cores per client).

- name: Preserve DAOS per-node stack versions beside IO500 results
  ansible.builtin.copy:
    dest: "{{ io500_result_dir }}/software_versions.json"
    content: >-
      {%- set ns = namespace(versions={}) -%}
      {%- for host in groups['all'] -%}
      {%- set _ = ns.versions.update({host: hostvars[host].benchmark_software_versions.stdout_lines}) -%}
      {%- endfor -%}
      {{ ns.versions | to_nice_json }}
    mode: '0644'
  when: system.type == 'daos'

- name: Run IO500 and finalize DAOS storage when applicable
  block:
    - name: Prepare DAOS container and space diagnostics before IO500
      ansible.builtin.include_tasks: ../daos/test_cluster/start_io500.yaml
      when: system.type == 'daos' and system.access | default('api') == 'api'
    - name: mpirun IO500 - results into {{ io500_result_dir }}
      ansible.builtin.include_tasks: ../tasks/run_with_mpi_module.yaml
      vars:
        mpi_operation_name: "Run IO500 benchmark with {{ io500_num_processes }} MPI ranks ({{ io500_ppn }} per client)"
        mpi_module: "{{ mpi_config.module }}"
        command_timeout: 6000 # fail if it takes too long
        working_dir: "{{ io500_path }}"
        show_output: true
        commands: >
          {{ mpi_launcher_command }} -np {{ io500_num_processes }} {{ mpi_config.mpirun_args | default('') }}
          io500 {{ io500_config_path | quote }}

  always:
    - name: Finalize direct DAOS IO500 and preserve space diagnostics
      ansible.builtin.include_tasks: ../daos/test_cluster/finish_io500.yaml
      when: system.type == 'daos' and system.access | default('api') == 'api'

- name: Read result summary file from {{ io500_result_dir }}
  ansible.builtin.slurp:
    src: "{{ io500_result_dir }}/result_summary.txt"
  register: summary_file

- name: Print result summary
  ansible.builtin.debug:
    var: (summary_file.content | b64decode).splitlines()

- name: Find experiment-level artifacts to preserve with this IO500 result
  ansible.builtin.find:
    paths: "{{ result_dir }}"
    recurse: false
    hidden: true
    file_type: any
  register: experiment_level_artifacts

- name: Preserve experiment-level artifacts in {{ io500_result_dir }}
  vars:
    experiment_artifacts_to_copy: >-
      {{ experiment_level_artifacts.files
         | rejectattr('path', 'equalto', result_dir ~ '/io500')
         | list }}
    experiment_artifact_directories: >-
      {{ experiment_artifacts_to_copy | selectattr('isdir') | list }}
    experiment_artifact_files: >-
      {{ experiment_artifacts_to_copy | rejectattr('isdir') | list }}
  block:
    - name: Create experiment artifact subdirectories in {{ io500_result_dir }}
      ansible.builtin.file:
        path: "{{ io500_result_dir }}/{{ item.path | basename }}"
        state: directory
      loop: "{{ experiment_artifact_directories }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Copy experiment artifact directory contents into {{ io500_result_dir }}
      ansible.builtin.copy:
        src: "{{ item.path }}/"
        dest: "{{ io500_result_dir }}/{{ item.path | basename }}/"
        remote_src: true
        mode: preserve
      loop: "{{ experiment_artifact_directories }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Copy experiment artifact files into {{ io500_result_dir }}
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ io500_result_dir }}/{{ item.path | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ experiment_artifact_files }}"
      loop_control:
        label: "{{ item.path }}"

- name: Save the completed DAOS IO500 run pointer for phase7
  when: system.type == 'daos'
  block:
    - name: Ensure the controller report directory exists
      ansible.builtin.file:
        path: "{{ image_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
    - name: Record the completed IO500 result directory
      ansible.builtin.copy:
        dest: "{{ image_dir }}/io500-last-result-path.txt"
        content: "{{ io500_result_dir }}\n"
        mode: '0644'
      delegate_to: localhost
      become: false
