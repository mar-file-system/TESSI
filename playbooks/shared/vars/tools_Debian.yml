---
dev_tools_package: "build-essential"
dns_utils_package: "dnsutils"
pdsh_ssh_package: "pdsh" # Ubuntu includes rcmd-ssh in the base pdsh package
python_packages:
  - python3
  - python3-dev
  - python3-pip

mpi_implementations:
  - module: openmpi
    mpi_packages: "openmpi-bin libopenmpi-dev"
    env_vars: |
      setenv OMPI_MCA_pml ob1
      setenv OMPI_MCA_btl tcp,self
  - module: mpich
    mpi_packages: "mpich libmpich-dev"
    env_vars: ""
