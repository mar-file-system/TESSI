---
- name: Install required Ansible collections 
  hosts: "{{ target_hosts | default('physical_hosts') }}"
  gather_facts: false
  become: false
  tasks:
    - name: Install required Ansible collections
      ansible.builtin.command: >
        ansible-galaxy collection install {{ item }}
      loop:
        - community.general
        - ansible.posix
        - community.libvirt
        - community.crypto
      delegate_to: localhost
      run_once: true

- name: Refresh SSH known_hosts (Unified Loop)
  hosts: "{{ target_hosts | default('physical_hosts') }}"
  gather_facts: true
  become: true
  
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_remote_tmp: /tmp


  tasks:
    - name: Skip play when running locally or with a single host
      meta: end_play
      when: ansible_play_hosts_all | length <= 1
        
    # ---------------------------------------------------------
    # 1. SETUP: Detect User & Define Targets
    # ---------------------------------------------------------
    - name: Detect the actual connecting user
      set_fact:
        real_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

    - name: Build target file list
      set_fact:
        # We build a list of objects. Each has a path and the owner user.
        target_files: >-
          {{
            [
              {'path': '/root/.ssh/known_hosts', 'owner': 'root'}
            ] +
            (
              [{'path': '/home/' + real_user + '/.ssh/known_hosts', 'owner': real_user}]
              if real_user != 'root' else []
            )
          }}

    - name: Generate known_hosts content (Computed Once)
      set_fact:
        all_inventory_identifiers: >-
          {%- for host in groups['physical_hosts'] -%}
          {{ host }} {{ hostvars[host]['ansible_default_ipv4']['address'] }} 
          {%- endfor -%}
        
        known_hosts_content: |
          {% for host in groups['physical_hosts'] %}
          {% if hostvars[host]['ansible_ssh_host_key_ed25519_public'] is defined %}
          # {{ host }}
          {{ host }},{{ hostvars[host]['ansible_default_ipv4']['address'] }} ssh-ed25519 {{ hostvars[host]['ansible_ssh_host_key_ed25519_public'] }}
          {% endif %}
          {% endfor %}
      run_once: true

    # ---------------------------------------------------------
    # 2. EXECUTE: Single Loop for All Users
    # ---------------------------------------------------------
    - name: Ensure known_hosts files exist
      file:
        path: "{{ item.path }}"
        state: touch
        owner: "{{ item.owner }}"
        mode: '0644'
      become_user: "{{ item.owner }}"  # <--- THE MAGIC SWITCH
      loop: "{{ target_files }}"

    - name: Purge stale keys from files
      shell: |
        for target in {{ all_inventory_identifiers }}; do
          ssh-keygen -R "$target" -f "{{ item.path }}" > /dev/null 2>&1
        done
      become_user: "{{ item.owner }}"  # <--- Executes as 'root' or 'jbent' dynamically
      loop: "{{ target_files }}"
      changed_when: false

    - name: Add cluster keys to files
      blockinfile:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED CLUSTER KEYS"
        block: "{{ known_hosts_content }}"
      become_user: "{{ item.owner }}"
      loop: "{{ target_files }}"

    - name: Cleanup backup files
      file:
        path: "{{ item.path }}.old"
        state: absent
      become_user: "{{ item.owner }}"
      loop: "{{ target_files }}"

- name: Ensure a bunch of TASSI prerequisites across all physical hosts 
  hosts: "{{ target_hosts | default('physical_hosts') }}"
  become: false
  gather_facts: yes

  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=no -o ControlPersist=0"
    ansible_remote_tmp: /tmp
    mpihome: "/usr/lib64/openmpi"
    login_files:
      - ~/.bashrc
      - ~/.bash_profile

  tasks:
    - name: Tasks that need to be run as root 
      block:
      - name: Check if firewalld is active
        command: systemctl is-active firewalld
        register: firewalld_status
        changed_when: false
        failed_when: false

      - block:
        - name: Warn if firewalld is active
          debug:
            msg: "WARNING: firewalld is active and will be disabled."

        - name: Disable and stop firewalld if active
          service:
            name: firewalld
            state: stopped
            enabled: false
        when: firewalld_status.rc == 0

      - name: Check if OpenTofu is already installed
        command: which tofu
        register: tofu_check
        ignore_errors: yes

      - block:
        - name: Download OpenTofu installer script
          get_url:
            url: https://get.opentofu.org/install-opentofu.sh
            dest: /tmp/install-opentofu.sh
            mode: '0755'

        - name: Run OpenTofu installer
          command: ./install-opentofu.sh --install-method rpm
          args:
            chdir: /tmp

        - name: Remove installer script
          file:
            path: /tmp/install-opentofu.sh
            state: absent
        when: tofu_check.rc != 0

      - name: Remove OpenTofu repo file if present
        ansible.builtin.file:
          path: "{{ item }}"
          state: absent
        loop:
          - /etc/yum.repos.d/opentofu.repo
          - /etc/yum.repos.d/tofu.repo
        ignore_errors: true

      - name: Clean yum/dnf cache
        ansible.builtin.command:
          cmd: dnf clean all
        register: clean_result
        changed_when: "'Deleted' in clean_result.stdout or 'removed' in clean_result.stdout"

      - name: Ensure qemu-system-x86_64 is installed and available plus others needed for making reports
        block:
          - name: Check if qemu-system-x86_64 is already present
            command: which qemu-system-x86_64
            register: qemu_check
            ignore_errors: true
            changed_when: false

          - name: Install QEMU if missing
            when: qemu_check.rc != 0
            package:
              name:
                - qemu-kvm
                - qemu-img
                - libvirt
                - virt-install
                - virt-manager
                - enscript
                - ImageMagick
                - python3-img2pdf
                - poppler-utils
                - rsync
                - ghostscript
              state: present

          - name: Ensure qemu-system-x86_64 alias if necessary 
            block:
              - name: Check if /usr/bin/qemu-system-x86_64 exists
                stat:
                  path: /usr/bin/qemu-system-x86_64
                register: qemu_stat

              - name: Create symlink to /usr/libexec/qemu-kvm if missing
                file:
                  src: /usr/libexec/qemu-kvm
                  dest: /usr/bin/qemu-system-x86_64
                  state: link
                when: not qemu_stat.stat.exists

          - name: Verify qemu-system-x86_64 exists after install
            command: which qemu-system-x86_64
            register: qemu_path
            changed_when: false

          - name: Assert that qemu-system-x86_64 is now available
            assert:
              that:
                - qemu_path.rc == 0
              fail_msg: "qemu-system-x86_64 was not found even after installation!"

          - name: Enable and start and configure libvirtd
            block:
            - name: Start libvirtd
              service: 
                name: libvirtd
                state: started
                enabled: yes

            - name: Get username from environment
              set_fact:
                local_user: "{{ lookup('env', 'USER') }}"

            - name: Add user to libvirt group
              ansible.builtin.user:
                name: "{{ local_user }}"
                groups: libvirt
                append: yes

            - name: Install libvirt-nss
              dnf:
                name: libvirt-nss
                state: present

            - name: Ensure 'libvirt' is present in /etc/nsswitch.conf hosts line
              ansible.builtin.lineinfile:
                path: /etc/nsswitch.conf
                regexp: '^(hosts:\s*)(?!.*\blibvirt\b)(.*)$'
                line: '\1\2 libvirt'
                backrefs: true

            - name: Ensure 'libvirt_guest' is present in /etc/nsswitch.conf hosts line
              ansible.builtin.lineinfile:
                path: /etc/nsswitch.conf
                regexp: '^(hosts:\s*)(?!.*\blibvirt_guest\b)(.*)$'
                line: '\1\2 libvirt_guest'
                backrefs: true

            - name: Ensure working libvirt-nss on Rocky Linux 9
              block:
                - name: Add temporary CentOS Stream AppStream repo
                  ansible.builtin.copy:
                    dest: /etc/yum.repos.d/centos-stream-appstream.repo
                    content: |
                      [centos-stream-appstream]
                      name=CentOS Stream 9 AppStream
                      baseurl=https://mirror.stream.centos.org/9-stream/AppStream/x86_64/os/
                      gpgcheck=0
                      enabled=1

                - name: Upgrade libvirt and libvirt-nss from CentOS Stream
                  ansible.builtin.dnf:
                    name:
                      - libvirt
                      - libvirt-daemon
                      - libvirt-libs
                      - libvirt-client
                      - libvirt-nss
                    state: latest
                    enablerepo: centos-stream-appstream
                    allowerasing: true

                - name: Restart libvirtd service
                  ansible.builtin.service:
                    name: libvirtd
                    state: restarted

              when:
                - ansible_distribution == "Rocky"
                - ansible_distribution_major_version == "9"

            - name: Restart libvirtd service
              ansible.builtin.service:
                name: libvirtd
                state: restarted
            when: network.type != 'mvpnet'

          - name: Install Wireguard if necessary 
            when: qemu_check.rc != 0 and network.type == 'wireguard'
            package:
              name:
                - wireguard-tools 
              state: present
        become: true

      - name: Check current sshd LimitMEMLOCK setting
        command: systemctl show sshd.service -p LimitMEMLOCK
        register: memlock_check
        changed_when: false

      - name: Add LimitMEMLOCK=infinity override for sshd
        block:
          - name: Create systemd override directory
            file:
              path: /etc/systemd/system/sshd.service.d
              state: directory
              mode: '0755'

          - name: Add LimitMEMLOCK=infinity override file
            copy:
              dest: /etc/systemd/system/sshd.service.d/override.conf
              content: |
                [Service]
                LimitMEMLOCK=infinity
              owner: root
              group: root
              mode: '0644'

          - name: Reload systemd and restart sshd
            block:
              - name: Reload systemd daemon
                command: systemctl daemon-reexec
              - name: Reload systemd units
                command: systemctl daemon-reload
              - name: Restart sshd
                service:
                  name: sshd
                  state: restarted
        when: "'LimitMEMLOCK=infinity' not in memlock_check.stdout"

    - name: Detect which cluster we are on
      set_fact:
        cluster: >-
          {{ 'intrepid' if ansible_hostname.startswith('in')
             else 'hellscape' if ansible_hostname.startswith('hs')
             else 'unknown' }}

    - name: Run cluster-specific prereqs (intrepid / hellscape)
      include_tasks: prereqs/intrepid_hellscape.yaml
      when: cluster in ['intrepid', 'hellscape']

    - name: Ensure $HOME/bin and {{ mpihome }}/bin are in PATH
      lineinfile:
        path: "{{ item }}"
        insertafter: EOF
        line: 'export PATH="$HOME/bin:{{ mpihome }}/bin:$PATH"'
        state: present
      loop: "{{ login_files }}"

    - name: Check whether mvpnet binaries are in PATH
      shell: |
        which mvpnet && which monwrap 
      register: path_check
      changed_when: false
      failed_when: false

    - name: Optionally force mvpnet refresh
      set_fact:
        force_mvpnet_refresh: true

    - name: Git and build mvpnet if required
      block:
      - name: Set mvpnet directory fact
        set_fact:
          mvpnet_dir: /tmp/mvpnet
          mvpnet_build: /tmp/mvpnet/build

      - name: Ensure {{ mvpnet_dir }} directory doesn't exist 
        file:
          path: "{{ mvpnet_dir }}" 
          state: absent

      - name: Clone mvpnet repository
        git:
          repo: https://github.com/pnfs-storage/mvpnet.git
          dest: "{{ mvpnet_dir }}" 

      - name: Create build directory
        file:
          path: "{{ mvpnet_build }}" 
          state: directory

      - block:
        - name: Configure CMake build
          command: >
            cmake -DCMAKE_INSTALL_PREFIX=$HOME
                   -DCMAKE_PREFIX_PATH={{ mpihome }}
                   ..

        - name: Build mvpnet
          command: make 

        - name: Install mvpnet
          command: make install
        module_defaults:
          command:
            chdir: /tmp/mvpnet/build
      when: path_check.rc != 0 or force_mvpnet_refresh  # force rebuild of mvpnet

    - name: Verify binaries are in PATH
      shell: |
        which mvpnet && which monwrap && which mpirun
      register: path_check
      changed_when: false
      failed_when: path_check.rc != 0

    - name: Display PATH verification results
      debug:
        var: path_check.stdout_lines
