- name: Load OS-specific variables
  include_vars: "{{ ansible_os_family }}.yml"

- name: Install environment-modules
  ansible.builtin.package:
    name: "{{ environment_modules_pkg }}"
    state: present

- name: Ensure modules init is available system-wide
  ansible.builtin.copy:
    dest: /etc/profile.d/modules.sh
    mode: "0755"
    content: |
      #!/bin/bash
      # Check both common paths for Modules init
      for init in /usr/share/Modules/init/bash /usr/share/modules/init/bash; do
        [ -f "$init" ] && source "$init" && break
      done

- name: Set canonical MODULEPATH
  copy:
    dest: /etc/profile.d/modulepath.sh
    mode: "0644"
    content: "export MODULEPATH=/etc/modulefiles:{{ modulefiles_base_path }}:${MODULEPATH}"

- name: Setup libnuma symlink (mvpnet requirement)
  ansible.builtin.file:
    src: "{{ libnuma_path }}"
    dest: "{{ libnuma_dest }}"
    state: link
    force: yes

- name: Ensure cloud-init is installed for schema validation
  ansible.builtin.package:
    name: cloud-init
    state: present

- name: Install QEMU and Virtualization stack
  ansible.builtin.package:
    name: "{{ qemu_pkgs }}"
    state: present

- name: Create qemu-system-x86_64 symlink if necessary
  block:
    - stat:
        path: /usr/bin/qemu-system-x86_64
      register: qemu_stat
    - file:
        src: /usr/libexec/qemu-kvm
        dest: /usr/bin/qemu-system-x86_64
        state: link
      when: 
        - not qemu_stat.stat.exists
        - ansible_os_family == "RedHat"

- name: Configure libvirt NSS in nsswitch.conf
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^(hosts:\s*)(?!.*\b{{ item }}\b)(.*)$'
    line: '\1\2 {{ item }}'
    backrefs: true
  loop: ["libvirt", "libvirt_guest"]

- name: RedHat Specific Virtualization Hacks
  block:
    - name: Ensure working libvirt-nss on Rocky 9
      include_tasks: rocky9_nss_fix.yaml # Move the CentOS repo stuff here
      when: ansible_distribution == "Rocky" and ansible_distribution_major_version == "9"
      
    - name: Install Virtualization Host group
      command: dnf -y groupinstall "Virtualization Host"
      
    - name: Enable modular daemons
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop: [virtqemud, virtnetworkd, virtstoraged]
  when: ansible_os_family == "RedHat"

- name: Ensure libvirtd is started
  service:
    name: libvirtd
    state: started
    enabled: yes

- name: Install Report Generation Tools
  ansible.builtin.package:
    name: "{{ report_tools }}"
    state: present
