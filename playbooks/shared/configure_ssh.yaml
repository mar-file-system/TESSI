# configure_ssh.yaml 
---
- name: Define task marker variable
  set_fact:
    task_marker: "{{ (marker_dir | default('/tmp')) }}/passwordless_ssh.task"

- name: Check if tasks have already been completed via existence of {{ task_marker }} 
  stat:
    path: "{{ task_marker }}"
  register: marker_stat

- name: Configure passwordless ssh across VMs if not already done
  block:
  - name: Remove old SSH key for host from known_hosts
    ansible.builtin.known_hosts:
      path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
      name: "{{ inventory_hostname }}"
      state: absent

  - name: Include wait_ssh task
    include_tasks: wait_ssh.yaml
    when: networking != 'mvpnet' and networking != 'none'

  - name: Gather facts
    setup:
    tags:
      - always

  - name: Determine the target IP based on networking type
    set_fact:
      target_ip: >-
        {%- if networking == 'mvpnet' -%}
          {{ hostvars[inventory_hostname].mvpnet_ip | trim }}
        {%- elif networking == 'none' -%}
          {{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}
        {%- else -%}
          {{ hostvars[inventory_hostname].ansible_host | trim }}
        {%- endif -%}
    when: target_ip is not defined or target_ip | trim == ""

  - name:
    debug:
      var: target_ip

  - name: Collect SSH host key for this host at {{ target_ip }}
    ansible.builtin.shell: |
      ssh-keyscan {{ target_ip }}
    register: ssh_hostkey

  - block:
    - name: Build cluster known_hosts blob (hostname + IP alias)
      ansible.builtin.set_fact:
        known_hosts_blob: |
          {%- for h in ansible_play_hosts %}
          {%- for line in hostvars[h].ssh_hostkey.stdout_lines %}
          {{ h }},{{ line }}
          {% endfor %}
          {%- endfor %}
    - name: Debug known_hosts content
      debug:
        var: known_hosts_blob
    run_once: true
    delegate_to: localhost

  - name: Install cluster known_hosts
    ansible.builtin.copy:
      dest: "{{ ansible_env.HOME }}/.ssh/known_hosts"
      content: "{{ known_hosts_blob }}\n"
      mode: "0644"

  # ---- expensive network / ssh testing (guarded) ----
  - block:
      - name: Ping other nodes (skip, tested in earlier phase)
        ansible.builtin.command: "ping -c 3 {{ item }}"
        loop: "{{ ansible_play_hosts }}"
        when: false and inventory_hostname != item
        ignore_errors: true
        register: ping_result

      - name: Test SSH using ansible ping
        ansible.builtin.ping:
        delegate_to: "{{ item }}"
        loop: "{{ ansible_play_hosts }}"
        when: inventory_hostname != item
        ignore_errors: true
        register: ssh_ping_result

      - name: Test SSH manually (too slow, disable)
        ansible.builtin.shell: >
          ssh -o StrictHostKeyChecking=no
          {{ ansible_user_id }}@{{ item }} echo SSH Success
        loop: "{{ ansible_play_hosts }}"
        when: false and inventory_hostname != item
        ignore_errors: true
        register: ssh_result
    when: ansible_play_hosts | length < 17
    tags: [test]

  # ---- marker ----
  - name: Create task marker file {{ task_marker }}
    ansible.builtin.file:
      path: "{{ task_marker }}"
      state: touch

