---
# 1. Load OS-specific variables first so we know how to handle paths
- name: Load OS-specific variables
  include_vars: "../vars/mpi_{{ ansible_os_family }}.yml"

- name: Set up a bunch of MPI path facts 
  ansible.builtin.include_tasks:
    file: "../tasks/discover_mpi.yaml"
  vars:
    target_mpi_module: "{{ mpi.module }}"  

- name: Diagnostic Log - MPI Bin Evaluation
  ansible.builtin.debug:
    msg:
      - "Target Module: {{ mpi.module }}"
      - "MPI bin: {{ mpi_bin }}"
      - "MPI Label: {{ mpi_label }}"

- name: Set MPI_BIN path and other source paths
  set_fact:
    mpi_bin_path: "{{ mpi_bin }}"

- name: Set the local installation prefix for MPI-specific tools
  ansible.builtin.set_fact:
    mpi_tools_prefix: "{{ ('/usr/lib/x86_64-linux-gnu/' ~ mpi.module) if mpi_bin.startswith('/share/') else (mpi_bin | dirname) }}"

- name: Set local MPI tool paths
  ansible.builtin.set_fact:
    mpi_tools_bin_path: "{{ mpi_tools_prefix }}/bin"
    mpi_tools_lib_path: "{{ mpi_tools_prefix }}/lib"

- name: Display local MPI tool installation paths
  ansible.builtin.debug:
    msg:
      - "MPI commands: {{ mpi_bin_path }}"
      - "MPI-specific tools: {{ mpi_tools_bin_path }}"

- name: Set paths to the source for various packages specific to this MPI flavor 
  ansible.builtin.include_tasks:
    file: "../tasks/path_to_mpi_specific_src.yaml"
  vars:
    target_mpi_label: "{{ mpi_label }}"   # Inherited from your core set_fact base step
    target_executable: "{{ item.exe }}"
  loop:
    - { exe: 'ior' }
    - { exe: 'hello' }
    - { exe: 'io500' }

- name: Set hello path 
  set_fact:
    hello_file_path: "{{ mpi_paths.hello }}/mpi_hello.c"

- name: Ensure MPI packages are installed
  package:
    name: "{{ mpi.mpi_packages.split() }}"
    state: present
  when: mpi.mpi_packages is defined

- name: Ensure source and local MPI tool directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ mpi_paths.ior }}"
    - "{{ mpi_paths.hello }}"
    - "{{ mpi_paths.io500 }}"
    - "{{ mpi_tools_bin_path }}"
    - "{{ mpi_tools_lib_path }}"

- name: Ensure build tools are present
  package:
    name: [git, autoconf, automake, libtool, make, gcc]
    state: present

- name: Check if IOR binary exists
  ansible.builtin.stat:
    path: "{{ mpi_tools_bin_path }}/ior"
  register: ior_binary

- name: Build and install IOR if missing
  when: not ior_binary.stat.exists
  block:
    - name: Clone IOR
      ansible.builtin.git:
        repo: 'https://github.com/hpc/ior'
        dest: "{{ mpi_paths.ior }}"
        version: '54fd197c56dbb7a7706221acbe80198903405456'
        update: false

    - name: Bootstrap IOR
      ansible.builtin.command:
        cmd: ./bootstrap
        chdir: "{{ mpi_paths.ior }}"
        creates: "{{ mpi_paths.ior }}/configure"

    - name: Set IOR install path
      ansible.builtin.set_fact:
        ior_install: "{{ mpi_tools_prefix }}"

    - name: Configure, Build, and Install IOR
      ansible.builtin.include_tasks: ../tasks/run_with_mpi_module.yaml
      vars:
        mpi_module: "{{ mpi.module }}"
        working_dir: "{{ mpi_paths.ior }}"
        creates_path: "{{ mpi_tools_bin_path }}/ior"
        commands: |
          ./configure --prefix={{ ior_install }} {{ ior_config_option | default('') }}
          make clean all install

- name: Create mpi_hello.c
  copy:
    dest: "{{ hello_file_path }}"
    content: |
      #include <mpi.h>
      #include <stdio.h>
      int main(int argc, char** argv)
      {
          MPI_Init(NULL, NULL);
          int world_size;
          MPI_Comm_size(MPI_COMM_WORLD, &world_size);
          int world_rank;
          MPI_Comm_rank(MPI_COMM_WORLD, &world_rank);
          char processor_name[MPI_MAX_PROCESSOR_NAME];
          int name_len;
          MPI_Get_processor_name(processor_name, &name_len);
          printf("Hello world from processor %s, rank %d out of %d processors\n",
                 processor_name, world_rank, world_size);
          MPI_Finalize();
      }

- name: Compile mpi_hello using MPI
  ansible.builtin.include_tasks: ../tasks/run_with_mpi_module.yaml
  vars:
    mpi_module: "{{ mpi.module }}"
    creates_path: "{{ mpi_tools_bin_path }}/mpi_hello"
    commands: |
      mpicc {{ hello_file_path }} -o {{ mpi_tools_bin_path }}/mpi_hello

- name: Check if IO500 binary exists
  ansible.builtin.stat:
    path: "{{ mpi_tools_bin_path }}/io500"
  register: io500_binary

- name: Build and setup IO500 if missing
  when: not io500_binary.stat.exists
  block:
    - name: Ensure IO500 source directory exists
      ansible.builtin.file:
        path: "{{ mpi_paths.io500 }}"
        state: directory
        mode: '0755'

    - name: Check for an existing IO500 build
      ansible.builtin.stat:
        path: "{{ mpi_paths.io500 }}/io500"
      register: io500_source_binary

    - name: Clone IO500 Benchmark Repository when no existing build is available
      ansible.builtin.git:
        repo: 'https://github.com/IO500/io500.git'
        dest: "{{ mpi_paths.io500 }}"
        version: 'main'
        update: false
      when: not io500_source_binary.stat.exists

    - name: Compile IO500
      ansible.builtin.include_tasks: ../tasks/run_with_mpi_module.yaml
      vars:
        mpi_module: "{{ mpi.module }}"
        working_dir: "{{ mpi_paths.io500 }}"
        creates_path: "{{ mpi_paths.io500 }}/io500"
        commands: ./prepare.sh
      when: not io500_source_binary.stat.exists

    - name: Verify IO500 Binary Generation Layout
      ansible.builtin.stat:
        path: "{{ mpi_paths.io500 }}/io500"
      register: io500_bin_check

    - name: Assert IO500 Compilation succeeded
      ansible.builtin.fail:
        msg: "The IO500 binary failed to compile under {{ mpi_paths.io500 }}/io500"
      when: not io500_bin_check.stat.exists

    - name: Install IO500 into the local MPI tool directory
      ansible.builtin.copy:
        src: "{{ mpi_paths.io500 }}/io500"
        dest: "{{ mpi_tools_bin_path }}/io500"
        remote_src: true
        mode: "0755"

    - name: Make IO500 directory world-writable for regular users
      ansible.builtin.file:
        path: "{{ mpi_paths.io500 }}"
        mode: '0777'
        recurse: true

    - name: Deploy a baseline template io500 configuration file
      ansible.builtin.shell: |
        # IO500 comes with an initialization utility to generate baseline test matrix configurations
        ./schema-export.sh io500-default-setup.ini
      args:
        chdir: "{{ mpi_paths.io500 }}"
        creates: "{{ mpi_paths.io500 }}/io500-default-setup.ini"
      when: false
