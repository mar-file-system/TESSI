---
- name: Install {{ mpi_name }} packages
  ansible.builtin.dnf:
    name: "{{ mpi_packages }}"
    state: present

- name: Create {{ mpi_name }} modulefile
  ansible.builtin.copy:
    dest: "{{ modulefile_dir }}/{{ mpi_name }}"
    mode: "0644"
    content: |
      #%Module1.0
      ##
      ## {{ mpi_name | upper }} modulefile
      ##
      proc ModulesHelp { } {
          puts stderr "Loads {{ mpi_name | upper }} MPI environment"
      }

      module-whatis "{{ mpi_name | upper }} MPI implementation"

      set root {{ mpi_prefix }}

      prepend-path PATH            $root/bin
      prepend-path LD_LIBRARY_PATH $root/lib
      prepend-path LD_LIBRARY_PATH $root/lib64
      prepend-path MANPATH         $root/share/man

      setenv MPI_HOME $root
      setenv MPI_BIN  $root/bin
      setenv MPI_LIB  $root/lib64
      setenv MPI_INC  $root/include

