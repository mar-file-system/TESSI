- name: Set OSU build variables for {{ mpi_module }}
  set_fact:
    osu_version: "7.5.2"
    osu_prefix: "/usr/local/osu/{{ mpi_module | regex_replace('/', '_') }}"
    osu_src_dir: "/tmp/osu-micro-benchmarks/{{ mpi_module | regex_replace('/', '_') }}"
    osu_tarball: "osu-micro-benchmarks-7.5.2.tar.gz"
    osu_url: "https://mvapich.cse.ohio-state.edu/download/mvapich/osu-micro-benchmarks-7.5.2.tar.gz"

- name: Set OSU flag used to avoid repeating work 
  set_fact:
    osu_stamp: "{{ osu_prefix }}/.installed"

# ---------------------------------------------------
# Exit early if already installed
# ---------------------------------------------------

- name: Check if OSU already installed
  stat:
    path: "{{ osu_stamp }}"
  register: osu_installed

- name: Skip OSU build because already installed
  debug:
    msg: "OSU already installed for {{ mpi_module }} — skipping."
  when: osu_installed.stat.exists

# Everything below runs only if not installed
- block:

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - environment-modules
          - autoconf
          - automake
          - libtool
          - make
          - gcc
          - gcc-c++
        state: present

    - name: Remove existing build directory for safety
      ansible.builtin.file:
        path: "{{ osu_src_dir }}"
        state: absent

    - name: Create unique build directory
      ansible.builtin.file:
        path: "{{ osu_src_dir }}"
        state: directory
        mode: '0755'

    - name: Download OSU tarball
      ansible.builtin.get_url:
        url: "{{ osu_url }}"
        dest: "/tmp/{{ osu_tarball }}"
        mode: "0644"

    - name: Extract OSU
      ansible.builtin.unarchive:
        src: "/tmp/{{ osu_tarball }}"
        dest: "{{ osu_src_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Build and install OSU
      ansible.builtin.shell: |
        set -e
        source /etc/profile.d/modules.sh
        module load {{ mpi_module }}

        MPICC_PATH=$(which mpicc)
        if [ -z "$MPICC_PATH" ]; then
            echo "ERROR: mpicc not found"
            exit 1
        fi

        MPI_BIN_DIR=$(dirname "$MPICC_PATH")
        MPI_LIB_PATH=$(readlink -f "$MPI_BIN_DIR/../lib")

        [ -f Makefile ] && make distclean

        ./configure CC="$MPICC_PATH" CXX="$(which mpicxx)" \
            LDFLAGS="-Wl,-rpath,${MPI_LIB_PATH}" \
            --prefix="{{ osu_prefix }}"

        make -j
        make install
      args:
        chdir: "{{ osu_src_dir }}"
        executable: /bin/bash

    - name: Create installation stamp file
      ansible.builtin.file:
        path: "{{ osu_stamp }}"
        state: touch

  when: not osu_installed.stat.exists

