- name: Set up modules 
  block:
  - name:
    set_fact:
      mpi_module_root: /etc/modulefiles/mpi
  - name: Install environment-modules
    ansible.builtin.package:
      name: environment-modules
      state: present

  - name: Ensure modules init is available system-wide
    ansible.builtin.copy:
      dest: /etc/profile.d/modules.sh
      mode: "0755"
      content: |
        # Initializing environment-modules for all users
        # Detect path based on distribution
        for init_script in /usr/share/Modules/init/bash /usr/share/modules/init/bash; do
          if [ -f "$init_script" ]; then
            . "$init_script"
            break
          fi
        done

  - name: Set canonical MODULEPATH order
    copy:
      dest: /etc/profile.d/modulepath.sh
      mode: "0644"
      content: |
        export MODULEPATH=/etc/modulefiles:/usr/share/modulefiles:/usr/share/modules/modulefiles${MODULEPATH:+:${MODULEPATH}}

