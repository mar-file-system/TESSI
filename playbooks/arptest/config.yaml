---
- name: Configure Empty Cluster 
  hosts: all
  gather_facts: yes
  strategy: linear # must be linear because servers must finish configuring before clients can start

  tasks:
    - block:
      - name: Include wait_ssh task
        include_tasks: ../shared/wait_ssh.yaml

      - name: Configure ssh
        include_tasks: ../shared/configure_ssh.yaml
      tags: setup
