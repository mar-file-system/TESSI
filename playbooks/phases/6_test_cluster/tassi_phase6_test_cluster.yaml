---
- import_playbook: "../../../{{ user_test_playbook }}"
  vars:
    user_test_playbook: "foo.yml" # give it a default which the auto-generated Makefile will override

- name: Print the directory with the results in it 
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Display experiment results directory
      ansible.builtin.debug:
        msg: "Experiment results are in {{ result_dir }}"

