---
- name: Generate phase7 reports from saved results
  hosts: localhost
  become: false
  gather_facts: true
  vars:
    output_pdf: "{{ image_dir }}/summary.pdf"
    cover_txt: "/tmp/{{ UNIQUE_TAG }}_cover.txt"
    cover_ps: "/tmp/{{ UNIQUE_TAG }}_cover.ps"
    cover_pdf: "/tmp/{{ UNIQUE_TAG }}_cover.pdf"

  tasks:
    - name: Generate the saved performance baseline report
      ansible.builtin.include_tasks: ../../performance/report.yaml
      when: system.type | default('') == 'performance'

    - name: Generate the saved DAOS IO500 report
      ansible.builtin.include_tasks: ../../daos/report/report.yaml
      when: system.type | default('') == 'daos'

    - name: Generate the generic report for other systems
      when: system.type | default('') not in ['performance', 'daos']
      block:
        - name: Ensure required Python and system tools are installed
          package:
            name:
              - enscript
              - ghostscript  # provides ps2pdf
              - ImageMagick  # optional if used for other conversions
              - poppler-utils
            state: present
          when: false # allow this to run as regular user

        - name: Ensure img2pdf is installed
          pip:
            name: img2pdf
            executable: pip3.8
          when: false

        - name: Render text summary file from template
          template:
            src: "templates/report_cover.txt.j2"
            dest: "{{ cover_txt }}"

        - name: Convert text summary to PostScript
          command: enscript -B -f Courier10 -o "{{ cover_ps }}" "{{ cover_txt }}"

        - name: Convert PostScript to PDF
          command: ps2pdf "{{ cover_ps }}" "{{ cover_pdf }}"
        
        - name: Ensure image_dir exists
          ansible.builtin.file:
            path: "{{ image_dir }}"
            state: directory
            mode: "0755"

        - name: Check whether image_dir exists
          ansible.builtin.stat:
            path: "{{ image_dir }}"
          register: image_dir_stat

        - name: Find all PNGs in image_dir
          ansible.builtin.find:
            paths: "{{ image_dir }}"
            patterns: "*.png"
            use_regex: false
            file_type: file
          register: pngs
          when: image_dir_stat.stat.isdir | default(false)

        - name: Build sorted PNG path list
          ansible.builtin.set_fact:
            png_paths: >-
              {{
                (pngs.files | default([]))
                | map(attribute='path')
                | sort
                | list
              }}

        - name: Convert RGBA PNGs to RGB
          ansible.builtin.command:
            argv:
              - convert
              - "{{ item }}"
              - -background
              - white
              - -alpha
              - remove
              - -alpha
              - "off"
              - "{{ item }}"
          loop: "{{ png_paths }}"

        - name: Convert PNGs to single PDF
          ansible.builtin.command:
            argv: "{{ ['img2pdf'] + png_paths + ['-o', '/tmp/images_only.pdf'] }}"
          when: png_paths | length > 0

        - name: Merge cover and image PDFs
          ansible.builtin.command:
            argv:
              - pdfunite
              - "{{ cover_pdf }}"
              - /tmp/images_only.pdf
              - "{{ output_pdf }}"
          when: png_paths | length > 0

        - name: Use cover as output when there are no PNGs
          ansible.builtin.copy:
            src: "{{ cover_pdf }}"
            dest: "{{ output_pdf }}"
            remote_src: true
            mode: preserve
          when: png_paths | length == 0

    - name: Performance manifest path for the DAOS config
      ansible.builtin.debug:
        msg:
          - "Performance manifest: {{ performance_report_manifest }}"
          - "{{ {'performance_manifest': performance_report_manifest} | to_nice_yaml | trim }}"
      when: system.type | default('') == 'performance'
