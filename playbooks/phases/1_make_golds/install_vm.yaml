- name: Debug start of VM installation
  debug:
    msg: "Installing VM {{ item.name }} on {{ inventory_hostname }}"

- block:
    - name: Check for virsh command
      ansible.builtin.command: which virsh
      register: virsh_check
      ignore_errors: true
      changed_when: false

    - name: Check for libvirtd service
      ansible.builtin.shell: systemctl is-active libvirtd
      register: libvirtd_check
      ignore_errors: true
      changed_when: false

    - name: Fail if libvirt not installed or running
      ansible.builtin.fail:
        msg: |
          Libvirt not detected or not running on {{ inventory_hostname }}.
          virsh_check.rc = {{ virsh_check.rc }}
          libvirtd_check.stdout = {{ libvirtd_check.stdout | default('') }}
          Please install and start libvirt:
              sudo dnf install -y libvirt-daemon libvirt-client qemu-kvm
              sudo systemctl enable --now libvirtd
      when:
        - virsh_check.rc != 0
        - libvirtd_check.rc != 0 or libvirtd_check.stdout != 'active'

    - block:
      - name: Ensure default network is active
        command: virsh net-start default
        ignore_errors: true

      - name: Ensure default network autostarts
        command: virsh net-autostart default

      - name: Collect existant VMs
        community.libvirt.virt:
          command: list_vms
        register: all_vms
      become: true

    - name: Set fact if VM {{ item.name }} exists
      set_fact:
        vm_exists: "{{ item.name in all_vms.list_vms }}"
  check_mode: no 

- block:
    - name: Check whether to skip creation if VM {{ item.name }} already exists
      debug:
        msg: "VM {{ item.name }} already exists. Not recreating it. Pass --tags makeclean to force recreation."

    - name: Sleep for 2 seconds if VM creation is skipped
      wait_for:
        timeout: 2
      when: false # disable this. Too much delay. Unnecessary.
  when: vm_exists 

- name: Ensure qemu can traverse ISO directory tree
  file:
    path: "{{ item }}"
    mode: "o+x"
    state: directory
  loop:
    - /proj/mvpnet
    - /proj/mvpnet/images
    - /proj/mvpnet/images/alma
  become: true

- block:
    - name: Set OS-specific flags
      set_fact:
        is_ubuntu: "{{ 'ubuntu' in item.os_variant | lower }}"
        config_ext: "{{ 'yml' if 'ubuntu' in item.os_variant | lower else 'ks' }}"
        template_src: "{{ 'user-data.j2' if 'ubuntu' in item.os_variant | lower else 'kickstart.j2' }}"

    - name: Set proxy fact if environment variable exists
      set_fact:
        instance_proxy: "{{ lookup('env', 'http_proxy') | default(omit, true) }}"

    - name: Create automated install config for VM {{ item.name }}
      template:
        src: "{{ template_src }}"
        dest: "{{ kickstart_dir }}/{{ item.name }}.{{ config_ext }}"
      vars:
        running_user: "{{ lookup('env', 'USER') }}"

    - name: Ensure {{ libvirt_images }} directory exists
      ansible.builtin.file:
        path: "{{ libvirt_images }}"
        state: directory
        mode: '0755'

    - name: Build virt-install command for Ubuntu (Cloud-Init)
      set_fact:
        vm_command: >-
          virt-install
          --name "{{ item.name }}"
          --ram "{{ [item.memory | int, 4096] | max }}"
          --vcpus "{{ item.vcpu }}"
          --os-variant "{{ item.os_variant }}"
          --network network="{{ item.network.default }}"
          --graphics none
          --disk path={{ libvirt_images }}/{{ item.name }}.img,size={{ [item.disk_size | int, 20] | max }}
          --location "{{ item.iso }},kernel=casper/vmlinuz,initrd=casper/initrd"
          --cloud-init user-data={{ kickstart_dir }}/{{ item.name }}.yml
          --noautoconsole
          --wait -1
          --events on_reboot=destroy
          --extra-args "console=ttyS0,115200n8 autoinstall ds=nocloud"
      when: is_ubuntu

    - name: Build virt-install command for Alma/RHEL (Kickstart)
      set_fact:
        vm_command: >-
          virt-install
          --name "{{ item.name }}"
          --ram "{{ item.memory }}"
          --vcpus "{{ item.vcpu }}"
          --os-variant "{{ item.os_variant }}"
          --network network="{{ item.network.default }}"
          --graphics none
          --initrd-inject "{{ kickstart_dir }}/{{ item.name }}.ks"
          --noautoconsole
          --wait 20
          --disk path={{ libvirt_images }}/{{ item.name }}.img,size={{ item.disk_size }}
          --location "{{ item.iso }}"
          --extra-args "inst.text inst.ks=file:/{{ item.name }}.ks console=tty0 console=ttyS0,115200n8"
      when: not is_ubuntu

    - name: Debug command for VM {{ item.name }}
      debug:
        msg: "About to execute: {{ vm_command }}"

    - name: Execute virt-install for VM {{ item.name }}
      command: "{{ vm_command }}"
      timeout: 3600
      register: virt_install_output
      become: true

  when: not vm_exists

- block:
   - name: Create kickstart file for VM {{ item.name }}  
     template:
       src: kickstart.j2
       dest: "{{ kickstart_dir }}/{{ item.name }}.ks"
     vars:
       running_user: "{{ lookup('env', 'USER') }}"

   - debug:
       msg:
         - "SUDO_USER='{{ lookup('env','SUDO_USER') }}'"
         - "USER='{{ lookup('env','USER') }}'"
         - "running_user='{{ running_user | default('UNSET') }}'"

   - name: Debug kickstart file creation
     debug:
       msg: "Created {{ kickstart_dir }}/{{ item.name }}.ks for {{ item.name }}"

   - name: Ensure {{ libvirt_images }} directory exists
     ansible.builtin.file:
       path: "{{ libvirt_images }}"
       state: directory
       mode: '0755'

   - name: Build virt-install command for VM {{ item.name }}
     set_fact:
       vm_command: >-
         virt-install
         --name "{{ item.name }}"
         --ram "{{ item.memory }}"
         --vcpus "{{ item.vcpu }}"
         --os-type linux
         --os-variant "{{ item.os_variant }}"
         --network network="{{ item.network.default }}"
         --graphics none
         --initrd-inject "{{ kickstart_dir }}/{{ item.name }}.ks"
         --noautoconsole
         --wait 20
         --disk path={{ libvirt_images }}/{{ item.name }}.img,size={{ item.disk_size }}
         --location "{{ item.iso }}"
         --extra-args "inst.text inst.ks=file:/{{ item.name }}.ks console=tty0 console=ttyS0,115200n8"

   - name: Debug command for VM {{ item.name }}
     debug:
       msg: "About to execute: {{ vm_command }}"

   - name: Execute virt-install for VM {{ item.name }}
     command: "{{ vm_command }}"
     timeout: 3600
     register: virt_install_output
     become: true

   - debug:
       msg: "Executed command: {{ virt_install_output.cmd }}. Return code: {{ virt_install_output.rc }}"

   - debug:
       msg: "VM {{ item.name }} installation completed with output: {{ virt_install_output.stdout }}"

  when: not vm_exists and false # this is the old way

- name: Ensure VM {{ item.name }} is running
  community.libvirt.virt:
    name: "{{ item.name }}"
    state: running
    uri: qemu:///system
  become: true

- name: Wait for SSH on VM {{ item.name }}
  wait_for:
    host: "{{ item.name }}"
    port: 22
    state: started
    timeout: 300
