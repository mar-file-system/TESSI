- name: Clean and/or Install Empty Gold VM images
  hosts: physical_hosts
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  become: false     # need to be root for just parts of this phase


  tasks:
    - block:
      - name: Distribute work
        include_tasks: distribute_vms_to_hosts.yaml
      tags: always

    - name: Show how many VMs are assigned to each host
      debug:
        msg: "{{ inventory_hostname }} has {{ assigned_vms | length | default(0) }} VMs assigned: {{ assigned_vms | map(attribute='name') | list | default([]) }}"

    - block:    
        - name: makeclean each VM if makeclean was passed
          include_tasks: makeclean.yaml
          with_items: "{{ assigned_vms }}"
          loop_control:
            label: "{{ item.name }}"
      when: "'makeclean' in ansible_run_tags" # don't run unless makeclean was passed
      tags: makeclean

    - name: Show qcow_file for each assigned_vm
      debug:
        msg: "VM {{ item.name }} qcow_file: {{ item.qcow_file }}"
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install each VM from a stock iso (if ENOENT) and ensure they are running
      include_tasks: install_vm.yaml
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"

- name: Add gold VMs to inventory  # new play because free strategy might not work well w/ adding hosts
  hosts: physical_hosts
  gather_facts: no
  become: false
  tasks:
    # Per-host short-circuit: no assigned work? stop this host now.
    - meta: end_host
      when: (assigned_vms | default([])) | length == 0

    - name: Add each VM (that actually needs work) to dynamic inventory
      add_host:
        name: "{{ item.name }}"
        groups: "{{ item.group }},dynamic_hosts"
        ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -q {{ inventory_hostname }}' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: false

    - name: Add each VM to dynamic inventory
      add_host:
        ansible_host: "{{ vm.name }}"
        name: "{{ vm.name }}"
        groups: "{{ vm.group }},dynamic_hosts"
        ssh_keypair: "{{ vm.ssh_keypair }}"
        ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -q {{ hostvars[physical_host].ansible_host }}' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      with_subelements:
        - "{{ vm_assignment | dict2items }}"
        - value
      loop_control:
        label: "{{ vm.name }}"
      vars:
        physical_host: "{{ item.0.key }}"
        vm: "{{ item.1 }}"
      when: vm is defined and true # this is the old way before we started trying to exit early if images already exist. That's not working anymore. Just add them all.

    - name: Show dynamic hosts that were added
      debug:
        var: groups['dynamic_hosts']
      run_once: true
      when: (groups['dynamic_hosts'] | default([])) | length > 0

- name: Debug dynamic host groups
  hosts: "{{ (groups['dynamic_hosts'] | default(['localhost'])) | join(',') }}"
  gather_facts: no
  become: false
  tasks:
    - debug:
        msg: "Host {{ inventory_hostname }} is in groups: {{ group_names }}"
    - debug:
        var: hostvars[inventory_hostname]

- name: Capture proxy from libvirt host
  hosts: "{{ groups['physical_hosts'][0] }}"
  gather_facts: true # must be true to fetch the environment
  tasks:
    - name: Save host proxy values
      set_fact:
        detected_http_proxy: "{{ ansible_env.http_proxy | default(ansible_env.HTTP_PROXY | default('')) }}"
        detected_https_proxy: "{{ ansible_env.https_proxy | default(ansible_env.HTTPS_PROXY | default('')) }}"

- name: Show SSH args for dynamic hosts
  hosts: localhost
  gather_facts: no
  tasks:
    - debug:
        msg: >
          Host {{ item }} →
          ssh_common={{ hostvars[item].ansible_ssh_common_args | default('NONE') }}
      loop: "{{ groups['dynamic_hosts'] | default([]) }}"

- name: Install Custom Software onto the Gold VMs 
  hosts: "{{ groups['dynamic_hosts'] | default([]) }}"
  strategy: free    # allow independent processing for parallel execution
  become: true      # cool to be root in the VMs
  gather_facts: true # needed to identify whether Debian family to know whether to clean up old cloud-init status
  any_errors_fatal: true
  environment:
    http_proxy: "{{ hostvars[groups['physical_hosts'][0]].detected_http_proxy | default('') }}"
    https_proxy: "{{ hostvars[groups['physical_hosts'][0]].detected_https_proxy | default('') }}"
  tasks:
    - name: Persist proxy in /etc/environment
      copy:
        dest: /etc/environment
        content: |
          http_proxy={{ hostvars[groups['physical_hosts'][0]].detected_http_proxy }}
          https_proxy={{ hostvars[groups['physical_hosts'][0]].detected_https_proxy }}
          HTTP_PROXY={{ hostvars[groups['physical_hosts'][0]].detected_http_proxy }}
          HTTPS_PROXY={{ hostvars[groups['physical_hosts'][0]].detected_https_proxy }}
        owner: root
        group: root
        mode: '0644'
      when: hostvars[groups['physical_hosts'][0]].detected_http_proxy != ''

    - name: Set up ssh authorized keys in gold VM
      block:
        - name: Gather minimal user facts (including environment)
          setup:
            gather_subset:
              - '!all'
              - 'env'

        - name: Identify the non-root login user
          set_fact:
            login_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"

        - name: Fail if we are only seeing root
          fail:
            msg: "Could not identify a non-root user. Both SUDO_USER and USER are reported as root."
          when: login_user == 'root'

        - name: Get non-root user home directory
          getent:
            database: passwd
            key: "{{ login_user }}"
          register: user_passwd

        - name: Set home directory variable
          set_fact:
            user_home: "{{ user_passwd.ansible_facts.getent_passwd[login_user][4] }}"

        - name: Deploy SSH key to non-root user and root
          authorized_key:
            user: "{{ item }}"
            state: present
            key: "{{ lookup('file', ssh_keypair + '.pub', errors='strict') }}"
          loop:
            - "{{ login_user }}"
            - root

    - include_tasks: "{{ playbook_dir }}/../../../{{ install_playbook }}"

    - name: Sanitize VM for Gold Image status (Amnesia) - needs to be the last task executed
      ansible.builtin.shell: |
        cloud-init clean --logs
        rm -rf /var/lib/cloud/instance /var/lib/cloud/instances
      async: 60
      poll: 0
      when: ansible_os_family == "Debian"


- name: Save each gold VM to qcow2 
  hosts: physical_hosts
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  become: true
  tasks:
    - meta: end_host
      when: (assigned_vms | default([])) | length == 0

    - name: Debug assigned VMs before including tasks
      debug:
        msg: "Would process VM: {{ item.name }} on {{ inventory_hostname }}"
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: assigned_vms | length > 0

    - name: Debug assigned VMs in the save each gold play
      debug:
        var: assigned_vms

    - include_tasks: vm_to_qcow.yaml
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: assigned_vms | length > 0
