
---
# Play 1: Collect facts from the first physical host
- name: Harvest Dynamic Facts From Target Infrastructure
  hosts: "{{ groups['physical_hosts'][0] }}"
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Verify cluster connectivity and cache system variables
      ansible.builtin.ping:

# Play 2: Update the local compatibility matrix
- name: Compile and Write Local Compatibility Matrix
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    tessi_root: "{{ playbook_dir }}/../../.."
    tessi_compatibility_shared_path: "{{ tessi_root }}/compatibility.yaml"
    tessi_compatibility_matrix_path: "{{ tessi_root }}/compatibility.local.yaml"

  tasks:
    - name: Get latest git commit hash
      ansible.builtin.command:
        cmd: git rev-parse --short HEAD
        chdir: "{{ tessi_root }}"
      register: git_commit
      changed_when: false

    - name: Identify active local user
      ansible.builtin.command: whoami
      register: local_user
      changed_when: false

    - name: Check for shared compatibility matrix
      ansible.builtin.stat:
        path: "{{ tessi_compatibility_shared_path }}"
      register: shared_matrix_file

    - name: Check for local compatibility matrix
      ansible.builtin.stat:
        path: "{{ tessi_compatibility_matrix_path }}"
      register: local_matrix_file

    - name: Read shared compatibility matrix
      ansible.builtin.include_vars:
        file: "{{ tessi_compatibility_shared_path }}"
        name: shared_data
      when: shared_matrix_file.stat.exists

    - name: Read local compatibility matrix
      ansible.builtin.include_vars:
        file: "{{ tessi_compatibility_matrix_path }}"
        name: local_data
      when: local_matrix_file.stat.exists

    - name: Merge shared and local compatibility matrices
      ansible.builtin.set_fact:
        base_matrix_dict: >-
          {{
            (shared_data.compatibility_matrix | default({}))
            | combine(
                local_data.compatibility_matrix | default({})
              )
          }}

    - name: Build new matrix entry from the primary physical host
      ansible.builtin.set_fact:
        new_entries_json: >-
          {% set target_host = groups['physical_hosts'][0] %}
          {% set hvars = hostvars[target_host] %}

          {% set target_system = hvars['system']['type'] %}
          {% set target_config = hvars['config_file'] %}
          {% set target_network = hvars['network']['type'] %}

          {% set current_distro = hvars.ansible_distribution %}
          {% set current_version = hvars.ansible_distribution_major_version %}
          {% set current_kernel = hvars.ansible_kernel %}
          {% set current_arch = hvars.ansible_architecture %}

          {% set compound_key = target_system ~ '.' ~ target_network ~ '.' ~ (current_distro | lower) ~ '.' ~ current_version %}
          {% set node_details = {
            'system': target_system,
            'network': target_network,
            'distro': current_distro,
            'distro_version': current_version,
            'fqdn': hvars.ansible_fqdn | default(target_host),
            'ansible_user': hvars.ansible_user | default(local_user.stdout),
            'kernel': current_kernel,
            'arch': current_arch,
            'config_file': target_config,
            'last_git_commit': git_commit.stdout,
            'recorded_by_user': local_user.stdout,
            'bootstrap_cluster_playbook': bootstrap_cluster | default('NONE'),
            'timestamp': now(fmt='%Y-%m-%d %H:%M:%S')
          } %}

          {{ {compound_key: node_details} | to_json }}

    - name: Merge current experiment into compatibility matrix
      ansible.builtin.set_fact:
        current_matrix: >-
          {{ base_matrix_dict | combine(new_entries_json | from_json) }}

    - name: Generate compatibility matrix content
      ansible.builtin.set_fact:
        matrix_file_content: |
          # AUTOGENERATED. DO NOT EDIT.
          {{ {'compatibility_matrix': current_matrix} | to_nice_yaml(indent=2) }}

    - name: Write local compatibility matrix
      ansible.builtin.copy:
        content: "{{ matrix_file_content }}"
        dest: "{{ tessi_compatibility_matrix_path }}"
        mode: '0644'

    - name: Display experiment results directory
      ansible.builtin.debug:
        msg: "Experiment results are in {{ result_dir }}"

