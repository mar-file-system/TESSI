---
- name: Debug Cluster Parameters Variable Loading
  hosts: mds[0]
  gather_facts: false
  tags: always
  tasks:
    - name: Verify pnfs_params.yml exists on the Ansible Controller
      block:
        - name: Check if the file is reachable via the relative path from {{ playbook_dir }}
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../../vars/pnfs_params.yml"
          register: file_status

        - name: Show file presence and absolute path safely
          ansible.builtin.debug:
            msg:
              - "Does file exist?: {{ file_status.stat.exists }}"
              - "Target path evaluated: {{ playbook_dir }}/../../vars/pnfs_params.yml"
              - "Calculated absolute path: {{ file_status.stat.path | default('FILE NOT FOUND at targeted path') }}"

        - name: Fail early if the file is genuinely missing
          ansible.builtin.fail:
            msg: "CRITICAL: Cannot find pnfs_params.yml at {{ playbook_dir }}/../../vars/pnfs_params.yml"
          when: not file_status.stat.exists

- name: Remove the deployed monolithic pNFS lab
  hosts: mds[0]
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags:
    - never
    - makeclean
  vars_files:
    - ../../vars/pnfs_params.yml
  vars:
    cleanup_inventory_candidates: >-
      {{ ['/tmp/inventory']
         + ([result_dir ~ '/pnfs/inventory'] if result_dir is defined else []) }}

  tasks:
    - name: Check for a generated pnfs-lab inventory
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ cleanup_inventory_candidates }}"
      register: pnfs_lab_inventory_candidates

    - name: Select the pNFS inventory to use for cleanup
      ansible.builtin.set_fact:
        cleanup_inventory_file: >-
          {{ pnfs_lab_inventory_candidates.results
             | selectattr('stat.exists')
             | map(attribute='item')
             | first
             | default('') }}

    - name: Require an inventory that describes the deployed pNFS lab
      ansible.builtin.assert:
        that:
          - cleanup_inventory_file | length > 0
        fail_msg: >-
          Cannot safely clean pNFS because neither /tmp/inventory nor
          the saved result-directory inventory exists.

    - name: Stop services, unmount clients, and remove generated pNFS state
      ansible.builtin.command:
        argv:
          - ./scripts/pnfs-lab
          - --inventory
          - "{{ cleanup_inventory_file }}"
          - --profile
          - multi-mds
          - --confirm-reset
          - reset
        chdir: "{{ lab_source_dir }}"

- name: Setup SSH across the cluster
  hosts: all
  become: true
  vars:
    ssh_setup_marker: "/root/.ssh_setup_complete"

  tasks:
    - name: Check for SSH setup marker
      stat:
        path: "{{ ssh_setup_marker }}"
      register: ssh_marker

    - name: Configure SSH cluster-wide
      block:
        - name: Run SSH configuration tasks
          include_tasks: ../../shared/configure_ssh.yaml

        - name: Refresh cluster facts post-configuration because some variables might have gone out of scope
          setup:

        - name: Create marker file to skip future runs
          file:
            path: "{{ ssh_setup_marker }}"
            state: touch
            owner: root
            mode: '0644'

      # Only execute this block if the marker file does NOT exist
      when: not ssh_marker.stat.exists # or true # always do it because if we added hosts, then everyone must do
      tags: setup

- name: Discover the InfiniBand data-plane address on every pNFS node
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Discover InfiniBand address
      ansible.builtin.include_tasks: ../../tasks/discover_ib_ip.yaml

    - name: Select InfiniBand as the pNFS data-plane address
      ansible.builtin.set_fact:
        target_ip: "{{ infiniband_ip }}"

- name: Remove existing RonDB runtime from all MDS hosts
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../../vars/pnfs_params.yml

  tasks:
    - name: Remove RonDB installation directory
      ansible.builtin.file:
        path: "{{ lab_rondb_base }}"
        state: absent


- name: Use pnfs-lab.env for the multi-mds environment
  hosts: "mds[0]"
  gather_facts: true
  become: false
  vars_files:
    - ../../vars/pnfs_params.yml
  vars:
    env_file: "{{ lab_source_dir }}/scripts/pnfs-lab.env"

  tasks:
    - name: Verify every pNFS node has an InfiniBand data-plane address
      ansible.builtin.assert:
        that:
          - hostvars[item]['infiniband_ip'] is defined
          - hostvars[item]['infiniband_ip'] | trim | length > 0
          - hostvars[item]['infiniband_cidr'] is defined
          - hostvars[item]['infiniband_cidr'] | trim | length > 0
        fail_msg: "No InfiniBand IPv4 address was discovered for {{ item }}"
      loop: "{{ (groups['mds'] + groups['ds'] + groups['clients']) | unique }}"

    - name: Calculate the DS export subnet from the InfiniBand network
      ansible.builtin.set_fact:
        lab_ds_export_subnet: >-
          {{ hostvars[groups['ds'][0]]['infiniband_cidr'] | ansible.utils.ipaddr('subnet') }}

    - name: Calculate the DS export subnet from the InfiniBand network
      ansible.builtin.set_fact:
        lab_ds_transport: "rdma"


    - name: Determine active MDS nodes based on manager colocation
      ansible.builtin.set_fact:
        active_mds_hosts: "{{ groups['mds'][1:] if (not rondb_colocate_mgr | bool) else groups['mds'] }}"
        inventory_file: "/tmp/inventory"

    - name: Determine active RonDB nodes based on manager colocation
      ansible.builtin.set_fact:
        active_rondb_data_hosts: "{{ active_mds_hosts }}"

    - name: Calculate RonDB replica count
      ansible.builtin.set_fact:
        # 2 if total active RonDB data nodes is even, otherwise 1
        lab_profile_multi_rondb_num_replicas: "{{ 2 if (active_rondb_data_hosts | length % 2 == 0) else 1 }}" 

    - name: Render dynamic inventory environment file into {{ inventory_file }}
      ansible.builtin.template:
        src: templates/pnfs-inv.env.j2
        dest: "{{ inventory_file }}"
      when: false

    - name: Create a path for the pnfs spec file 
      ansible.builtin.set_fact:
        spec_file: "/tmp/pnfs-cluster-spec.ini"

    - name: Render simplified pnfs cluster specification
      ansible.builtin.template:
        src: templates/pnfs-cluster-spec.ini.j2
        dest: "{{ spec_file }}" 
        mode: "0644"

    - name: Generate pnfs-lab inventory environment
      ansible.builtin.command:
        argv:
          - ./scripts/pnfs-lab-genenv
          - "{{ spec_file }}"
        chdir: "{{ lab_source_dir }}"
      register: pnfs_lab_genenv
      changed_when: false

    - name: Write generated pnfs-lab inventory into {{ inventory_file }}
      ansible.builtin.copy:
        content: "{{ pnfs_lab_genenv.stdout }}\n"
        dest: "{{ inventory_file }}"
        mode: "0644"

    - name: Save pNFS configuration artifacts
      when: result_dir is defined
      block:
        - name: Create pNFS artifact directory into {{ result_dir }}/pnfs
          ansible.builtin.file:
            path: "{{ result_dir }}/pnfs"
            state: directory
            mode: "0755"

        - name: Copy pNFS configuration files into {{ result_dir }}
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ result_dir }}/pnfs/{{ item.dest }}"
            remote_src: true
            mode: "0644"
          loop:
            - src: "{{ spec_file }}"
              dest: "{{ spec_file | basename }}"
            - src: "{{ inventory_file }}"
              dest: "{{ inventory_file | basename }}"

        - name: Get pNFS git commit
          ansible.builtin.command: git rev-parse HEAD
          args:
            chdir: "{{ lab_source_dir }}"
          register: pnfs_git_commit
          changed_when: false

        - name: Save pNFS git commit
          ansible.builtin.copy:
            content: "{{ pnfs_git_commit.stdout }}\n"
            dest: "{{ result_dir }}/pnfs/git.commit"
            mode: "0644"

    - name: Validate generated inventory shell syntax
      ansible.builtin.command:
        argv:
          - bash
          - -n
          - "{{ inventory_file }}"
      changed_when: false

    - name: Display pnfs-lab generator status
      ansible.builtin.debug:
        msg: |
          Cluster specification: /tmp/pnfs-cluster-spec.ini
          Generated inventory: {{ inventory_file }}
          {{ pnfs_lab_genenv.stderr | default('', true) }}

    - name: Read important generated inventory values
      ansible.builtin.shell:
        cmd: |
          grep -E '^(LAB_USER|LAB_SOURCE_DIR|LAB_BUILD_DIR|LAB_BUILD_HOST_RONDB_BASE|LAB_BUILD_HOST_RONDB_LINK|LAB_REMOTE_RONDB_BASE|LAB_REMOTE_RONDB_LINK|LAB_RONDB_MGM_HOST|LAB_RONDB_MGM_IP|LAB_PROFILE_MULTI_RONDB_NUM_REPLICAS)=' \
            {{ inventory_file | quote }}
      register: pnfs_generated_inventory_summary
      changed_when: false

    - name: Display important generated inventory values
      ansible.builtin.debug:
        var: pnfs_generated_inventory_summary.stdout_lines

    - name: Pause until user hits ENTER before running pnfs-lab from {{ lab_source_dir }}
      ansible.builtin.pause:
        prompt: "Press ENTER to continue play execution or Ctrl+C to abort..."
      when: false
          
          #- { cmd: "--dry-run full-multi", desc: "Preview and sanity-check the inventory" }
    - name: Execute each task in the pnfs-lab deployment pipeline in source directory {{ lab_source_dir }}
      ansible.builtin.include_tasks: pnfs_lab_stage.yaml
      loop:
        - { cmd: "validate",             desc: "Validate profile configuration" }
        - { cmd: "stop",                 desc: "Stop services and unmount lab filesystems" }
        - { cmd: "--confirm-reset reset", desc: "Clear generated lab state" }
        - { cmd: "deps",                 desc: "Install runtime dependencies" }
        - { cmd: "ds",                   desc: "Configure DS exports" }
        - { cmd: "rondb",                desc: "Initialize RonDB: management daemon and data nodes" }
        - { cmd: "build",                desc: "Build pnfs-mds source binaries" }
        - { cmd: "multi-mds",            desc: "Deploy pnfs-mds to active MDS nodes" }
        - { cmd: "client",               desc: "Mount clients at target mount point" }
        - { cmd: "smoke",                desc: "Run smoke validation tests" }
      loop_control:
        loop_var: pnfs_lab_stage
        label: "{{ pnfs_lab_stage.desc }} ({{ pnfs_lab_stage.cmd }})"

- name: Enable NFSD direct I/O on DS nodes, check for RDMA transport
  hosts: ds
  become: true
  gather_facts: false

  tasks:
    - name: Ensure debugfs is mounted
      ansible.posix.mount:
        path: /sys/kernel/debug
        src: debugfs
        fstype: debugfs
        state: mounted

    - name: Ensure NFS server is running
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: started
        enabled: true

    - name: Wait for NFSD direct I/O control to appear
      ansible.builtin.wait_for:
        path: /sys/kernel/debug/nfsd/io_cache_write
        state: present
        timeout: 30

    - name: Read current NFSD write I/O mode
      ansible.builtin.command:
        cmd: cat /sys/kernel/debug/nfsd/io_cache_write
      register: nfsd_io_cache_write
      changed_when: false

    - name: Set NFSD writes to direct I/O with FILE_SYNC
      ansible.builtin.shell:
        cmd: echo 2 > /sys/kernel/debug/nfsd/io_cache_write
      when: nfsd_io_cache_write.stdout | trim != "2"

    - name: Verify NFSD write I/O mode
      ansible.builtin.command:
        cmd: cat /sys/kernel/debug/nfsd/io_cache_write
      register: nfsd_io_cache_write_verify
      changed_when: false
      failed_when: nfsd_io_cache_write_verify.stdout | trim != "2"

    - name: Read NFS server transport listeners
      ansible.builtin.command:
        cmd: cat /proc/fs/nfsd/portlist
      register: nfsd_portlist
      changed_when: false

    - name: Print NFS server transport listeners
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }} /proc/fs/nfsd/portlist:
          {{ nfsd_portlist.stdout }}
