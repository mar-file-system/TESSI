---
- name: "Set pnfs-lab command: {{ pnfs_lab_stage.desc }}"
  ansible.builtin.set_fact:
    pnfs_lab_command: >-
      ./scripts/pnfs-lab
      --inventory {{ inventory_file | quote }}
      --profile multi-mds
      {{ pnfs_lab_stage.cmd }}

- name: "Display pnfs-lab command: {{ pnfs_lab_stage.desc }}"
  ansible.builtin.debug:
    msg: |
      Running from: {{ pnfs_local_src }}
      Command: {{ pnfs_lab_command }}

- name: "Run pnfs-lab stage: {{ pnfs_lab_stage.desc }}"
  ansible.builtin.command:
    cmd: "{{ pnfs_lab_command }}"
    chdir: "{{ pnfs_local_src }}"
  register: pnfs_lab_stage_result

- name: "Display pnfs-lab output: {{ pnfs_lab_stage.desc }}"
  ansible.builtin.debug:
    msg: |
      Stage: {{ pnfs_lab_stage.desc }}
      Command: {{ pnfs_lab_command }}
      Return code: {{ pnfs_lab_stage_result.rc }}
      Standard output:
      {{ pnfs_lab_stage_result.stdout | default('(none)', true) }}

      Standard error:
      {{ pnfs_lab_stage_result.stderr | default('(none)', true) }}
