- name: Ensure beegfs service are stopped 
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ services }}"

- name: Unmount BeeGFS if it’s still mounted
  ansible.builtin.command:
    cmd: umount {{ target_directory }}
  ignore_errors: true
  when: "'clients' in group_names"

- name: Debug the BeeGFS directory path
  ansible.builtin.debug:
    msg: "target_directory={{ target_directory }}"

- name: Remove existing {{ connauthfile }}
  ansible.builtin.file:
    path: "{{ connauthfile }}"
    state: absent

- name: Ensure BeeGFS directories exist
  ansible.builtin.file:
    path: "{{ target_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- block: 
  - name: Create BeeGFS connection auth file on mgmtd 
    ansible.builtin.command:
      cmd: "dd if=/dev/random of={{ connauthfile }} bs=128 count=1"

  - name: Set ownership of connection auth file on mgmtd
    ansible.builtin.command:
      cmd: "chown root:root {{ connauthfile }}"

  - name: Set permissions of connection auth file on mgmtd
    ansible.builtin.command:
      cmd: "chmod 400 {{ connauthfile }}"
  when: inventory_hostname == groups['mservers'][0]

# 1) Decide which address to pull from (mserver0)
- name: Compute target host/port for scp pull
  set_fact:
    target_ip: >-
      {{
        (hostvars[groups['mservers'][0]].mvpnet_ip)
        if (networking | default('')) in ['mvpnet']   
        else (hostvars[groups['mservers'][0]].ansible_host | default(groups['mservers'][0]))
      }}

- name: Show pull plan
  debug:
    msg:
      - "networking={{ networking | default('') }}"
      - "mserver={{ groups['mservers'][0] }}"
      - "target_ip={{ target_ip }}"
      - "connauthfile={{ connauthfile }}"

# 2) Pull the file with scp (runs in parallel on all nodes except the source)
- name: Pull connection auth file from mserver {{ target_ip }} via scp
  become: true                # needed to write {{ connauthfile }} locally
  ansible.builtin.shell: >
    scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ target_ip }}:{{ connauthfile }} {{ connauthfile }}
  when: inventory_hostname != groups['mservers'][0]

- name: Verify connection auth file exists
  ansible.builtin.stat:
    path: "{{ connauthfile }}"
  register: authfile_stat

- name: Fail if connection auth file does not exist
  ansible.builtin.fail:
    msg: "Connection auth file does not exist on {{ inventory_hostname }}"
  when: not authfile_stat.stat.exists

- name: Ensure connAuthFile is set in all configuration files
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^(connAuthFile\s*=\s*).*$'
    line: 'connAuthFile = {{ connauthfile }}'
    create: yes
  loop: "{{ conf_files }}"

- name: Verify connAuthFile parameter in configuration files
  ansible.builtin.shell: |
    grep -v '^#' {{ item }} | grep 'connAuthFile'
  register: config_check
  loop: "{{ conf_files }}"
  failed_when: config_check.stdout.find(connauthfile) == -1

- name: Change logLevel in all configuration files
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^(logLevel\s*=\s*).*$'
    line: "logLevel = {{ loglevel }}"
    create: yes
  loop: "{{ conf_files }}"

- block:
  - name: Check if setup marker exists
    ansible.builtin.stat:
      path: "{{ setup_marker }}"
    register: marker_status

  - name: Print setup marker status
    ansible.builtin.debug:
      msg: "Setup marker file {{ 'exists' if marker_status.stat.exists else 'does NOT exist' }} at {{ setup_marker }}."

  - name: Configure BeeGFS services
    ansible.builtin.command:
      cmd: "{{ setup_command }}"
    args:
      creates: "{{ setup_marker }}"

  - name: Restart and enable BeeGFS services
    ansible.builtin.service:
      name: "{{ item }}"
      enabled: yes
      state: restarted
    loop: "{{ services }}"

  - name: Check status of each service
    ansible.builtin.command: systemctl is-active {{ item }}
    register: service_status
    changed_when: false
    failed_when: service_status.stdout.strip() != "active"
    loop: "{{ services }}"
    ignore_errors: true

  when: inventory_hostname not in groups['clients']
