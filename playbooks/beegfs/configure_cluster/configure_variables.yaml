---
- name: Set target_directory and conf_files for client hosts
  set_fact:
    target_directory: "/mnt/beegfs"
    conf_files: [ "/etc/beegfs/beegfs-client.conf", "/etc/beegfs/beegfs-helperd.conf" ]
    setup_command: "/opt/beegfs/sbin/beegfs-setup-client -m {{ groups['mservers'][0] }}" 
    services: [ "beegfs-helperd", "beegfs-client" ]
  when: inventory_hostname in groups['clients']

- block:
  - name: Set target_directory and conf_files and services for mgmtd 
    set_fact:
      target_directory: "/data/beegfs/mgmtd"
      conf_files: [ "/etc/beegfs/beegfs-mgmtd.conf", "/etc/beegfs/beegfs-helperd.conf" ]
      services: [ "beegfs-mgmtd" ]
  - name: Set setup_command for mgmtd  
    set_fact:
      setup_command: "/opt/beegfs/sbin/beegfs-setup-mgmtd -p {{ target_directory }} -f"
      setup_marker: "{{ target_directory }}/format.conf"
  when: inventory_hostname == groups['mservers'][0]

- block:
  - name: Set target_directory and conf_files and services for non-management mserver hosts
    set_fact:
      target_directory: "/data/beegfs/meta"
      conf_files: [ "/etc/beegfs/beegfs-meta.conf" ]
      services: [ "beegfs-meta" ]
  - name: Set setup_command and marker for non-mgmtd mservers
    set_fact:
      setup_command: >-
        /opt/beegfs/sbin/beegfs-setup-meta -p {{ target_directory }} 
        -s {{ groups['mservers'].index(inventory_hostname) + 1 }}
        -m {{ groups['mservers'][0] }} -f
      setup_marker: "{{ target_directory }}/nodeNumID"
  when: inventory_hostname in groups['mservers'] and inventory_hostname != groups['mservers'][0]

- block:
  - name: Set target_directory and conf_files and services for dserver hosts
    set_fact:
      target_directory: "/data/beegfs/storage"
      conf_files: [ "/etc/beegfs/beegfs-storage.conf" ]
      services: [ "beegfs-storage" ]
  - name: Set setup_command and marker for dservers 
    set_fact:
      setup_command: >-
        /opt/beegfs/sbin/beegfs-setup-storage -p {{ target_directory }} 
        -s {{ (groups['mservers'] | length) + groups['dservers'].index(inventory_hostname) + 1 }}
        -i {{ ((groups['mservers'] | length) + groups['dservers'].index(inventory_hostname) + 1) * 100 + 1 }}
        -m {{ groups['mservers'][0] }} -f
      setup_marker: "{{ target_directory }}/targetNumID"
  when: inventory_hostname in groups['dservers']

- name: Debug BeeGFS configuration variables for this host
  debug:
    msg: >
      Host: {{ inventory_hostname }}
      Target directory: {{ target_directory | default('not set') }}
      Conf files: {{ conf_files | default('not set') }}
      Setup command: {{ setup_command | default('not set') }}
      Setup marker: {{ setup_marker | default('not set') }}
      Services: {{ services | default('not set') }}

