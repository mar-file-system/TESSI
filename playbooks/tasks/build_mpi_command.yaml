---
# Requires mpi_bin from discover_mpi.yaml. Returns both argv (for subprocess)
# and a shell-quoted command (for run_with_mpi_module.yaml). Benchmark-specific
# rank counts, host selection, placement and transport remain caller options.
- name: Build the shared MPI launcher
  ansible.builtin.set_fact:
    mpi_launcher_argv: >-
      {{ [mpi_bin ~ '/mpirun']
         + (['--allow-run-as-root', '--prefix', mpi_bin | dirname,
             '--mca', 'orte_keep_fqdn_hostnames', '1',
             '--mca', 'plm_rsh_args',
             '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null']
            if ('openmpi' in mpi_launcher_module or mpi_launcher_module is search('(^|/)ompi$')) else [])
         + (['-hostfile', mpi_launcher_hostfile] if mpi_launcher_hostfile is defined else [])
         + (mpi_launcher_extra_args | default([])) }}

- name: Quote the shared MPI launcher for shell callers
  ansible.builtin.set_fact:
    mpi_launcher_command: "{{ mpi_launcher_argv | map('quote') | join(' ') }}"
