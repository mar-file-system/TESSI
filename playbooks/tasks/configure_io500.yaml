---
# tasks/configure_io500.yaml

- name: Apply granular IO500 configuration overrides
  ansible.builtin.ini_file:
    path: "{{ config_file_path }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    backup: no # Creates a backup of the original config before the first change
  loop: "{{ io500_config_updates }}"
  loop_control:
    label: "Setting [{{ item.section }}] {{ item.option }} = {{ item.value }}"
