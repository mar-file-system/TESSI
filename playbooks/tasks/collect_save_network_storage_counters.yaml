- name: Print aggregate network and storage statistics
  ansible.builtin.debug:
    msg: "{{ network_storage_stats_report }}"
  when: inventory_hostname == counter_report_host

- name: Save aggregate network and storage statistics to {{ network_storage_stats_path }}
  ansible.builtin.copy:
    dest: "{{ network_storage_stats_path }}"
    content: "{{ network_storage_stats_report }}\n"
    mode: "0644"
  when: inventory_hostname == counter_report_host
