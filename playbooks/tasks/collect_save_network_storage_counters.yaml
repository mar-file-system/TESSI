---
- name: Collect ending counters on storage servers
  when: inventory_hostname in counter_hosts
  block:
    - name: Flush IO500 storage writes before collecting counters
      ansible.builtin.command: sync
      changed_when: false

    - name: Capture ending network and storage counters
      ansible.builtin.shell:
        cmd: "{{ network_storage_snapshot_command }}"
        executable: /bin/bash
      register: network_storage_counter_end_raw
      changed_when: false

    - name: Store ending network and storage counters
      ansible.builtin.set_fact:
        network_storage_counter_end: "{{ network_storage_counter_end_raw.stdout | from_json }}"

    - name: Verify counter sources did not change during IO500
      ansible.builtin.assert:
        that:
          - network_storage_counter_start.boot_id == network_storage_counter_end.boot_id
          - network_storage_counter_start.network_device == network_storage_counter_end.network_device
          - network_storage_counter_start.hca_device == network_storage_counter_end.hca_device
          - network_storage_counter_start.hca_port == network_storage_counter_end.hca_port
          - network_storage_counter_start.storage_device == network_storage_counter_end.storage_device
          - network_storage_counter_start.physical_devices == network_storage_counter_end.physical_devices
        fail_msg: >-
          Counter sources changed on {{ inventory_hostname }} during IO500;
          refusing to calculate invalid deltas.

    - name: Calculate per-host network and storage counter deltas
      ansible.builtin.set_fact:
        network_storage_counter_delta:
          elapsed_ns: >-
            {{ (network_storage_counter_end.timestamp_ns | int) -
               (network_storage_counter_start.timestamp_ns | int) }}
          network_device: "{{ network_storage_counter_end.network_device }}"
          net_rx_bytes: >-
            {{ (network_storage_counter_end.net_rx_bytes | int) -
               (network_storage_counter_start.net_rx_bytes | int) }}
          net_tx_bytes: >-
            {{ (network_storage_counter_end.net_tx_bytes | int) -
               (network_storage_counter_start.net_tx_bytes | int) }}
          ipoib_total_bytes: >-
            {{ ((network_storage_counter_end.net_rx_bytes | int) -
                (network_storage_counter_start.net_rx_bytes | int)) +
               ((network_storage_counter_end.net_tx_bytes | int) -
                (network_storage_counter_start.net_tx_bytes | int)) }}
          net_rx_packets: >-
            {{ (network_storage_counter_end.net_rx_packets | int) -
               (network_storage_counter_start.net_rx_packets | int) }}
          net_tx_packets: >-
            {{ (network_storage_counter_end.net_tx_packets | int) -
               (network_storage_counter_start.net_tx_packets | int) }}
          net_rx_errors: >-
            {{ (network_storage_counter_end.net_rx_errors | int) -
               (network_storage_counter_start.net_rx_errors | int) }}
          net_tx_errors: >-
            {{ (network_storage_counter_end.net_tx_errors | int) -
               (network_storage_counter_start.net_tx_errors | int) }}
          net_rx_dropped: >-
            {{ (network_storage_counter_end.net_rx_dropped | int) -
               (network_storage_counter_start.net_rx_dropped | int) }}
          net_tx_dropped: >-
            {{ (network_storage_counter_end.net_tx_dropped | int) -
               (network_storage_counter_start.net_tx_dropped | int) }}
          hca_device: "{{ network_storage_counter_end.hca_device }}"
          hca_port: "{{ network_storage_counter_end.hca_port }}"
          hca_rx_bytes: >-
            {{ (network_storage_counter_end.hca_rx_bytes | int) -
               (network_storage_counter_start.hca_rx_bytes | int) }}
          hca_tx_bytes: >-
            {{ (network_storage_counter_end.hca_tx_bytes | int) -
               (network_storage_counter_start.hca_tx_bytes | int) }}
          ib_hca_total_bytes: >-
            {{ ((network_storage_counter_end.hca_rx_bytes | int) -
                (network_storage_counter_start.hca_rx_bytes | int)) +
               ((network_storage_counter_end.hca_tx_bytes | int) -
                (network_storage_counter_start.hca_tx_bytes | int)) }}
          hca_rx_packets: >-
            {{ (network_storage_counter_end.hca_rx_packets | int) -
               (network_storage_counter_start.hca_rx_packets | int) }}
          hca_tx_packets: >-
            {{ (network_storage_counter_end.hca_tx_packets | int) -
               (network_storage_counter_start.hca_tx_packets | int) }}
          hca_rx_errors: >-
            {{ (network_storage_counter_end.hca_rx_errors | int) -
               (network_storage_counter_start.hca_rx_errors | int) }}
          hca_tx_discards: >-
            {{ (network_storage_counter_end.hca_tx_discards | int) -
               (network_storage_counter_start.hca_tx_discards | int) }}
          storage_path: "{{ network_storage_counter_end.storage_path }}"
          storage_source: "{{ network_storage_counter_end.storage_source }}"
          storage_fstype: "{{ network_storage_counter_end.storage_fstype }}"
          storage_device: "{{ network_storage_counter_end.storage_device }}"
          physical_devices: "{{ network_storage_counter_end.physical_devices }}"
          storage_read_bytes: >-
            {{ (network_storage_counter_end.storage_read_bytes | int) -
               (network_storage_counter_start.storage_read_bytes | int) }}
          storage_write_bytes: >-
            {{ (network_storage_counter_end.storage_write_bytes | int) -
               (network_storage_counter_start.storage_write_bytes | int) }}
          storage_logical_total_bytes: >-
            {{ ((network_storage_counter_end.storage_read_bytes | int) -
                (network_storage_counter_start.storage_read_bytes | int)) +
               ((network_storage_counter_end.storage_write_bytes | int) -
                (network_storage_counter_start.storage_write_bytes | int)) }}
          storage_reads: >-
            {{ (network_storage_counter_end.storage_reads | int) -
               (network_storage_counter_start.storage_reads | int) }}
          storage_writes: >-
            {{ (network_storage_counter_end.storage_writes | int) -
               (network_storage_counter_start.storage_writes | int) }}
          storage_io_ms: >-
            {{ (network_storage_counter_end.storage_io_ms | int) -
               (network_storage_counter_start.storage_io_ms | int) }}
          storage_weighted_io_ms: >-
            {{ (network_storage_counter_end.storage_weighted_io_ms | int) -
               (network_storage_counter_start.storage_weighted_io_ms | int) }}
          physical_read_bytes: >-
            {{ (network_storage_counter_end.physical_read_bytes | int) -
               (network_storage_counter_start.physical_read_bytes | int) }}
          physical_write_bytes: >-
            {{ (network_storage_counter_end.physical_write_bytes | int) -
               (network_storage_counter_start.physical_write_bytes | int) }}
          storage_physical_total_bytes: >-
            {{ ((network_storage_counter_end.physical_read_bytes | int) -
                (network_storage_counter_start.physical_read_bytes | int)) +
               ((network_storage_counter_end.physical_write_bytes | int) -
                (network_storage_counter_start.physical_write_bytes | int)) }}
          physical_reads: >-
            {{ (network_storage_counter_end.physical_reads | int) -
               (network_storage_counter_start.physical_reads | int) }}
          physical_writes: >-
            {{ (network_storage_counter_end.physical_writes | int) -
               (network_storage_counter_start.physical_writes | int) }}
          physical_io_ms: >-
            {{ (network_storage_counter_end.physical_io_ms | int) -
               (network_storage_counter_start.physical_io_ms | int) }}
          physical_weighted_io_ms: >-
            {{ (network_storage_counter_end.physical_weighted_io_ms | int) -
               (network_storage_counter_start.physical_weighted_io_ms | int) }}
          rpcrdma_tracepoints_available: "{{ network_storage_counter_end.rpcrdma_tracepoints_available }}"
          rpcrdma_tracepoint_definition_count: >-
            {{ network_storage_counter_end.rpcrdma_tracepoint_definition_count }}
          nfsd_portlist: "{{ network_storage_counter_end.nfsd_portlist }}"

    - name: Verify monotonic counters did not decrease
      ansible.builtin.assert:
        that:
          - network_storage_counter_delta.elapsed_ns | int >= 0
          - network_storage_counter_delta.net_rx_bytes | int >= 0
          - network_storage_counter_delta.net_tx_bytes | int >= 0
          - network_storage_counter_delta.hca_rx_bytes | int >= 0
          - network_storage_counter_delta.hca_tx_bytes | int >= 0
          - network_storage_counter_delta.storage_read_bytes | int >= 0
          - network_storage_counter_delta.storage_write_bytes | int >= 0
          - network_storage_counter_delta.physical_read_bytes | int >= 0
          - network_storage_counter_delta.physical_write_bytes | int >= 0
        fail_msg: >-
          One or more counters decreased on {{ inventory_hostname }};
          a counter reset or wrap makes this measurement invalid.

    - name: Reset per-host human-readable byte values
      ansible.builtin.set_fact:
        human_readable_bytes: {}

    - name: Add per-host human-readable byte values
      ansible.builtin.include_tasks: add_human_readable_bytes.yaml
      vars:
        label: "{{ item.label }}"
        bytes: "{{ item.bytes }}"
      loop:
        - { label: ipoib_rx_bytes, bytes: "{{ network_storage_counter_delta.net_rx_bytes }}" }
        - { label: ipoib_tx_bytes, bytes: "{{ network_storage_counter_delta.net_tx_bytes }}" }
        - { label: ipoib_total_bytes, bytes: "{{ network_storage_counter_delta.ipoib_total_bytes }}" }
        - { label: ib_hca_rx_bytes, bytes: "{{ network_storage_counter_delta.hca_rx_bytes }}" }
        - { label: ib_hca_tx_bytes, bytes: "{{ network_storage_counter_delta.hca_tx_bytes }}" }
        - { label: ib_hca_total_bytes, bytes: "{{ network_storage_counter_delta.ib_hca_total_bytes }}" }
        - { label: storage_logical_read_bytes, bytes: "{{ network_storage_counter_delta.storage_read_bytes }}" }
        - { label: storage_logical_write_bytes, bytes: "{{ network_storage_counter_delta.storage_write_bytes }}" }
        - { label: storage_logical_total_bytes, bytes: "{{ network_storage_counter_delta.storage_logical_total_bytes }}" }
        - { label: storage_physical_read_bytes, bytes: "{{ network_storage_counter_delta.physical_read_bytes }}" }
        - { label: storage_physical_write_bytes, bytes: "{{ network_storage_counter_delta.physical_write_bytes }}" }
        - { label: storage_physical_total_bytes, bytes: "{{ network_storage_counter_delta.storage_physical_total_bytes }}" }
      loop_control:
        label: "{{ item.label }}"

    - name: Store per-host human-readable byte values
      ansible.builtin.set_fact:
        network_storage_counter_human: "{{ human_readable_bytes }}"

- name: Initialize aggregate byte counts
  ansible.builtin.set_fact:
    network_storage_aggregate_bytes:
      ipoib_rx_bytes: 0
      ipoib_tx_bytes: 0
      ipoib_total_bytes: 0
      ib_hca_rx_bytes: 0
      ib_hca_tx_bytes: 0
      ib_hca_total_bytes: 0
      storage_logical_read_bytes: 0
      storage_logical_write_bytes: 0
      storage_logical_total_bytes: 0
      storage_physical_read_bytes: 0
      storage_physical_write_bytes: 0
      storage_physical_total_bytes: 0
  when: inventory_hostname == counter_report_host

- name: Sum aggregate byte counts
  ansible.builtin.set_fact:
    network_storage_aggregate_bytes:
      ipoib_rx_bytes: >-
        {{ (network_storage_aggregate_bytes.ipoib_rx_bytes | int) +
           (hostvars[item].network_storage_counter_delta.net_rx_bytes | int) }}
      ipoib_tx_bytes: >-
        {{ (network_storage_aggregate_bytes.ipoib_tx_bytes | int) +
           (hostvars[item].network_storage_counter_delta.net_tx_bytes | int) }}
      ipoib_total_bytes: >-
        {{ (network_storage_aggregate_bytes.ipoib_total_bytes | int) +
           (hostvars[item].network_storage_counter_delta.ipoib_total_bytes | int) }}
      ib_hca_rx_bytes: >-
        {{ (network_storage_aggregate_bytes.ib_hca_rx_bytes | int) +
           (hostvars[item].network_storage_counter_delta.hca_rx_bytes | int) }}
      ib_hca_tx_bytes: >-
        {{ (network_storage_aggregate_bytes.ib_hca_tx_bytes | int) +
           (hostvars[item].network_storage_counter_delta.hca_tx_bytes | int) }}
      ib_hca_total_bytes: >-
        {{ (network_storage_aggregate_bytes.ib_hca_total_bytes | int) +
           (hostvars[item].network_storage_counter_delta.ib_hca_total_bytes | int) }}
      storage_logical_read_bytes: >-
        {{ (network_storage_aggregate_bytes.storage_logical_read_bytes | int) +
           (hostvars[item].network_storage_counter_delta.storage_read_bytes | int) }}
      storage_logical_write_bytes: >-
        {{ (network_storage_aggregate_bytes.storage_logical_write_bytes | int) +
           (hostvars[item].network_storage_counter_delta.storage_write_bytes | int) }}
      storage_logical_total_bytes: >-
        {{ (network_storage_aggregate_bytes.storage_logical_total_bytes | int) +
           (hostvars[item].network_storage_counter_delta.storage_logical_total_bytes | int) }}
      storage_physical_read_bytes: >-
        {{ (network_storage_aggregate_bytes.storage_physical_read_bytes | int) +
           (hostvars[item].network_storage_counter_delta.physical_read_bytes | int) }}
      storage_physical_write_bytes: >-
        {{ (network_storage_aggregate_bytes.storage_physical_write_bytes | int) +
           (hostvars[item].network_storage_counter_delta.physical_write_bytes | int) }}
      storage_physical_total_bytes: >-
        {{ (network_storage_aggregate_bytes.storage_physical_total_bytes | int) +
           (hostvars[item].network_storage_counter_delta.storage_physical_total_bytes | int) }}
  loop: "{{ counter_hosts }}"
  when: inventory_hostname == counter_report_host

- name: Reset aggregate human-readable byte values
  ansible.builtin.set_fact:
    human_readable_bytes: {}
  when: inventory_hostname == counter_report_host

- name: Add aggregate human-readable byte values
  ansible.builtin.include_tasks: add_human_readable_bytes.yaml
  vars:
    label: "{{ item.label }}"
    bytes: "{{ item.bytes }}"
  loop:
    - { label: ipoib_rx_bytes, bytes: "{{ network_storage_aggregate_bytes.ipoib_rx_bytes }}" }
    - { label: ipoib_tx_bytes, bytes: "{{ network_storage_aggregate_bytes.ipoib_tx_bytes }}" }
    - { label: ipoib_total_bytes, bytes: "{{ network_storage_aggregate_bytes.ipoib_total_bytes }}" }
    - { label: ib_hca_rx_bytes, bytes: "{{ network_storage_aggregate_bytes.ib_hca_rx_bytes }}" }
    - { label: ib_hca_tx_bytes, bytes: "{{ network_storage_aggregate_bytes.ib_hca_tx_bytes }}" }
    - { label: ib_hca_total_bytes, bytes: "{{ network_storage_aggregate_bytes.ib_hca_total_bytes }}" }
    - { label: storage_logical_read_bytes, bytes: "{{ network_storage_aggregate_bytes.storage_logical_read_bytes }}" }
    - { label: storage_logical_write_bytes, bytes: "{{ network_storage_aggregate_bytes.storage_logical_write_bytes }}" }
    - { label: storage_logical_total_bytes, bytes: "{{ network_storage_aggregate_bytes.storage_logical_total_bytes }}" }
    - { label: storage_physical_read_bytes, bytes: "{{ network_storage_aggregate_bytes.storage_physical_read_bytes }}" }
    - { label: storage_physical_write_bytes, bytes: "{{ network_storage_aggregate_bytes.storage_physical_write_bytes }}" }
    - { label: storage_physical_total_bytes, bytes: "{{ network_storage_aggregate_bytes.storage_physical_total_bytes }}" }
  loop_control:
    label: "{{ item.label }}"
  when: inventory_hostname == counter_report_host

- name: Store aggregate human-readable byte values
  ansible.builtin.set_fact:
    network_storage_aggregate_human: "{{ human_readable_bytes }}"
  when: inventory_hostname == counter_report_host

- name: Build aggregate network and storage statistics report
  ansible.builtin.set_fact:
    network_storage_stats_report: |-
      TESSI IO500 NETWORK AND STORAGE COUNTERS
      ========================================

      report_host: {{ counter_report_host }}
      measured_hosts: {{ counter_hosts | join(',') }}
      host_count: {{ counter_hosts | length }}
      units: bytes, packets, IO operations, and milliseconds
      note: physical InfiniBand byte counters are converted from four-byte words.
      note: IPoIB counters exclude native verbs traffic; HCA counters include both.

      AGGREGATE: ALL NON-CLIENT HOSTS
      -------------------------------
      {% set t = namespace(net_rx_bytes=0, net_tx_bytes=0,
                           net_rx_packets=0, net_tx_packets=0,
                           net_rx_errors=0, net_tx_errors=0,
                           net_rx_dropped=0, net_tx_dropped=0,
                           hca_rx_bytes=0, hca_tx_bytes=0,
                           hca_rx_packets=0, hca_tx_packets=0,
                           hca_rx_errors=0, hca_tx_discards=0,
                           storage_read_bytes=0, storage_write_bytes=0,
                           storage_reads=0, storage_writes=0,
                           storage_io_ms=0, storage_weighted_io_ms=0,
                           physical_read_bytes=0, physical_write_bytes=0,
                           physical_reads=0, physical_writes=0,
                           physical_io_ms=0, physical_weighted_io_ms=0) %}
      {% for host in counter_hosts %}
      {% set d = hostvars[host].network_storage_counter_delta %}
      {% set t.net_rx_bytes = t.net_rx_bytes + (d.net_rx_bytes | int) %}
      {% set t.net_tx_bytes = t.net_tx_bytes + (d.net_tx_bytes | int) %}
      {% set t.net_rx_packets = t.net_rx_packets + (d.net_rx_packets | int) %}
      {% set t.net_tx_packets = t.net_tx_packets + (d.net_tx_packets | int) %}
      {% set t.net_rx_errors = t.net_rx_errors + (d.net_rx_errors | int) %}
      {% set t.net_tx_errors = t.net_tx_errors + (d.net_tx_errors | int) %}
      {% set t.net_rx_dropped = t.net_rx_dropped + (d.net_rx_dropped | int) %}
      {% set t.net_tx_dropped = t.net_tx_dropped + (d.net_tx_dropped | int) %}
      {% set t.hca_rx_bytes = t.hca_rx_bytes + (d.hca_rx_bytes | int) %}
      {% set t.hca_tx_bytes = t.hca_tx_bytes + (d.hca_tx_bytes | int) %}
      {% set t.hca_rx_packets = t.hca_rx_packets + (d.hca_rx_packets | int) %}
      {% set t.hca_tx_packets = t.hca_tx_packets + (d.hca_tx_packets | int) %}
      {% set t.hca_rx_errors = t.hca_rx_errors + (d.hca_rx_errors | int) %}
      {% set t.hca_tx_discards = t.hca_tx_discards + (d.hca_tx_discards | int) %}
      {% set t.storage_read_bytes = t.storage_read_bytes + (d.storage_read_bytes | int) %}
      {% set t.storage_write_bytes = t.storage_write_bytes + (d.storage_write_bytes | int) %}
      {% set t.storage_reads = t.storage_reads + (d.storage_reads | int) %}
      {% set t.storage_writes = t.storage_writes + (d.storage_writes | int) %}
      {% set t.storage_io_ms = t.storage_io_ms + (d.storage_io_ms | int) %}
      {% set t.storage_weighted_io_ms = t.storage_weighted_io_ms + (d.storage_weighted_io_ms | int) %}
      {% set t.physical_read_bytes = t.physical_read_bytes + (d.physical_read_bytes | int) %}
      {% set t.physical_write_bytes = t.physical_write_bytes + (d.physical_write_bytes | int) %}
      {% set t.physical_reads = t.physical_reads + (d.physical_reads | int) %}
      {% set t.physical_writes = t.physical_writes + (d.physical_writes | int) %}
      {% set t.physical_io_ms = t.physical_io_ms + (d.physical_io_ms | int) %}
      {% set t.physical_weighted_io_ms = t.physical_weighted_io_ms + (d.physical_weighted_io_ms | int) %}
      {% endfor %}
      ipoib_rx_bytes: {{ t.net_rx_bytes }}
      ipoib_rx_bytes_human: {{ network_storage_aggregate_human.ipoib_rx_bytes_human }}
      ipoib_tx_bytes: {{ t.net_tx_bytes }}
      ipoib_tx_bytes_human: {{ network_storage_aggregate_human.ipoib_tx_bytes_human }}
      ipoib_total_bytes: {{ network_storage_aggregate_bytes.ipoib_total_bytes }}
      ipoib_total_bytes_human: {{ network_storage_aggregate_human.ipoib_total_bytes_human }}
      ipoib_rx_packets: {{ t.net_rx_packets }}
      ipoib_tx_packets: {{ t.net_tx_packets }}
      ipoib_rx_errors: {{ t.net_rx_errors }}
      ipoib_tx_errors: {{ t.net_tx_errors }}
      ipoib_rx_dropped: {{ t.net_rx_dropped }}
      ipoib_tx_dropped: {{ t.net_tx_dropped }}
      ib_hca_rx_bytes: {{ t.hca_rx_bytes }}
      ib_hca_rx_bytes_human: {{ network_storage_aggregate_human.ib_hca_rx_bytes_human }}
      ib_hca_tx_bytes: {{ t.hca_tx_bytes }}
      ib_hca_tx_bytes_human: {{ network_storage_aggregate_human.ib_hca_tx_bytes_human }}
      ib_hca_total_bytes: {{ network_storage_aggregate_bytes.ib_hca_total_bytes }}
      ib_hca_total_bytes_human: {{ network_storage_aggregate_human.ib_hca_total_bytes_human }}
      ib_hca_rx_packets: {{ t.hca_rx_packets }}
      ib_hca_tx_packets: {{ t.hca_tx_packets }}
      ib_hca_rx_errors: {{ t.hca_rx_errors }}
      ib_hca_tx_discards: {{ t.hca_tx_discards }}
      storage_logical_read_bytes: {{ t.storage_read_bytes }}
      storage_logical_read_bytes_human: {{ network_storage_aggregate_human.storage_logical_read_bytes_human }}
      storage_logical_write_bytes: {{ t.storage_write_bytes }}
      storage_logical_write_bytes_human: {{ network_storage_aggregate_human.storage_logical_write_bytes_human }}
      storage_logical_total_bytes: {{ network_storage_aggregate_bytes.storage_logical_total_bytes }}
      storage_logical_total_bytes_human: {{ network_storage_aggregate_human.storage_logical_total_bytes_human }}
      storage_logical_reads: {{ t.storage_reads }}
      storage_logical_writes: {{ t.storage_writes }}
      storage_logical_io_ms: {{ t.storage_io_ms }}
      storage_logical_weighted_io_ms: {{ t.storage_weighted_io_ms }}
      storage_physical_read_bytes: {{ t.physical_read_bytes }}
      storage_physical_read_bytes_human: {{ network_storage_aggregate_human.storage_physical_read_bytes_human }}
      storage_physical_write_bytes: {{ t.physical_write_bytes }}
      storage_physical_write_bytes_human: {{ network_storage_aggregate_human.storage_physical_write_bytes_human }}
      storage_physical_total_bytes: {{ network_storage_aggregate_bytes.storage_physical_total_bytes }}
      storage_physical_total_bytes_human: {{ network_storage_aggregate_human.storage_physical_total_bytes_human }}
      storage_physical_reads: {{ t.physical_reads }}
      storage_physical_writes: {{ t.physical_writes }}
      storage_physical_io_ms: {{ t.physical_io_ms }}
      storage_physical_weighted_io_ms: {{ t.physical_weighted_io_ms }}

      PER-HOST DELTAS
      ---------------
      {% for host in counter_hosts %}
      {% set d = hostvars[host].network_storage_counter_delta %}
      {{ host }}:
        groups: {{ group_names | default([]) | join(',') if host == inventory_hostname else
                    (hostvars[host].group_names | default([]) | join(',')) }}
        elapsed_seconds: {{ '%.6f' | format((d.elapsed_ns | float) / 1000000000) }}
        network_device: {{ d.network_device }}
        ipoib_rx_bytes: {{ d.net_rx_bytes }}
        ipoib_rx_bytes_human: {{ hostvars[host].network_storage_counter_human.ipoib_rx_bytes_human }}
        ipoib_tx_bytes: {{ d.net_tx_bytes }}
        ipoib_tx_bytes_human: {{ hostvars[host].network_storage_counter_human.ipoib_tx_bytes_human }}
        ipoib_total_bytes: {{ d.ipoib_total_bytes }}
        ipoib_total_bytes_human: {{ hostvars[host].network_storage_counter_human.ipoib_total_bytes_human }}
        ipoib_rx_packets: {{ d.net_rx_packets }}
        ipoib_tx_packets: {{ d.net_tx_packets }}
        ipoib_rx_errors: {{ d.net_rx_errors }}
        ipoib_tx_errors: {{ d.net_tx_errors }}
        ipoib_rx_dropped: {{ d.net_rx_dropped }}
        ipoib_tx_dropped: {{ d.net_tx_dropped }}
        hca: {{ d.hca_device }}/{{ d.hca_port }}
