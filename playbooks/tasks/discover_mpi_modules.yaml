---
- name: Build list of MPI modules supported by this operating system
  ansible.builtin.set_fact:
    configured_mpi_modules: >-
      {{
        (mpi_implementations | map(attribute='module') | list)
        +
        (existing_mpi_implementations | default([])
         | map(attribute='path')
         | map('regex_replace', '^/share/', 'mpi/')
         | list)
      }}

- name: Query available MPI modules
  ansible.builtin.shell: |
    source /etc/profile.d/modules.sh
    export MODULEPATH=/etc/modulefiles:/usr/share/modulefiles:/usr/share/modules/modulefiles${MODULEPATH:+:${MODULEPATH}}
    module -t avail mpi 2>&1
  args:
    executable: /bin/bash
  register: mpi_module_availability
  changed_when: false

- name: Build list of available MPI modules
  ansible.builtin.set_fact:
    available_mpi_modules: >-
      {{
        mpi_module_availability.stdout_lines
        | map('trim')
        | select('match', '^mpi/.+')
        | map('regex_replace', '\\(default\\)$', '')
        | select('in', configured_mpi_modules)
        | unique
        | sort
        | list
      }}

- name: Display available MPI modules
  ansible.builtin.debug:
    var: available_mpi_modules
