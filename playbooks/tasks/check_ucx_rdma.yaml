---
# An active IPoIB interface alone does not mean UCX has its RDMA plugin.
- name: Query available UCX transports without running network traffic
  ansible.builtin.command: ucx_info -d
  register: ucx_rdma_info
  changed_when: false

- name: Require a UCX reliable-connected InfiniBand transport
  ansible.builtin.assert:
    that:
      - >-
        ucx_rdma_info.stdout is search('(?m)^[ \t]*#[ \t]*Transport:[ \t]+rc(?:_[^ \t\r\n]+)?[ \t]*$')
    fail_msg: >-
      UCX cannot provide the rc transport required by this benchmark on
      {{ inventory_hostname }}. On distro UCX, run phase1 to install ucx-ib;
      with DOCA, check the matching UCX RDMA plugins. Verify ucx_info -d lists
      rc_mlx5 or rc_verbs before retrying phase6. Available transports:
      {{ ucx_rdma_info.stdout_lines | select('search', 'Transport:') | list }}
