---
- name: Install MPI packages for {{ mpi.module }}
  ansible.builtin.package:
    name: "{{ mpi.mpi_packages.split() }}"
    state: present

# -------------------------------------------------------------------
# DYNAMIC PATH DISCOVERY & CLEAN ISOLATION SILOS
# -------------------------------------------------------------------

# Alma/RedHat naturally isolates binaries. Debian/Ubuntu dumps them into /usr/bin.
# For RedHat, we query the path. For Debian, we skip query and generate a clean silo path.
- name: Determine MPI bin path dynamically (RedHat family)
  ansible.builtin.shell: |
    rpm -ql {{ mpi.mpi_packages.split() | first }} | grep '/bin/' | head -n 1 | xargs -r dirname
  register: redhat_mpi_bin
  changed_when: false
  when: ansible_os_family != "Debian"

- name: Link all the MPI binaries into a new directory that the module file will prepend to PATH
  when: ansible_os_family == "Debian"
  block:
  - name: Create isolated execution paths for modules (Debian family)
    ansible.builtin.file:
      path: "/usr/lib/x86_64-linux-gnu/{{ mpi.module }}/bin"
      state: directory
      mode: "0755"

  - name: Find all binaries installed by the execution package (Debian family)
    ansible.builtin.shell: |
      dpkg -L {{ mpi.mpi_packages.split() | first }} | grep -E '^/usr/bin/'
    register: mpich_binaries
    changed_when: false

  - name: Link all package binaries to isolated directory (Debian family)
    ansible.builtin.file:
      src: "{{ item }}"
      # Extracts just the generic name (e.g., converts /usr/bin/hydra_pmi_proxy.mpich to hydra_pmi_proxy)
      dest: "/usr/lib/x86_64-linux-gnu/{{ mpi.module }}/bin/{{ item | basename | replace('.' ~ ((mpi.module | basename) | replace('-x86_64', '')), '') }}"
      state: link
    loop: "{{ mpich_binaries.stdout_lines | default([]) }}"

- name: Consolidate final canonical bin path
  ansible.builtin.set_fact:
    final_mpi_bin: "{{ (ansible_os_family == 'Debian') | ternary('/usr/lib/x86_64-linux-gnu/' ~ mpi.module ~ '/bin', redhat_mpi_bin.stdout | default('')) }}"

- name: Determine MPI lib paths dynamically
  ansible.builtin.shell: |
    if [ "{{ ansible_os_family }}" = "Debian" ]; then
      dpkg -L {{ mpi.mpi_packages.split() | last }} | grep -E 'libmpi\.so|libmpich\.so' | head -n 1 | xargs -r dirname
    else
      rpm -ql {{ mpi.mpi_packages.split() | last }} | grep -E 'libmpi\.so|libmpich\.so' | head -n 1 | xargs -r dirname
    fi
  register: found_mpi_lib
  changed_when: false

- name: Verify discovered paths via debug loop
  ansible.builtin.debug:
    msg: 
      - "OS Family: {{ ansible_os_family }}"
      - "Target MPI Module: {{ mpi.module }}"
      - "Determined BIN Path: {{ final_mpi_bin }}"
      - "Determined LIB Path: {{ found_mpi_lib.stdout }}"

- name: Install modulefile for {{ mpi.module }}
  ansible.builtin.include_tasks: install_module.yaml
  vars:
    module_name: "{{ mpi.module }}"
    module_bin_path: "{{ final_mpi_bin }}"
    module_lib_path: "{{ found_mpi_lib.stdout }}"
    module_env_vars: "{{ mpi.env_vars | default([]) }}"
