---
# Shared saved provenance for performance, DAOS and pNFS adapters.
# Phase6 callers may disable fact gathering; detect the package database locally.
- name: Record benchmark software stack versions
  ansible.builtin.shell: |
    if [ -f /etc/redhat-release ] && command -v rpm >/dev/null 2>&1; then
      rpm -qa | sort | grep -Ei '^(kernel|doca|openmpi|ucx|libibverbs|rdma-core|mlnx|daos|mercury|libfabric)' || true
    elif command -v dpkg-query >/dev/null 2>&1; then
      dpkg-query -W -f='${binary:Package} ${Version}\n' | sort | grep -Ei '^(linux-image|doca|openmpi|libopenmpi|ucx|libucx|libibverbs|ibverbs|rdma-core|mlnx|daos|mercury|libfabric)' || true
    fi
    /usr/local/bin/fio --version 2>/dev/null || true
  register: benchmark_software_versions
  changed_when: false
