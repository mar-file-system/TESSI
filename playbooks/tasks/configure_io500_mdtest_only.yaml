---
# Shared diagnostic workload: enable mdtest and disable other IO500 phases.
- name: Run only mdtest phases for IO500
  ansible.builtin.set_fact:
    io500_config_updates: >-
      {{ io500_config_updates + [
        {'section': item, 'option': 'run', 'value': 'TRUE' if item.startswith('mdtest-') else 'FALSE'}
      ] }}
  loop:
    - mdtest-easy
    - mdtest-easy-write
    - mdtest-easy-stat
    - mdtest-easy-delete
    - mdtest-hard
    - mdtest-hard-write
    - mdtest-hard-read
    - mdtest-hard-stat
    - mdtest-hard-delete
    - ior-easy
    - ior-easy-write
    - ior-easy-read
    - ior-rnd4K-easy-read
    - ior-hard
    - ior-hard-write
    - ior-hard-read
    - find
    - find-easy
    - find-hard
    - mdworkbench
    - mdworkbench-create
    - mdworkbench-bench
    - mdworkbench-delete

