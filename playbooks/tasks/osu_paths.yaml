---
# Shared by the OSU installer and benchmark runners.
- name: Resolve the OSU installation for this MPI module
  ansible.builtin.set_fact:
    osu_install_prefix: "/usr/local/osu/{{ osu_mpi_module | replace('/', '_') }}"
- name: Resolve the OSU executable directory
  ansible.builtin.set_fact:
    osu_binary_dir: "{{ osu_install_prefix }}/libexec/osu-micro-benchmarks"
