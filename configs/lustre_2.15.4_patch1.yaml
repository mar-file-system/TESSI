all:

  vars:

    # define a tag for this system to avoid cache collisions (e.g. on the gold VM images)
    UNIQUE_TAG: "l2154p1"

    # define paths to user-custom playbooks used in the 'install gold VMs' phase and the 'configure cluster' phase 
    playbooks:
      gold_install: "/home/jbent/tassi/playbooks/lustre/install_golds/install_lustre_all.yaml"  
      cluster_config: "/home/jbent/tassi/playbooks/lustre/configure_cluster/configure_lustre_all.yaml"
      cluster_test: "/home/jbent/tassi/playbooks/lustre/test_cluster/test_lustre.yaml"

    # The different types of groups that VMs can have in this system.
    # These will become ansible groups in the auto-generated inventories 
    # subsequently used with your user-custom playbooks. 
    vm_groups:
      cli_group: "clients"
      mds_group: "mds"
      oss_group: "oss"

    # define where images are stored
    image_storage:
      qcow: "/mnt/usrc-storage-nfs/jbent/images"
      libvirt: "/var/lib/libvirt/images"

    # define the networking
    network:
      wireguard: 
        base_ip: "192.68.10"
        cidr: 24
      libvirt:
        base_ip: "192.68.11"
        cidr: 28
        default: "default"

    # define what the gold VMs look like
    # note that you need to define an individual gold vm for each of your vm_groups
    gold_vms:
      defaults: # each default value can be overwritten in the individual entries
        iso: "/mnt/usrc-storage-nfs/jbent/images/alma/AlmaLinux-8.10-x86_64-minimal.iso"
        machine: "pc-q35-rhel8.2.0"
        memory: 2048
        network:
          bootproto: "dhcp"
          default: "{{ network.libvirt.default }}" 
          device: "enp1s0"
          ipv6: "noipv6"
          ntpservers:
            - "0.pool.ntp.org"
            - "1.pool.ntp.org"
            - "2.pool.ntp.org"
            - "3.pool.ntp.org"
          onboot: "yes"
        os_variant: "almalinux8"
        root_pwd: "password"
        ssh_keys: '/home/jbent/.ssh/authorized_keys'
        system:
          type: 'lustre'
          version: '2.15.4'
        timezone: "US/Mountain"
        vcpu: 1
      individual:
        - name: "gold-{{ UNIQUE_TAG }}-{{ vm_groups.oss_group }}"
          disk_size: 12
          group: "{{ vm_groups.oss_group }}"
          vcpu: 2
        - name: "gold-{{ UNIQUE_TAG }}-{{ vm_groups.mds_group }}"
          disk_size: 12
          group: "{{ vm_groups.mds_group }}"
          vcpu: 2
        - name: "gold-{{ UNIQUE_TAG }}-{{ vm_groups.cli_group }}"
          disk_size: 12
          group: "{{ vm_groups.cli_group }}"
          memory: 1024
  
  # specify the lists of physical hosts across which the VMs will run
  # and the VMs which will run on each
  # VM tuple is: [ name, ansible_group, hdd1_gbs, hdd2_gbs, ip_last_octet ]
  hosts:
    in07:
      wireguard_suffix: "7"
      libvirt_suffix: "0" 
      vms:
      # - [ NAME,            ROLE,                   HDD1, HDD2, IP_LAST_OCTET ]
        - [ lustre-cli00, "{{ vm_groups.cli_group }}",   5,  0,  2 ]
        - [ lustre-cli01, "{{ vm_groups.cli_group }}",   5,  0,  3 ]
        - [ lustre-oss00, "{{ vm_groups.oss_group }}",  10, 10,  4 ]
        - [ lustre-cli05, "{{ vm_groups.cli_group }}",   5,  0,  5 ]
    in13:
      wireguard_suffix: "13"
      libvirt_suffix: "16" 
      vms:
        - [ lustre-cli02, "{{ vm_groups.cli_group }}",  5,  0, 18 ]
        - [ lustre-oss01, "{{ vm_groups.oss_group }}", 10, 10, 19 ]
        - [ lustre-oss02, "{{ vm_groups.oss_group }}", 10, 10, 20 ]
        - [ lustre-cli04, "{{ vm_groups.cli_group }}",  5,  0, 21 ]
    in15:
      wireguard_suffix: "15"
      libvirt_suffix: "32" 
      vms:
        - [ lustre-oss04, "{{ vm_groups.oss_group }}", 10, 10, 34 ]
        - [ lustre-mds02, "{{ vm_groups.mds_group }}", 10,  5, 35 ]
        - [ lustre-cli07, "{{ vm_groups.cli_group }}",  5,  0, 36 ]
        - [ lustre-cli08, "{{ vm_groups.cli_group }}",  5,  0, 37 ]
    in16:
      wireguard_suffix: "16"
      libvirt_suffix: "48" 
      vms:
       - [ lustre-oss03, "{{ vm_groups.oss_group }}", 10, 10, 50 ]
       - [ lustre-mds00, "{{ vm_groups.mds_group }}", 10,  5, 51 ]
       - [ lustre-mds01, "{{ vm_groups.mds_group }}", 10,  5, 52 ]
       - [ lustre-cli03, "{{ vm_groups.cli_group }}",  5,  0, 53 ]
