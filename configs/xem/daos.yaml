---
# DAOS on Rocky Linux 9.7
all:
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    current_user: "{{ lookup('env', 'USER') }}"
    host_domain: "daos-{{ current_user }}.mvpnet"
    result_dir: "/proj/mvpnet/{{ current_user }}/experiments/daos_api"
    # Pinned baseline from this allocation; retained for the phase7 comparison.
    performance_manifest: "/proj/mvpnet/jbent/experiments/performance/5.14.0-611.55.1.el9_7.x86_64-Rocky-9.7-4-clients-4-ds-8-physical_hosts/20261101T134709-p6tjCe/manifest.json"

    network:
      type: 'none'

    output_dir: "/tmp/{{ current_user }}/experiments"

    playbooks:
      bootstrap_cluster: "./playbooks/shared/prereqs.yaml"
      gold_install: "./playbooks/daos/install_golds/install_daos.yaml"
      cluster_config: "./playbooks/daos/configure_cluster/configure_daos.yaml"
        #cluster_test: "./playbooks/daos/test_cluster/test_daos_api.yaml"
      cluster_test: "./playbooks/shared/io500_tester.yaml" # this one is optional


    system:
      type: daos
      version: '2.8'
      access: api

    UNIQUE_TAG: "daos-api"

  children:
    physical_hosts:
      vars:
        ansible_host: "{{ inventory_hostname }}.{{ host_domain }}"
      children:
        ds:
          vars:
            local_storage_mode: raw-devices
            local_storage_devices:
              - /dev/nvme0n1
              - /dev/nvme1n1
              - /dev/nvme2n1
              - /dev/nvme3n1
              - /dev/nvme4n1
          hosts:
            ds[0:3]:

        clients:
          hosts:
            cli[0:3]:
