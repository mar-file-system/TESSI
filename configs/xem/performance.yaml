---
# Run BEFORE DAOS binds the SSDs to VFIO. FIO overwrites the listed devices.
all:
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    current_user: "{{ lookup('env', 'USER') }}"
    host_domain: "daos-{{ current_user }}.mvpnet"
    result_dir: "/proj/mvpnet/{{ current_user }}/experiments/performance"
    output_dir: "/tmp/{{ current_user }}/experiments"
    network:
      type: none
    playbooks:
      bootstrap_cluster: ./playbooks/shared/prereqs.yaml
      gold_install: ./playbooks/performance/install.yaml
      cluster_config: ./playbooks/performance/configure.yaml
      cluster_test: ./playbooks/performance/test.yaml
    system:
      type: performance
      version: '1'
      performance:
        # Separate stable system identity from timestamped individual runs.
        results_root: "/proj/mvpnet/{{ current_user }}/experiments/performance"
        allow_destructive_writes: true
        fio_runtime_seconds: 60
        fio_ramp_seconds: 5
        fio_size_per_device: 32G
        fio_iodepth: 32
        osu_iterations: 100
        osu_warmup_iterations: 20
        osu_max_message_bytes: 4194304
        command_timeout_seconds: 1800
    UNIQUE_TAG: performance
  children:
    physical_hosts:
      vars:
        ansible_host: "{{ inventory_hostname }}.{{ host_domain }}"
      children:
        ds:
          vars:
            local_storage_mode: raw-devices
            local_storage_devices:
              - /dev/nvme0n1
              - /dev/nvme1n1
              - /dev/nvme2n1
              - /dev/nvme3n1
              - /dev/nvme4n1
          hosts:
            ds[0:3]:
        clients:
          hosts:
            cli[0:3]:
