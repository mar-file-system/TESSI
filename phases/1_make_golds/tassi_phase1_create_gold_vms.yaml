- name: Clean and/or Install Empty Gold VM images
  hosts: physical_hosts
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  tasks:
    - block:
      - name: Distribute work
        include_tasks: distribute_vms_to_hosts.yaml
      tags: always

    - name: Show how many VMs are assigned to each host
      debug:
        msg: "{{ inventory_hostname }} has {{ assigned_vms | length | default(0) }} VMs assigned: {{ assigned_vms | map(attribute='name') | list | default([]) }}"

    - block:    
        - name: makeclean each VM if makeclean was passed
          include_tasks: makeclean.yaml
          with_items: "{{ assigned_vms }}"
          loop_control:
            label: "{{ item.name }}"
      when: "'makeclean' in ansible_run_tags" # don't run unless makeclean was passed
      tags: makeclean

    - name: Show qcow_file for each assigned_vm
      debug:
        msg: "VM {{ item.name }} qcow_file: {{ item.qcow_file }}"
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install each VM from a stock iso (if ENOENT) and ensure they are running
      include_tasks: install_vm.yaml
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"

- name: Add gold VMs to inventory  # new play because free strategy might not work well w/ adding hosts
  hosts: physical_hosts
  gather_facts: no
  tasks:
    # Per-host short-circuit: no assigned work? stop this host now.
    - meta: end_host
      when: (assigned_vms | default([])) | length == 0

    - name: Add each VM (that actually needs work) to dynamic inventory
      add_host:
        name: "{{ item.name }}"
        groups: "{{ item.group }},dynamic_hosts"
        ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -q {{ inventory_hostname }}' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add each VM to dynamic inventory
      add_host:
        name: "{{ vm.name }}"
        groups: "{{ vm.group }},dynamic_hosts"
        ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -q {{ physical_host }}' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      with_subelements:
        - "{{ vm_assignment | dict2items }}"
        - value
      loop_control:
        label: "{{ vm.name }}"
      vars:
        physical_host: "{{ item.0.key }}"
        vm: "{{ item.1 }}"
      when: vm is defined and false # this is the old way before we started trying to exit early if images already exist
      run_once: true

    - name: Show dynamic hosts that were added
      debug:
        var: groups['dynamic_hosts']
      run_once: true
      when: (groups['dynamic_hosts'] | default([])) | length > 0

- name: Debug dynamic host groups
  hosts: "{{ (groups['dynamic_hosts'] | default(['localhost'])) | join(',') }}"
  gather_facts: no
  tasks:
    - debug:
        msg: "Host {{ inventory_hostname }} is in groups: {{ group_names }}"
    - debug:
        var: hostvars[inventory_hostname]

- name: Install Custom Software onto the Gold VMs 
  hosts: "{{ groups['dynamic_hosts'] | default([]) }}"
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  tasks:
    - include_tasks: "{{ install_playbook }}"

- name: Save each gold VM to qcow2 
  hosts: physical_hosts
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  tasks:
    - meta: end_host
      when: (assigned_vms | default([])) | length == 0

    - name: Debug assigned VMs before including tasks
      debug:
        msg: "Would process VM: {{ item.name }} on {{ inventory_hostname }}"
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: assigned_vms | length > 0

    - name: Debug assigned VMs in the save each gold play
      debug:
        var: assigned_vms

    - include_tasks: vm_to_qcow.yaml
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: assigned_vms | length > 0
