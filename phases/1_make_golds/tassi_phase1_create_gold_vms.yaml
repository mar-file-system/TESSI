- name: Clean and/or Install Empty Gold VM images
  hosts: physical_hosts
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  tasks:
    - block:
      - name: Distribute work
        include_tasks: distribute_vms_to_hosts.yaml
      tags: always

    - block:    
        - name: makeclean each VM if makeclean was passed
          include_tasks: makeclean.yaml
          with_items: "{{ assigned_vms }}"
          loop_control:
            label: "{{ item.name }}"
      when: "'makeclean' in ansible_run_tags" # don't run unless makeclean was passed
      tags: makeclean

    - name: Install each VM from a stock iso (if ENOENT) and ensure they are running
      include_tasks: install_vm.yaml
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"

- name: Add gold VMs to inventory  #new play because free strategy might not work well w/ adding hosts
  hosts: physical_hosts
  gather_facts: no
  tasks:
    - add_host:
        name: "{{ vm.name }}"
        groups: "{{ vm.group }},dynamic_hosts"  # add them to a dynamic_hosts group also for easier filtering
        ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -q {{ physical_host }}' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      with_dict: "{{ vm_assignment }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        physical_host: "{{ item.key }}"
        vm: "{{ item.value | first }}"
      when: item.value | length > 0     # ignore physical hosts that may not have a gold VM assigned
      run_once: true

- name: Debug dynamic host groups
  hosts: "{{ (groups['dynamic_hosts'] | default(['localhost'])) | join(',') }}"
  gather_facts: no
  tasks:
    - debug:
        msg: "Host {{ inventory_hostname }} is in groups: {{ group_names }}"
    - debug:
        var: hostvars[inventory_hostname]

- name: Install Custom Software onto the Gold VMs 
  hosts: "{{ groups['dynamic_hosts'] | default([]) }}"
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  tasks:
    - include_tasks: "{{ install_playbook }}"

- name: Debug inventory before removing hosts
  hosts: all
  gather_facts: no
  tasks:
    - name: Show inventory groups and their hosts
      debug:
        var: groups

- name: Play to remove gold VMs from inventory # new play because free strategy might not work well w/ removing hosts
  hosts: "{{ groups['dynamic_hosts'] | default([]) }}"
  gather_facts: no
  tasks:
    - meta: end_host

- name: Debug inventory after removing hosts
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Show inventory groups and their hosts after removal
      debug:
        var: groups

- name: Play to refresh inventory after excluding the dynamic hosts 
  hosts: physical_hosts
  gather_facts: no
  tasks:
    - meta: refresh_inventory

    - name: Debug assigned VMs in the refresh play
      debug:
        var: assigned_vms

- name: Print all groups and their hosts
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Show inventory groups and their hosts
      debug:
        var: groups

- name: Save each gold VM to qcow2 
  hosts: physical_hosts
  gather_facts: no
  strategy: free    # allow independent processing for parallel execution
  tasks:
    - name: Debug assigned VMs save each gold play
      debug:
        var: assigned_vms

    - include_tasks: vm_to_qcow.yaml
      with_items: "{{ assigned_vms }}"
      loop_control:
        label: "{{ item.name }}"
