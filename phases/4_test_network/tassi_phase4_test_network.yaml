# Ansible Playbook for Dynamic Network Graph and Validation
- hosts: physical_hosts
  gather_facts: yes
  gather_subset:
    - network
  vars:
    ping_count: 3
  tasks:
    - name: Collect network information
      include_tasks: collect_network_info.yaml

    - name: Save collected data to a JSON file
      copy:
        content: "{{ hostvars | to_json }}"
        dest: /tmp/hostvars.json
      run_once: true
      delegate_to: localhost
      when: true 
      tags: debug

    - name: Ensure {{ image_dir }} directory
      ansible.builtin.file:
        path: "{{ image_dir }}"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Remove any previously rendered images from {{ image_dir }}
      ansible.builtin.shell: "rm -f {{ image_dir }}/*.png"
      args:
        warn: false
      tags: makeclean

    - name: Render graph in DOT format
      template:
        src: templates/graph.dot.j2
        dest: "{{ image_dir }}/graph.dot"
      run_once: true
      delegate_to: localhost

    - name: Convert DOT file to PNG
      shell: dot -Tpng {{ image_dir }}/graph.dot -o {{ image_dir }}/graph.png
      args:
        executable: /bin/bash
      register: dot_to_png_result
      run_once: true
      delegate_to: localhost

    - name: Initialize ping results
      set_fact:
        ping_results: []

    # Local pings
    - name: Ping the bridge interface on each host (local)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ hostvars[inventory_hostname].bridge_ip }}
      register: bridge_ping_results

    - name: Record bridge ping result
      set_fact:
        ping_results: >-
          {{
            ping_results + [{
              'src': ansible_default_ipv4.address,
              'dst': hostvars[inventory_hostname].bridge_ip,
              'success': (bridge_ping_results.rc == 0)
            }]
          }}

    - name: Ping the WireGuard tunnel on each host (local)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ hostvars[inventory_hostname].wireguard_ip_address.stdout }}
      register: wireguard_ping_results

    - name: Record WireGuard tunnel ping result
      set_fact:
        ping_results: >-
          {{
            ping_results + [{
              'src': ansible_default_ipv4.address,
              'dst': hostvars[inventory_hostname].wireguard_ip_address.stdout,
              'success': (wireguard_ping_results.rc == 0)
            }]
          }}

    - name: Ping VMs on the same host by IP address (local)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ item }}
      with_items: "{{ hostvars[inventory_hostname].vm_ips }}"
      register: vm_local_ping_results
      ignore_errors: yes

    - name: Record VM ping results by IP
      include_tasks: record_ping_results.yaml
      vars:
        ping_results_data: "{{ vm_local_ping_results.results }}"

    - name: Ping VMs on the same host by hostname (local)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ item }}
      with_items: "{{ matching_vms }}"
      register: vm_local_hostname_ping_results
      ignore_errors: yes

    - name: Record VM ping results by hostname
      include_tasks: record_ping_results.yaml
      vars:
        ping_results_data: "{{ vm_local_hostname_ping_results.results }}"

    - name: Ping WireGuard endpoints on other hosts (remote)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ item }}
      with_items: >-
        {{
          groups['physical_hosts']
          | reject('equalto', inventory_hostname)
          | map('extract', hostvars, 'wireguard_ip')
          | list
        }}
      register: wireguard_peer_ping_results

    - name: Record WireGuard endpoint ping results
      include_tasks: record_ping_results.yaml
      vars:
        ping_results_data: "{{ wireguard_peer_ping_results.results }}"

    - name: Ping bridges on other hosts (remote)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ item }}
      with_items: "{{ groups['physical_hosts'] | map('extract', hostvars, 'bridge_ip') | difference([hostvars[inventory_hostname].bridge_ip]) }}"
      register: bridge_peer_ping_results

    - name: Record bridge ping results for other hosts
      include_tasks: record_ping_results.yaml
      vars:
        ping_results_data: "{{ bridge_peer_ping_results.results }}"

    - name: Ping VMs on other hosts by IP address (remote)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ item }}
      with_items: "{{ groups['physical_hosts'] | map('extract', hostvars, 'vm_ips') | sum(start=[]) | difference(hostvars[inventory_hostname].vm_ips) }}"
      register: vm_peer_ping_results
      ignore_errors: yes

    - name: Record VM ping results for other hosts by IP address
      include_tasks: record_ping_results.yaml
      vars:
        ping_results_data: "{{ vm_peer_ping_results.results }}"

    - name: Ping VMs on other hosts by hostname (remote)
      ansible.builtin.shell: |
        ping -c {{ ping_count }} {{ item }}
      with_items: >-
        {{
          groups['physical_hosts']
          | map('extract', hostvars, 'matching_vms')
          | sum(start=[])
          | difference(hostvars[inventory_hostname].matching_vms)
        }}
      register: vm_peer_hostname_ping_results
      ignore_errors: yes

    - name: Record VM ping results for other hosts by hostname
      include_tasks: record_ping_results.yaml
      vars:
        ping_results_data: "{{ vm_peer_hostname_ping_results.results }}"

    # Aggregate ping results globally
    - name: Aggregate all ping results
      ansible.builtin.set_fact:
        aggregated_ping_results: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'ping_results')
            | sum(start=[])
          }}  
      delegate_to: localhost
      run_once: true

    # Generate a DOT file for the ping results
    - name: Render ping results in DOT format
      ansible.builtin.template:
        src: templates/ping_results.dot.j2
        dest: "{{ image_dir }}/ping_results.dot"
      delegate_to: localhost
      run_once: true

    # Convert DOT file to PNG
    - name: Convert DOT file to PNG
      ansible.builtin.shell: |
        dot -Tpng {{ image_dir }}/ping_results.dot -o {{ image_dir }}/ping_results.png
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true

    - name: Ensure dynamic_hosts group exists by adding localhost only when tags makeclean is passed
      add_host:
        name: dummyhost
        groups: dynamic_hosts
      delegate_to: localhost
      run_once: true
      tags: makeclean
      when: "'makeclean' in ansible_run_tags"

    # Add VMs to inventory
    - name: Add VMs to inventory
      add_host:
        name: "{{ item }}"  # Add each VM hostname
        groups: "dynamic_hosts"  # Assign to dynamic_hosts group
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"  
      with_items: "{{ aggregated_matching_vms }}"
      delegate_to: localhost
      run_once: true

- name: Verify dynamic_hosts group
  hosts: dynamic_hosts
  gather_facts: no
  tasks:
    - debug:
        msg: "Hostname: {{ inventory_hostname }}"

    - name: Re-initialize ping results
      set_fact:
        ping_results: []

    - name: All VMs ping each other 
      ansible.builtin.shell: |
        ping -c {{ ping_count | default(3) }} {{ item }}
      # to get list of other vms, use aggregated_matching_vms from the first in the list of original hosts
      with_items: >-
        {{
          hostvars[
            (groups['all'] | difference(groups['dynamic_hosts']) | first)
          ].aggregated_matching_vms
          | difference([inventory_hostname])  
        }}
      register: vm_vm_ping_results 
      ignore_errors: yes

    - name: Record VM-VM ping results 
      include_tasks: record_ping_results.yaml
      vars:
        ping_results_data: "{{  vm_vm_ping_results.results }}"
        dont_use_ip: true

    - name: Aggregate vm-vm ping results
      ansible.builtin.set_fact:
        aggregated_ping_results: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'ping_results')
            | sum(start=[])
          }}
      delegate_to: localhost
      run_once: true

    - name: Debug vm-vm ping results
      debug:
        var: aggregated_ping_results
      delegate_to: localhost
      run_once: true

    # TODO: create a taskfile for these two tasks and share it with the above dot to png tasks
    # Generate a DOT file for the vm-vm ping results
    - name: Render ping results in DOT format
      ansible.builtin.template:
        src: templates/ping_results_vm_vm.dot.j2
        dest: "{{ image_dir }}/ping_results_vm_vm.dot"
      delegate_to: localhost
      run_once: true

    # Convert DOT file to PNG
    - name: Convert DOT file to PNG
      ansible.builtin.shell: |
        dot -Kcirco -Tpng {{ image_dir }}/ping_results_vm_vm.dot -o {{ image_dir }}/ping_results_vm_vm.png
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true

    - name: Message final status
      debug:
        msg: "Graphs of network structure and status now available in {{ image_dir }}"
      delegate_to: localhost
      run_once: true
