---
- name: Set up TASSI virtual networking 
  hosts: physical_hosts
  any_errors_fatal: yes
  vars:
    etchosts_mark: "# {mark} TASSI {{ UNIQUE_TAG }} VMs - managed by Ansible"
  tasks:

    # This setup involves three key networking components:
    # 1. A bridge interface (bridge.interface) - Acts as a central connection point for the virtual network.
    # 2. A libvirt network (libvirt.name) - Defines a virtual network in libvirt, referencing the bridge.
    # 3. A VXLAN interface (vxlan.interface) - A virtual Layer 2 overlay network that connects distributed nodes.

    - name: Check if interface names exceed 15 characters
      ansible.builtin.fail:
        msg: "Interface name '{{ item }}' is too long (max 15 characters)."
      when: item | length > 15
      with_items:
        - "{{ libvirt.name }}"
        - "{{ vxlan.interface }}"
        - "{{ bridge.interface }}"

    - name: Cleanup block
      block:
        - name: Remove VM mappings from /etc/hosts
          blockinfile:
            path: /etc/hosts
            state: absent
            marker: "{{ etchosts_mark }}"

        - name: Remove network interface connection (nmcli)
          community.general.nmcli:
            conn_name: "{{ item }}"
            state: absent
          ignore_errors: yes
          with_items:
            - "{{ vxlan.interface }}"
            - "{{ bridge.interface }}"

        # Fallback: Ensure the interface is deleted manually
        - name: Ensure interface is deleted in case nmcli doesn't remove
          command: ip link del {{ item }}
          ignore_errors: yes
          with_items:
            - "{{ vxlan.interface }}"
            - "{{ bridge.interface }}"

        - name: Gather libvirt network facts
          community.libvirt.virt_net:
            command: facts
          register: libvirt_facts

        - debug:
            var: libvirt_facts

        - block:
          - name: Destroy libvirt network if it is active
            command: "virsh net-destroy {{ libvirt.name }}"
            when:
              - libvirt_facts.ansible_facts.ansible_libvirt_networks[libvirt.name].state == "active"

          - name: Undefine libvirt network if it exists
            command: "virsh net-undefine {{ libvirt.name }}"
          when: libvirt.name in libvirt_facts.ansible_facts.ansible_libvirt_networks

      tags: makeclean

    - name: Create probabilistically unique vxlan ID and multicast group IP 
      block:
        - name: Generate numeric hashes from UNIQUE_TAG
          set_fact:
            hash1: "{{ UNIQUE_TAG | hash('md5')    | int(base=16) }}"
            hash2: "{{ UNIQUE_TAG | hash('sha256') | int(base=16) }}"

        - name: Compute VXLAN ID (1 - 16,777,215)
          set_fact:
            vxlan_id: "{{ (hash1 | int) % 16777215 + 1 }}"

        - name: Compute Multicast Group (239.1.X.Y)
          set_fact:
            multicast_group: "239.1.{{ (hash2 | int) % 255 }}.{{ (hash1 | int) % 255 }}"

        - name: Display computed values
          debug:
            msg:
              - "Computed VXLAN ID: {{ vxlan_id }}"
              - "Computed Multicast Group: {{ multicast_group }}"

    - name: Create the libvirt networks and the bridges and the vxlan interfaces 
      block:
        - name: Add bridge connection
          command: nmcli connection add type bridge con-name {{ bridge.interface }} ifname {{ bridge.interface }} ipv4.method disabled ipv6.method disabled

        - name: Add VXLAN interface
          command: ip link add {{ vxlan.interface }} type vxlan id {{ vxlan_id }} group {{ multicast_group }} dev {{ ansible_default_ipv4.interface }} dstport 4789 

        - name: Bring up VXLAN interface
          command: ip link set {{ vxlan.interface }} up

        - name: Attach VXLAN interface to bridge
          command: ip link set {{ vxlan.interface }} master {{ bridge.interface }}
            
        - name: Bring up bridge connection
          command: nmcli connection up {{ bridge.interface }}

        - name: Define libvirt network XML for L2 passthrough
          community.libvirt.virt_net:
            name: "{{ libvirt.name }}"
            state: present
            xml: |
              <network>
                  <name>{{ libvirt.name }}</name>
                  <forward mode="bridge" />
                  <bridge name="{{ bridge.interface }}" />
              </network>
          register: libvirt_network_result

        # put a quote " to fix vim formatting which is broken here for some reason by the above task

        - name: Create libvirt network
          community.libvirt.virt_net:
            name: "{{ libvirt.name }}"
            state: active

        - name: Set libvirt network to autostart
          community.libvirt.virt_net:
            name: "{{ libvirt.name }}"
            autostart: true
