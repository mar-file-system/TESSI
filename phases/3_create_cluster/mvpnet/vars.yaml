mvpnet_verbosity: INFO # EMERGE ALERT CRIT ERR WARN NOTE INFO DBG 
mvpnet_workdir: "{{ local_storage }}/mvpnet"
mvpnet_log: "{{ mvpnet_workdir }}/mpirun.log"
hdd_image_dir: "{{ local_storage }}/{{ UNIQUE_TAG }}/hdds/"
mpi_hostfile: "{{ mvpnet_workdir }}/hosts"
pid_file: "{{ mvpnet_workdir }}/mpirun.pid"
cloudinit_dir: "{{ mvpnet_workdir }}/cloudinit"
sshconfig: "{{ lookup('env','HOME') }}/.ssh/config"
sshconfigmark: "# {mark} {{ UNIQUE_TAG }}"
