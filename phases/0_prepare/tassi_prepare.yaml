---
- name: Sanitize and Update Control Node Fingerprints
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove old host fingerprints
      ansible.builtin.known_hosts:
        name: "{{ item }}"
        state: absent
      loop: "{{ groups['all'] }}"

    - name: Scan and add new host fingerprints
      ansible.builtin.command: "ssh-keyscan {{ hostvars[item].ansible_host | default(item) }}"
      loop: "{{ groups['physical_hosts'] }}"
      register: keyscan_results
      # This handles any temporary DNS/network glitches gracefully up to 5 times
      until: keyscan_results.rc == 0
      retries: 5
      delay: 3
      throttle: 1

    - name: Add fingerprints to known_hosts
      ansible.builtin.known_hosts:
        # Split the key line by spaces and grab the first element (the host string)
        name: "{{ item.1.split(' ')[0] }}"
        key: "{{ item.1 }}"
        state: present
      with_subelements:
        - "{{ keyscan_results.results }}"
        - stdout_lines
      when:
        - item.0.rc is defined
        - item.0.rc == 0
        - item.1 | length > 0
        - not item.1.startswith('#')  # <-- ADD THIS LINE HERE

- name: Install necessary prerequisites
  hosts: "{{ 'physical_hosts' if 'physical_hosts' in groups else 'localhost' }}"
  gather_facts: true
  become: false
  tasks:

    - name: Include the user-provided cluster preparation tasks (moved to bootstrap)
      ansible.builtin.include_tasks: "{{ prepare_cluster_playbook }}"
      when:
        - prepare_cluster_playbook is defined
        - prepare_cluster_playbook | length > 0
        - prepare_cluster_playbook != 'NONE'
        - false

    - block:

      - name: Find and read local public key
        delegate_to: localhost
        run_once: true
        set_fact:
          local_pub_key: "{{ lookup('file', lookup('first_found', key_list), errors='strict') }}"
        vars:
          key_list:
            - "~/.ssh/id_rsa.pub"
            - "~/.ssh/id_ed25519.pub"
            - "~/.ssh/id_ecdsa.pub"

      - name: Ensure SSH keys are present on Physical Hosts (User and Root)
        become: true
        authorized_key:
          user: "{{ item }}"
          state: present
          key: "{{ local_pub_key }}"
        loop:
          - "{{ ansible_user_id }}"
          - root
        when: inventory_hostname != 'localhost'

      - name: Install necessary tools on physical hosts
        include_tasks: "prepare_tools.yaml"

      - name: Make sure that libvirt service is good
        become: true
        block:
        - name: Stop libvirtd service
          systemd:
            name: libvirtd.service
            state: stopped

        - name: Reset failed state for libvirtd.service
          command: systemctl reset-failed libvirtd.service
          failed_when: false
          changed_when: false

        - name: Enable modular libvirt with legacy compatibility
          systemd:
            name: "{{ item }}"
            state: started
            enabled: yes
          loop:
            - virtqemud.socket
            - virtnetworkd.socket
            - virtstoraged.socket
            - libvirtd.socket  # This creates the /run/libvirt/libvirt-sock proxy
        when: network.type != 'none'

