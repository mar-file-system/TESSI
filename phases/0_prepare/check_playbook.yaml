# check_playbook_path.yaml

- name: "Fail if required variable playbooks.{{ var_name }} is not defined"
  fail:
    msg: "playbooks.{{ var_name }} must be defined"
  when: required and (playbooks[var_name] is not defined)

- name: "Check if playbooks.{{ var_name }} path exists"
  stat:
    path: "{{ playbooks[var_name] }}"
  register: playbook_stat
  when: playbooks[var_name] is defined

- name: "Fail if playbooks.{{ var_name }} does not point to an existing file"
  fail:
    msg: "playbooks.{{ var_name }} points to a non-existent file: {{ playbooks[var_name] }}"
  when:
    - playbooks[var_name] is defined
    - not playbook_stat.stat.exists

