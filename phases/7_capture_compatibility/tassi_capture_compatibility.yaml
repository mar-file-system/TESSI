---
# Play 1: Out-of-band collection across the first node of your active group
- name: Harvest Dynamic Facts From Target Infrastructure
  hosts: "{{ groups['physical_hosts'][0] }}"
  gather_facts: true
  tasks:
    - name: Verify cluster connectivity and cache system variables
      ansible.builtin.ping:

# Play 2: Single-node execution on the control node to process the matrix
- name: Compile and Write Root Compatibility Matrix
  hosts: localhost
  gather_facts: false
  vars:
    # Adjust relative path defaults if needed to match repository root
    tessi_compatibility_matrix_path: "{{ playbook_dir }}/../../compatibility.yaml"

  tasks:
    - name: Gather Local Git and User Details
      block:
        - name: Get latest git commit hash
          ansible.builtin.command: "git rev-parse --short HEAD"
          register: git_commit
          changed_when: false

        - name: Identify active local user running the playbook
          ansible.builtin.command: "whoami"
          register: local_user
          changed_when: false

    - name: Read existing matrix dictionary from repo root
      ansible.builtin.include_vars:
        file: "{{ tessi_compatibility_matrix_path }}"
        name: existing_data
      failed_when: false

    - name: Extract base matrix configuration to a dictionary object
      ansible.builtin.set_fact:
        base_matrix_dict: "{{ (existing_data.compatibility_matrix is defined and existing_data.compatibility_matrix is string) | ternary(existing_data.compatibility_matrix | from_yaml, existing_data.compatibility_matrix | default({}, true)) }}"

    - name: Build new matrix entries loop as a raw JSON string
      ansible.builtin.set_fact:
        new_entries_json: >-
          {% set entries = {} %}
          {% set target_fact_host = groups['physical_hosts'][0] %}
          {% set fact_vars = hostvars[target_fact_host] %}
          
          {% for host in groups['physical_hosts'] %}
            {% set hvars = hostvars[host] %}
            
            {# Extract short name fallback matching (e.g. tessi0 from tessi0.ubuntu.mvpnet) #}
            {% set short_name = host.split('.')[0] %}
            {% set short_hvars = hostvars[short_name] | default({}) %}
            
            {# Map exact specific parameters required by your operational architecture #}
            {% set target_system = hvars.fstype | default(short_hvars.fstype) | default(fstype) %}
            {% set target_network = hvars.network.type | default(short_hvars.network.type) | default(network.type) %}
            
            {# Track dynamic cluster facts cleanly #}
            {% set current_distro = fact_vars.ansible_distribution %}
            {% set current_version = fact_vars.ansible_distribution_major_version %}
            {% set current_kernel = fact_vars.ansible_kernel %}
            {% set current_arch = fact_vars.ansible_architecture %}
            
            {% set compound_key = target_system ~ '.' ~ target_network ~ '.' ~ (current_distro | lower) ~ '.' ~ current_version %}
            {% set node_details = {
              'system': target_system,
              'network': target_network,
              'distro': current_distro,
              'distro_version': current_version,
              'fqdn': hvars.ansible_fqdn | default(host),
              'ansible_user': hvars.ansible_user | default(local_user.stdout),
              'kernel': current_kernel,
              'arch': current_arch,
              'last_git_commit': git_commit.stdout,
              'recorded_by_user': local_user.stdout,
              'timestamp': now(fmt='%Y-%m-%d %H:%M:%S')
            } %}
            {% set _ = entries.update({compound_key: node_details}) %}
          {% endfor %}
          {{ entries | to_json }}

    - name: DEBUG - State of Matrix Variables Before Combining
      ansible.builtin.debug:
        msg:
          - "================= FILE CONTENT FROM DISK ================="
          - "Raw File Content Variable: {{ existing_data.compatibility_matrix | default('NOT_DEFINED') }}"
          - "File Content Type: {{ existing_data.compatibility_matrix | type_debug }}"
          - "Typecast Base Dict Variable: {{ base_matrix_dict }}"
          - "Typecast Base Dict Type: {{ base_matrix_dict | type_debug }}"
          - "================== NEW ENTRIES TO ADD =================="
          - "Raw Loop JSON String: {{ new_entries_json }}"
          - "Parsed Loop Dict Type: {{ (new_entries_json | from_json) | type_debug }}"

    - name: Atomic Merge Data Structures
      ansible.builtin.set_fact:
        current_matrix: "{{ base_matrix_dict | combine(new_entries_json | from_json) }}"

    - name: DEBUG - Result of Successful Merge
      ansible.builtin.debug:
        msg:
          - "================= COMBINED MATRIX OBJECT ================="
          - "Combined Output: {{ current_matrix }}"
          - "Combined Output Type: {{ current_matrix | type_debug }}"

    - name: Generate the verified compatibility template string
      ansible.builtin.set_fact:
        matrix_file_content: |
          # AUTOGENERATED. DO NOT EDIT.
          {{ {'compatibility_matrix': current_matrix} | to_nice_yaml(indent=2) }}

    - name: Commit updated matrix dictionary back to repository root
      ansible.builtin.copy:
        content: "{{ matrix_file_content }}"
        dest: "{{ tessi_compatibility_matrix_path }}"
        mode: '0644'
